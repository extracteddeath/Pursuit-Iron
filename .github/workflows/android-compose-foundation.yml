name: Android Compose foundation contracts
on:
  push:
    branches:
      - architecture/android-compose-foundation
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-compose-foundation.yml'
jobs:
  canonical-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical engine bridge contract
        run: |
          node android-native/engine-bridge/protocol-test.mjs
          node android-native/engine-bridge/workout-store-protocol-test.mjs
          node android-native/engine-bridge/native-onboarding-test.mjs
          node android-native/engine-bridge/native-workout-test.mjs
          node android-native/engine-bridge/native-workout-deload-test.mjs
          node android-native/engine-bridge/native-workout-correction-test.mjs
          node android-native/engine-bridge/native-history-test.mjs
          node android-native/engine-bridge/backup-schema-check-test.mjs
          node android-native/engine-bridge/sandbox-compat-test.mjs
      - name: Verify fixed language-neutral progression fixtures and Kotlin routing contracts
        run: node android-native/engine-contract/contract-parity-test.mjs
      - name: Reject drifted or untrusted canonical engine snapshots
        run: node android-native/engine-contract/snapshot-identity-test.mjs
      - name: Verify canonical JS engine snapshot identity and independent parity
        run: |
          snapshot="$(mktemp -d)"
          trap 'rm -rf "$snapshot"' EXIT
          node engine-lab/canonical-export.mjs "$snapshot"
          node "$snapshot/scripts/verify-snapshot.mjs"
          node engine-lab/verify-parity.mjs "$snapshot"
          node android-native/engine-contract/snapshot-identity.mjs "$snapshot"
      - name: Validate read-only backup inspector
        run: node android-native/data-migration/inspect-backup-test.mjs
      - name: Validate canonical backup parser without writing data
        run: node android-native/data-migration/validate-canonical-backup-test.mjs
      - name: Verify synthetic canonical v13 round-trip and revision-conflict policy
        run: node android-native/data-migration/roundtrip-revisions-test.mjs
      - name: Verify finished native journal handoff to canonical history without writes
        run: node android-native/data-migration/workout-history-completion-test.mjs
      - name: Verify source-backed read-only saved-program identity and tombstones
        run: node android-native/data-migration/read-only-program-reference-test.mjs
      - name: Verify canonical read-only program transport against shared Kotlin fixture
        run: node android-native/data-migration/read-only-program-transport-test.mjs
      - name: Ensure feature-first contract preserves all capabilities and gates
        run: node android-native/verification/feature-contract-test.mjs
      - name: Verify native preview draft, focus and shared controls
        run: |
          node android-native/verification/native-preview-interaction-test.mjs
          node android-native/verification/native-onboarding-interaction-test.mjs
      - name: Verify preview Material 3 Expressive dependency and motion contract
        run: node android-native/verification/m3e-version-test.mjs
      - name: Protect existing feature behavior with canonical regression fixtures
        run: |
          node verification/progression-safety-test.mjs
          node verification/one-shot-deload-test.mjs
          node verification/history-edit-integrity-test.mjs
          node verification/m183-progression-safeguards-test.mjs
          node verification/b945-plate-calculator-test.mjs
          node verification/m177-history-merge-integrity-test.mjs
          node verification/b889-injury-journal-test.mjs
          node verification/shorter-session-test.mjs
          node verification/b944-readiness-test.mjs
          node verification/m222-custom-program-parity-test.mjs
          node verification/m190-progression-lifecycle-test.mjs
      - name: Verify native engine sandbox separation, failure gates and build cadence
        run: node android-native/verification/engine-sandbox-isolation-test.mjs
      - name: Enforce no APK builds before verified onboarding-to-completion journey
        run: node android-native/verification/no-apk-before-end-to-end-test.mjs
      - name: Verify native preview cannot run without canonical engine
        run: |
          test -f modules/engine-api.js
          test -f android-native/domain-contract/src/main/java/io/github/extracteddeath/pursuitiron/domain/EngineGateway.kt
          grep -q 'UnconnectedEngineGateway' android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativePreviewApp.kt
          grep -q 'Complete set · engine not connected' android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeScreens.kt
