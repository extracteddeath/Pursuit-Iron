name: Canonical Android engine JS bundle proof (no APK)

on:
  push:
    branches:
      - architecture/android-compose-foundation
    paths:
      - 'android-native/engine-bridge/**'
      - 'android-native/engine-contract/**'
      - '.github/workflows/android-engine-bundle.yml'
      - 'modules/engine-api.js'
      - 'modules/next-engine/**'
      - 'modules/training-domain/**'
  workflow_dispatch:

concurrency:
  group: android-engine-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-canonical-js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm existing canonical protocol and fixture behavior
        run: |
          node android-native/engine-bridge/protocol-test.mjs
          node android-native/engine-bridge/sandbox-compat-test.mjs
          node android-native/engine-contract/contract-parity-test.mjs
      - name: Export and verify exact canonical JS runtime closure
        run: |
          temp="$(mktemp -d)"
          echo "BUNDLE_PROOF_DIR=$temp" >> "$GITHUB_ENV"
          node engine-lab/canonical-export.mjs "$temp"
          node "$temp/scripts/verify-snapshot.mjs"
          node engine-lab/verify-parity.mjs "$temp"
          node android-native/engine-contract/snapshot-identity.mjs "$temp"
          mkdir -p "$temp/android-native/engine-bridge"
          cp android-native/engine-bridge/protocol.mjs "$temp/android-native/engine-bridge/protocol.mjs"
          cp android-native/engine-bridge/progression-preview.mjs "$temp/android-native/engine-bridge/progression-preview.mjs"
          cp android-native/engine-bridge/exercise-lookup.mjs "$temp/android-native/engine-bridge/exercise-lookup.mjs"
          cp android-native/engine-bridge/workout-outline.mjs "$temp/android-native/engine-bridge/"
          cp android-native/engine-bridge/android-entry.mjs "$temp/android-native/engine-bridge/android-entry.mjs"
          cp android-native/engine-bridge/sandbox-compat.mjs "$temp/android-native/engine-bridge/sandbox-compat.mjs"
      - name: Produce disposable IIFE from the verified snapshot (pinned esbuild)
        run: |
          npx --yes esbuild@0.28.2 "$BUNDLE_PROOF_DIR/android-native/engine-bridge/android-entry.mjs" \
            --bundle --format=iife --platform=browser --target=es2020 \
            --global-name=PursuitIronBridge --legal-comments=none \
            --metafile="$BUNDLE_PROOF_DIR/metafile.json" --outfile="$BUNDLE_PROOF_DIR/engine.js"
      - name: Check manifest tampering and fail-closed certification fields
        run: node android-native/engine-contract/bundle-manifest-test.mjs
      - name: Check offline bundle, canonical source closure, syntax and digest
        run: |
          node --check "$BUNDLE_PROOF_DIR/engine.js"
          node android-native/engine-bridge/verify-bundle-structure.mjs \
            "$BUNDLE_PROOF_DIR/engine.js" "$BUNDLE_PROOF_DIR/metafile.json" "$BUNDLE_PROOF_DIR"
          node android-native/engine-contract/create-bundle-manifest.mjs \
            "$BUNDLE_PROOF_DIR" "$BUNDLE_PROOF_DIR/engine.js" "$BUNDLE_PROOF_DIR/bundle-manifest.json"
