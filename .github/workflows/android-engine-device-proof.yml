name: Android sandbox on-device engine proof (milestone)

# On-device instrumentation assembles APKs; postpone it until the full
# onboarding-to-completion milestone rather than treating it as a routine check.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-android-engine-device-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-device-proof:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android compile SDK 37.0
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build canonical JS engine assets from verified snapshot
        run: |
          snapshot="$(mktemp -d)"
          trap 'rm -rf "$snapshot"' EXIT
          node engine-lab/canonical-export.mjs "$snapshot"
          node "$snapshot/scripts/verify-snapshot.mjs"
          node engine-lab/verify-parity.mjs "$snapshot"
          node android-native/engine-contract/snapshot-identity.mjs "$snapshot"
          node android-native/engine-bridge/stage-bundle-sources.mjs "$snapshot"
          mkdir -p android-native/engine-runtime/src/androidTest/assets
          npx --yes esbuild@0.28.2 "$snapshot/android-native/engine-bridge/android-entry.mjs" \
            --bundle --format=iife --platform=browser --target=es2020 \
            --global-name=PursuitIronBridge --legal-comments=none \
            --outfile=android-native/engine-runtime/src/androidTest/assets/canonical-engine.js
          node --check android-native/engine-runtime/src/androidTest/assets/canonical-engine.js
          sha256sum android-native/engine-runtime/src/androidTest/assets/canonical-engine.js \
            | cut -d' ' -f1 > android-native/engine-runtime/src/androidTest/assets/canonical-engine.sha256
          node android-native/engine-contract/export-android-parity.mjs \
            android-native/engine-contract/progression-golden.json \
            android-native/engine-runtime/src/androidTest/assets/progression-golden.json
          npx --yes esbuild@0.28.2 android-native/engine-bridge/sandbox-diagnostic.mjs \
            --bundle --format=iife --platform=browser --target=es2020 \
            --global-name=PursuitIronDiagnostic --legal-comments=none \
            --outfile=android-native/engine-runtime/src/androidTest/assets/sandbox-diagnostic.js
          sha256sum android-native/engine-runtime/src/androidTest/assets/sandbox-diagnostic.js \
            | cut -d' ' -f1 > android-native/engine-runtime/src/androidTest/assets/sandbox-diagnostic.sha256
          node android-native/engine-contract/contract-parity-test.mjs
          node android-native/engine-bridge/sandbox-compat-test.mjs
      - name: Allow Linux Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify canonical progression parity and read-only service lifecycle on API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          working-directory: android-native
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle :engine-runtime:connectedDebugAndroidTest --no-daemon --stacktrace
