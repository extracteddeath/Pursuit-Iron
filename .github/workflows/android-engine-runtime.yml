name: Android engine sandbox module compilation

on:
  push:
    branches:
      - architecture/android-compose-foundation
    paths:
      - 'android-native/engine-runtime/**'
      - 'android-native/settings.gradle.kts'
      - '.github/workflows/android-engine-runtime.yml'
  workflow_dispatch:

concurrency:
  group: android-sandbox-compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile sandbox unit tests and instrumented test APK (no preview build)
        working-directory: android-native
        run: gradle :engine-runtime:testDebugUnitTest :engine-runtime:assembleDebugAndroidTest --no-daemon --stacktrace
