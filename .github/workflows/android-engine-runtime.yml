name: Android engine sandbox module compilation

on:
  push:
    branches:
      - architecture/android-compose-foundation
    paths:
      - 'android-native/engine-runtime/**'
      - 'android-native/domain-contract/**'
      - 'android-native/engine-bridge/**'
      - 'android-native/engine-contract/**'
      - 'android-native/settings.gradle.kts'
      - '.github/workflows/android-engine-runtime.yml'
  workflow_dispatch:

concurrency:
  group: android-sandbox-compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify packaged canonical runtime for JVM integration (no APK)
        run: |
          node android-native/engine-contract/build-runtime-proof.mjs "$RUNNER_TEMP/workout-store-proof"
          echo "PURSUIT_CANONICAL_REPO=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "PURSUIT_CANONICAL_BUNDLE=$RUNNER_TEMP/workout-store-proof/canonical-engine.js" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify sandbox JVM tests and compile Java instrumentation sources (no APK)
        working-directory: android-native
        run: gradle :engine-runtime:testDebugUnitTest :engine-runtime:compileDebugAndroidTestJavaWithJavac --no-daemon --stacktrace
