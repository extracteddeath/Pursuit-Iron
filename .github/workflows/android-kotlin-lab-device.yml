name: Pursuit Iron Kotlin Lab — one-time device-test APK

# Explicit source-tested milestone only. Never run for ordinary rebuild
# commits, manual dispatch, the production branch or the other native preview.
on:
  push:
    branches:
      - architecture/kotlin-engine-rebuild
    paths:
      - 'android-native/KOTLIN_LAB_DEVICE_TEST.md'

concurrency:
  group: kotlin-lab-one-shot-device-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-isolated-kotlin-lab:
    if: "${{ startsWith(github.event.head_commit.message, 'milestone(kotlin): device lab ') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Android API 37
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Check source-only Kotlin isolation and full-journey guards
        run: |
          node android-native/kotlin-engine/verification/offline-only-test.mjs
          node android-native/kotlin-engine/verification/feature-scope-contract.mjs
          node android-native/verification/native-core-journey-test.mjs
          node android-native/verification/native-onboarding-interaction-test.mjs
          node android-native/verification/native-original-theme-parity-test.mjs
          node android-native/verification/no-apk-before-end-to-end-test.mjs
          node android-native/verification/kotlin-lab-navigation-test.mjs
          node android-native/verification/kotlin-lab-workout-ui-test.mjs
          grep -q 'KotlinEnginePreviewActivity' android-native/app/src/debug/AndroidManifest.xml
          grep -q 'applicationIdSuffix = ".kotlinlab"' android-native/app/build.gradle.kts
      - name: Test native program decisions and durable workout history
        working-directory: android-native
        run: gradle :kotlin-engine:testDebugUnitTest :native-coach-store:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile and assemble isolated Kotlin Lab debug APK
        working-directory: android-native
        run: gradle :app:assembleDebug :app:processDebugMainManifest --no-daemon --stacktrace -PkotlinLabBuildNumber=${{ github.run_number }}
      - name: Verify signed-out test device build output and checksum
        run: |
          test -s android-native/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk \
            > android-native/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload non-production Kotlin Lab device test
        uses: actions/upload-artifact@v4
        with:
          name: pursuit-iron-kotlin-lab-device-test
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
