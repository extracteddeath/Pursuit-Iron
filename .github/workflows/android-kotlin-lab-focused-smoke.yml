name: Pursuit Iron Kotlin Lab Trial 12 — focused workout smoke

# Exercise ONLY the source-verified focused-workout APK from run 42521928675.
# No new signing keys, AAB release or production app changes.
on:
  push:
    branches:
      - architecture/kotlin-engine-rebuild
    paths:
      - 'android-native/KOTLIN_LAB_FOCUSED_SMOKE.md'

permissions:
  contents: read
  actions: read

jobs:
  smoke-disposable-kotlin-lab:
    if: "startsWith(github.event.head_commit.message, 'milestone(kotlin): focused emulator smoke ')"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Download already-built disposable APK and receipt
        uses: actions/download-artifact@v4
        with:
          run-id: 42521928675
          github-token: ${{ github.token }}
          name: pursuit-iron-kotlin-lab-disposable
          path: trial
      - name: Check frozen source and install identity
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(find trial -name disposable-trial-receipt.txt -print -quit)"
          test -n "$receipt"
          grep -Fx 'sourceCommit=ab210d86ade815c873a65b8f9d69800166d37694' "$receipt"
          grep -Fx 'applicationId=io.github.extracteddeath.pursuitiron.kotlinlabtrial12' "$receipt"
          grep -Fx 'deviceAcceptance=NOT_TESTED' "$receipt"
          grep -Fx 'versionCode=12' "$receipt"
          apk="$(find trial -name '*.apk' -print -quit)"
          test -s "$apk"
          sha="$(sha256sum "$apk" | cut -d' ' -f1)"
          grep -F "$sha  " "$receipt"
      - name: Enable Linux KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run startup and real setup-to-History UI journey
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            KOTLIN_LAB_TRIAL_PACKAGE=io.github.extracteddeath.pursuitiron.kotlinlabtrial12 bash android-native/verification/kotlin-lab-emulator-smoke.sh
            python3 android-native/verification/kotlin-lab-onboarding-journey.py --package io.github.extracteddeath.pursuitiron.kotlinlabtrial12
      - name: Upload actual emulator screen, UI tree, and diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-lab-trial12-focused-emulator-journey
          path: smoke-out
          if-no-files-found: warn
          retention-days: 14
