name: Independent Kotlin engine rules — tests only
on:
  push:
    branches:
      - architecture/kotlin-engine-rebuild
    paths:
      - 'android-native/kotlin-engine/**'
      - 'android-native/native-coach-store/**'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/AppPrivateKotlinLocalAthlete.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinCandidateHost.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinCustomCycle*.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinCustomCoachPolicyEditor.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinCustomExerciseSheet.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinGymSource*.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinOnboardingCandidateScreen.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinFirstProgramCandidateScreen.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinCoachSettingsScreen.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinCandidateJourney.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinCandidateHistoryScreen.kt'
      - 'android-native/app/src/debug/**'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinCandidateCoachScreen.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinFutureWeekCoachScreen.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinCustomJournalScreen.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinSessionController.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinWorkoutCandidateScreen.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinWorkoutRestTimer.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeRestTimer.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/PursuitIronApplication.kt'
      - 'android-native/app/build.gradle.kts'
      - 'android-native/settings.gradle.kts'
      - '.github/workflows/android-kotlin-rebuild.yml'
      - 'android-native/app/src/main/AndroidManifest.xml'
      - 'android-native/app/src/release/AndroidManifest.xml'
      - 'android-native/verification/kotlin-lab-navigation-test.mjs'
      - 'android-native/verification/kotlin-lab-workout-ui-test.mjs'
      - 'android-native/verification/kotlin-lab-stable-signing-test.mjs'
      - 'android-native/KOTLIN_LAB_SIGNING_SETUP.md'
  workflow_dispatch:
concurrency:
  group: kotlin-engine-rebuild-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test-independent-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Android API 37
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      # Do not let setup-gradle's short CDN retry window block every
      # source/engine check on transient distribution HTTP 504s. Download
      # only the fixed official Gradle binary and verify the published SHA.
      - name: Install checksum-pinned Gradle 9.3.1
        shell: bash
        run: |
          set -euo pipefail
          version='9.3.1'
          sha='b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06'
          archive="${RUNNER_TEMP}/gradle-${version}-bin.zip"
          verified=false
          for base in https://downloads.gradle.org https://services.gradle.org; do
            rm -f "$archive"
            if curl --fail --location --retry 3 --retry-all-errors \
                --retry-delay 5 --connect-timeout 15 --max-time 120 \
                "${base}/distributions/gradle-${version}-bin.zip" -o "$archive"; then
              if echo "${sha}  ${archive}" | sha256sum --check --status; then
                verified=true
                break
              fi
            fi
          done
          if [ "$verified" != true ]; then
            echo "Official Gradle 9.3.1 download/checksum verification failed" >&2
            exit 1
          fi
          unzip -q "$archive" -d "$RUNNER_TEMP"
          "${RUNNER_TEMP}/gradle-${version}/bin/gradle" --version
          echo "${RUNNER_TEMP}/gradle-${version}/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        # Use the already checksum-verified binary; retain Gradle cache and
        # init-script instrumentation, but do not re-download a distribution.
      - name: Verify Kotlin engine cannot alter native workouts
        run: node android-native/kotlin-engine/verification/offline-only-test.mjs
      - name: Verify entire engine feature scope and native UX documentation
        run: node android-native/kotlin-engine/verification/feature-scope-contract.mjs
      - name: Validate web vs Kotlin superiority scorecard without assuming success
        run: |
          node android-native/kotlin-engine/verification/engine-superiority-gate.mjs --self-test
          node android-native/kotlin-engine/verification/engine-superiority-gate.mjs --audit --write-report
      - name: Stage legacy web exercise catalog as unreviewed source inventory
        run: node android-native/kotlin-engine/verification/legacy-catalog-ingest.mjs --write-report
      - name: Verify first curated starter tranche provenance
        run: node android-native/kotlin-engine/verification/starter-catalog-parity.mjs
      - name: Verify isolated Kotlin Lab launcher and app navigation
        run: node android-native/verification/kotlin-lab-navigation-test.mjs
      - name: Verify focused editable Kotlin workout logging
        run: node android-native/verification/kotlin-lab-workout-ui-test.mjs
      - name: Verify durable private signing gate for future Kotlin Lab APKs
        run: node android-native/verification/kotlin-lab-stable-signing-test.mjs
      - name: Test headless Kotlin training decisions and weekly composer without an APK
        working-directory: android-native
        run: gradle :kotlin-engine:testDebugUnitTest --no-daemon --stacktrace
      - name: Test independent paired-comparison oracle and evidence validation
        run: node --test android-native/kotlin-engine/verification/paired-progression-test.mjs android-native/kotlin-engine/verification/paired-functional-test.mjs
      - name: Audit real starter split and phase coverage without granting release approval
        working-directory: android-native
        run: gradle :kotlin-engine:runStarterProgramReleaseProbe --no-daemon --stacktrace
      - name: Check out frozen web engine for matched progression execution
        uses: actions/checkout@v4
        with:
          ref: 903b4a78564590d8983e651cbe19d81acd1efb9c
          path: comparison-legacy
      - name: Re-execute both progression engines and compare recorded outputs
        run: >-
          node android-native/kotlin-engine/verification/run-paired-progression.mjs
          --legacy-root comparison-legacy --check-current
      - name: Compare real per-set rep targets and physical equipment policies
        run: >-
          node android-native/kotlin-engine/verification/run-paired-functional.mjs
          --legacy-root comparison-legacy --check-current
      - name: Test isolated native journal persistence and offline crash recovery
        working-directory: android-native
        run: gradle :native-coach-store:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile Android application with isolated Kotlin host, without building an APK
        working-directory: android-native
        run: gradle :app:compileDebugKotlin :app:processDebugMainManifest :app:processReleaseMainManifest --no-daemon --stacktrace
      - name: Attach incomplete engine comparison scorecard (not release approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-vs-web-comparison-incomplete
          path: android-native/kotlin-engine/reports/engine-superiority-audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Attach real starter release coverage audit (not release approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starter-program-release-coverage-incomplete
          path: android-native/kotlin-engine/build/reports/starter-program-release-audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Attach fresh matched headless progression execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-headless-progression-review
          path: |
            android-native/kotlin-engine/build/reports/paired-progression.json
            android-native/kotlin-engine/build/reports/paired-progression-native.json
            android-native/kotlin-engine/build/reports/paired-functional.json
            android-native/kotlin-engine/build/reports/paired-functional-native.json
          if-no-files-found: warn
          retention-days: 7
      - name: Attach legacy migration review inventory (not coaching-approved)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-exercise-inventory-unreviewed
          path: android-native/kotlin-engine/reports/legacy-exercise-inventory.json
          if-no-files-found: warn
          retention-days: 7
