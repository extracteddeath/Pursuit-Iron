name: Independent Kotlin engine rules — tests only
on:
  push:
    branches:
      - architecture/kotlin-engine-rebuild
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-kotlin-rebuild.yml'
  workflow_dispatch:
concurrency:
  group: kotlin-engine-rebuild-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test-independent-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Android API 37
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      # Do not let setup-gradle's short CDN retry window block every
      # source/engine check on transient distribution HTTP 504s. Download
      # only the fixed official Gradle binary and verify the published SHA.
      - name: Install checksum-pinned Gradle 9.3.1
        shell: bash
        run: |
          set -euo pipefail
          version='9.3.1'
          sha='b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06'
          archive="${RUNNER_TEMP}/gradle-${version}-bin.zip"
          verified=false
          for url in \
            "https://distfiles.macports.org/gradle/gradle-${version}-bin.zip" \
            "https://github.com/gradle/gradle-distributions/releases/download/v${version}/gradle-${version}-bin.zip" \
            "https://downloads.gradle.org/distributions/gradle-${version}-bin.zip" \
            "https://services.gradle.org/distributions/gradle-${version}-bin.zip"; do
            rm -f "$archive"
            if curl --fail --location --retry 3 --retry-all-errors \
                --retry-delay 5 --connect-timeout 15 --max-time 120 \
                "$url" -o "$archive"; then
              if echo "${sha}  ${archive}" | sha256sum --check --status; then
                verified=true
                break
              fi
            fi
          done
          if [ "$verified" != true ]; then
            echo "Official Gradle 9.3.1 download/checksum verification failed" >&2
            exit 1
          fi
          unzip -q "$archive" -d "$RUNNER_TEMP"
          "${RUNNER_TEMP}/gradle-${version}/bin/gradle" --version
          echo "${RUNNER_TEMP}/gradle-${version}/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        # Use the already checksum-verified binary; retain Gradle cache and
        # init-script instrumentation, but do not re-download a distribution.
      - name: Verify Kotlin engine cannot alter native workouts
        run: node android-native/kotlin-engine/verification/offline-only-test.mjs
      - name: Verify entire engine feature scope and native UX documentation
        run: node android-native/kotlin-engine/verification/feature-scope-contract.mjs
      - name: Verify pinned Stage 1 parity inventory structure and fixture references
        run: node android-native/kotlin-engine/verification/stage1-inventory-test.mjs
      - name: Validate web vs Kotlin superiority scorecard without assuming success
        run: |
          node android-native/kotlin-engine/verification/engine-superiority-gate.mjs --self-test
          node android-native/kotlin-engine/verification/engine-superiority-gate.mjs --audit --write-report
      - name: Stage legacy web exercise catalog as unreviewed source inventory
        run: node android-native/kotlin-engine/verification/legacy-catalog-ingest.mjs --write-report
      - name: Verify first curated starter tranche provenance
        run: node android-native/kotlin-engine/verification/starter-catalog-parity.mjs
      - name: Audit web built-in exercise coverage against actual Kotlin starter catalog
        run: |
          node android-native/kotlin-engine/verification/web-native-catalog-parity-audit.mjs --self-test
          node android-native/kotlin-engine/verification/web-native-catalog-parity-audit.mjs --audit --write-report
      - name: Verify shipped web palettes and native Amethyst first-install appearance
        run: |
          node android-native/verification/native-original-theme-parity-test.mjs
          node android-native/verification/native-onboarding-interaction-test.mjs
          node android-native/verification/kotlin-onboarding-canonical-stock-test.mjs
      - name: Verify isolated Kotlin Lab launcher and app navigation
        run: node android-native/verification/kotlin-lab-navigation-test.mjs
      - name: Verify focused editable Kotlin workout logging
        run: |
          node android-native/verification/kotlin-lab-workout-ui-test.mjs
          node android-native/verification/kotlin-strength-volume-acceptance-test.mjs
          node android-native/verification/kotlin-block-boundary-volume-test.mjs
          node android-native/verification/kotlin-workout-focus-leveling-scope-test.mjs
          node android-native/verification/kotlin-swap-visible-name-search-test.mjs
          node android-native/verification/kotlin-reviewed-exercise-labels-test.mjs
          node android-native/verification/kotlin-custom-prior-leveling-test.mjs
          node android-native/verification/kotlin-pinned-exercise-notes-test.mjs
          node android-native/verification/kotlin-pinned-setup-fields-test.mjs
          node android-native/verification/kotlin-custom-session-note-test.mjs
          node android-native/verification/kotlin-generated-session-note-test.mjs
          node android-native/verification/kotlin-strength-club-contract-test.mjs
          node android-native/verification/kotlin-profile-milestones-test.mjs
          node android-native/verification/kotlin-profile-share-test.mjs
          node android-native/verification/kotlin-profile-share-image-test.mjs
          node android-native/verification/kotlin-machine-station-label-test.mjs
          node android-native/verification/kotlin-machine-rename-test.mjs
          node android-native/verification/kotlin-machine-quick-chooser-test.mjs
          node android-native/verification/kotlin-workout-station-evidence-test.mjs
          node android-native/verification/kotlin-cold-resume-drafts-test.mjs
          node android-native/verification/kotlin-rest-timer-cold-resume-test.mjs
          node android-native/verification/kotlin-bodyweight-progress-test.mjs
          node android-native/verification/kotlin-workout-equipment-recovery-test.mjs
          node android-native/verification/kotlin-verified-training-archive-test.mjs
          node android-native/verification/kotlin-factual-trend-time-axis-test.mjs
          node android-native/verification/kotlin-verified-finish-recap-test.mjs
          node android-native/verification/kotlin-canonical-finish-feedback-test.mjs
          node android-native/verification/kotlin-progress-observed-rir-test.mjs
          node android-native/verification/kotlin-machine-gym-admission-test.mjs
          node android-native/verification/kotlin-plan-machine-ab-navigation-test.mjs
          node android-native/verification/kotlin-profile-layout-test.mjs
          node android-native/verification/kotlin-coach-choice-search-test.mjs
          node android-native/verification/kotlin-custom-exercise-search-paging-test.mjs
          node android-native/verification/kotlin-beta-feedback-share-test.mjs
          node android-native/verification/kotlin-plan-exercise-removal-test.mjs
          node android-native/verification/kotlin-plan-cross-day-move-test.mjs
          node android-native/verification/kotlin-plan-structure-removal-test.mjs
          node android-native/verification/kotlin-plan-superset-atomic-reorder-test.mjs
          node android-native/verification/kotlin-weekly-swap-coverage-test.mjs
          node android-native/verification/kotlin-train-resume-test.mjs
          node android-native/verification/kotlin-plan-hierarchy-test.mjs
          node android-native/verification/kotlin-exercise-library-test.mjs
          node android-native/verification/kotlin-exercise-variant-facets-test.mjs
          node android-native/verification/kotlin-generated-composer-variant-facets-test.mjs
          node android-native/verification/kotlin-exercise-history-filters-test.mjs
          node android-native/verification/kotlin-history-dates-test.mjs
          node android-native/verification/kotlin-finished-history-deeplink-test.mjs
          node android-native/verification/kotlin-superset-execution-test.mjs
          node android-native/verification/kotlin-lab-disposable-test.mjs
          node android-native/verification/no-apk-before-end-to-end-test.mjs
      - name: Verify durable private signing gate for future Kotlin Lab APKs
        run: |
          node android-native/verification/kotlin-lab-stable-signing-test.mjs
          python3 android-native/verification/kotlin-lab-signing-test.py
      - name: Prove beta debug and release runtime exclude legacy JS without an APK
        working-directory: android-native
        run: gradle :app:verifyKotlinOnlyRuntimeClasspath --no-daemon --stacktrace
      - name: Test headless Kotlin training decisions and weekly composer without an APK
        working-directory: android-native
        run: gradle :kotlin-engine:testDebugUnitTest --no-daemon --stacktrace
      - name: Test independent paired-comparison oracle and evidence validation
        run: node --test android-native/kotlin-engine/verification/paired-progression-test.mjs android-native/kotlin-engine/verification/paired-functional-test.mjs
      - name: Audit real starter split and phase coverage without granting release approval
        working-directory: android-native
        run: gradle :kotlin-engine:runStarterProgramReleaseProbe --no-daemon --stacktrace
      - name: Independently generate and print actual Kotlin-only programs and full cycles
        working-directory: android-native
        run: gradle :kotlin-engine:runKotlinOnlyProgramCycleShowcase --no-daemon --stacktrace
      - name: Check out frozen web engine for matched progression execution
        uses: actions/checkout@v4
        with:
          ref: 903b4a78564590d8983e651cbe19d81acd1efb9c
          path: comparison-legacy
      - name: Re-execute both progression engines and compare recorded outputs
        run: >-
          node android-native/kotlin-engine/verification/run-paired-progression.mjs
          --legacy-root comparison-legacy --check-current
      - name: Compare real per-set rep targets and physical equipment policies
        run: >-
          node android-native/kotlin-engine/verification/run-paired-functional.mjs
          --legacy-root comparison-legacy --check-current
      - name: Test isolated native journal persistence and offline crash recovery
        working-directory: android-native
        run: gradle :native-coach-store:testDebugUnitTest --no-daemon --stacktrace
      - name: Test app navigation and compile Android source without building an APK
        working-directory: android-native
        run: gradle :app:testDebugUnitTest :app:compileDebugKotlin :app:processDebugMainManifest :app:processReleaseMainManifest --no-daemon --stacktrace
      - name: Attach reproducible Kotlin-only generated programs and cycles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-only-program-cycle-showcase
          path: android-native/kotlin-engine/build/reports/kotlin-only-program-cycle-showcase.md
          if-no-files-found: warn
          retention-days: 14
      - name: Attach incomplete engine comparison scorecard (not release approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-vs-web-comparison-incomplete
          path: android-native/kotlin-engine/reports/engine-superiority-audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Attach real starter release coverage audit (not release approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starter-program-release-coverage-incomplete
          path: android-native/kotlin-engine/build/reports/starter-program-release-audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Attach fresh matched headless progression execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-headless-progression-review
          path: |
            android-native/kotlin-engine/build/reports/paired-progression.json
            android-native/kotlin-engine/build/reports/paired-progression-native.json
            android-native/kotlin-engine/build/reports/paired-functional.json
            android-native/kotlin-engine/build/reports/paired-functional-native.json
          if-no-files-found: warn
          retention-days: 7
      - name: Attach incomplete web/Kotlin built-in catalog parity (not release approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-native-exercise-catalog-parity-incomplete
          path: android-native/kotlin-engine/reports/web-native-catalog-parity-audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Attach legacy migration review inventory (not coaching-approved)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-exercise-inventory-unreviewed
          path: android-native/kotlin-engine/reports/legacy-exercise-inventory.json
          if-no-files-found: warn
          retention-days: 7
