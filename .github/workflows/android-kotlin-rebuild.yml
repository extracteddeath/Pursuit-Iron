name: Independent Kotlin engine rules — tests only
on:
  push:
    branches:
      - architecture/kotlin-engine-rebuild
    paths:
      - 'android-native/kotlin-engine/**'
      - 'android-native/native-coach-store/**'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/AppPrivateKotlinLocalAthlete.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinCandidateHost.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinCustomCycle*.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinCustomExerciseSheet.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinGymSource*.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinOnboardingCandidateScreen.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinCandidateJourney.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinSessionController.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeKotlinWorkoutCandidateScreen.kt'
      - 'android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/PursuitIronApplication.kt'
      - 'android-native/app/build.gradle.kts'
      - 'android-native/settings.gradle.kts'
      - '.github/workflows/android-kotlin-rebuild.yml'
  workflow_dispatch:
concurrency:
  group: kotlin-engine-rebuild-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test-independent-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Android API 37
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify Kotlin engine cannot alter native workouts
        run: node android-native/kotlin-engine/verification/offline-only-test.mjs
      - name: Verify entire engine feature scope and native UX documentation
        run: node android-native/kotlin-engine/verification/feature-scope-contract.mjs
      - name: Validate web vs Kotlin superiority scorecard without assuming success
        run: |
          node android-native/kotlin-engine/verification/engine-superiority-gate.mjs --self-test
          node android-native/kotlin-engine/verification/engine-superiority-gate.mjs --audit --write-report
      - name: Stage legacy web exercise catalog as unreviewed source inventory
        run: node android-native/kotlin-engine/verification/legacy-catalog-ingest.mjs --write-report
      - name: Verify first curated starter tranche provenance
        run: node android-native/kotlin-engine/verification/starter-catalog-parity.mjs
      - name: Test headless Kotlin training decisions and weekly composer without an APK
        working-directory: android-native
        run: gradle :kotlin-engine:testDebugUnitTest --no-daemon --stacktrace
      - name: Test isolated native journal persistence and offline crash recovery
        working-directory: android-native
        run: gradle :native-coach-store:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile Android application with isolated Kotlin host, without building an APK
        working-directory: android-native
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Attach incomplete engine comparison scorecard (not release approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-vs-web-comparison-incomplete
          path: android-native/kotlin-engine/reports/engine-superiority-audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Attach legacy migration review inventory (not coaching-approved)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-exercise-inventory-unreviewed
          path: android-native/kotlin-engine/reports/legacy-exercise-inventory.json
          if-no-files-found: warn
          retention-days: 7
