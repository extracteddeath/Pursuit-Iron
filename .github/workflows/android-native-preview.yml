name: Native Android preview APK (milestone only)

# No push-triggered builds. This workflow is intentionally disabled even
# for manual dispatch until onboarding -> logging -> workout completion passes.
on:
  workflow_dispatch:

concurrency:
  group: native-android-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble-preview:
    # Hard stop, including manually requested runs. Release only after the
    # complete athlete journey is independently certified on the same revision.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 37
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Package pinned canonical read-only engine for debug-only backup schema viewing
        run: |
          snapshot="$(mktemp -d)"
          trap 'rm -rf "$snapshot"' EXIT
          node engine-lab/canonical-export.mjs "$snapshot"
          node "$snapshot/scripts/verify-snapshot.mjs"
          node engine-lab/verify-parity.mjs "$snapshot"
          node android-native/engine-contract/snapshot-identity.mjs "$snapshot"
          mkdir -p "$snapshot/android-native/engine-bridge"
          for file in protocol.mjs progression-preview.mjs exercise-lookup.mjs workout-outline.mjs backup-schema-check.mjs current-program-projection.mjs android-entry.mjs sandbox-compat.mjs; do
            cp "android-native/engine-bridge/$file" "$snapshot/android-native/engine-bridge/$file"
          done
          npx --yes esbuild@0.28.2 "$snapshot/android-native/engine-bridge/android-entry.mjs" \
            --bundle --format=iife --platform=browser --target=es2020 \
            --global-name=PursuitIronBridge --legal-comments=none \
            --metafile="$snapshot/metafile.json" --outfile="$snapshot/canonical-readonly-engine.js"
          node --check "$snapshot/canonical-readonly-engine.js"
          node android-native/engine-bridge/verify-bundle-structure.mjs \
            "$snapshot/canonical-readonly-engine.js" "$snapshot/metafile.json" "$snapshot"
          node android-native/engine-contract/create-bundle-manifest.mjs \
            "$snapshot" "$snapshot/canonical-readonly-engine.js" "$snapshot/canonical-readonly-manifest.json"
          mkdir -p android-native/app/src/debug/assets
          cp "$snapshot/canonical-readonly-engine.js" android-native/app/src/debug/assets/
          cp "$snapshot/canonical-readonly-manifest.json" android-native/app/src/debug/assets/
      - name: Compile preview APK
        working-directory: android-native
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pursuit-iron-native-preview
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
