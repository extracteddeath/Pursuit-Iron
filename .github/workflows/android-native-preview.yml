name: Native Android preview APK (milestone only)

# Routine pushes and manual dispatches never build an APK. The sole M5
# milestone marker + explicit commit prefix authorize one development device
# test candidate after the continuous native-source journey check passed.
on:
  workflow_dispatch:
  push:
    branches:
      - architecture/android-compose-foundation
    paths:
      - 'android-native/M5_DEVICE_TEST_APK.md'

concurrency:
  group: native-android-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble-preview:
    # M5 is a *development* device test, never an app release. Only a named
    # one-off marker change with the explicit commit prefix can build here.
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'milestone(android): M5 ') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the continuous source-checked native training core
        run: |
          node android-native/verification/native-core-journey-test.mjs
          node android-native/verification/native-onboarding-interaction-test.mjs
          node android-native/verification/native-original-theme-parity-test.mjs
          node android-native/verification/no-apk-before-end-to-end-test.mjs
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 37
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Package pinned canonical read-only engine for debug-only backup schema viewing
        run: |
          snapshot="$(mktemp -d)"
          trap 'rm -rf "$snapshot"' EXIT
          node engine-lab/canonical-export.mjs "$snapshot"
          node "$snapshot/scripts/verify-snapshot.mjs"
          node engine-lab/verify-parity.mjs "$snapshot"
          node android-native/engine-contract/snapshot-identity.mjs "$snapshot"
          node android-native/engine-bridge/stage-bundle-sources.mjs "$snapshot"
          npx --yes esbuild@0.28.2 "$snapshot/android-native/engine-bridge/android-entry.mjs" \
            --bundle --format=iife --platform=browser --target=es2020 \
            --global-name=PursuitIronBridge --legal-comments=none \
            --metafile="$snapshot/metafile.json" --outfile="$snapshot/canonical-readonly-engine.js"
          node --check "$snapshot/canonical-readonly-engine.js"
          node android-native/engine-bridge/verify-bundle-structure.mjs \
            "$snapshot/canonical-readonly-engine.js" "$snapshot/metafile.json" "$snapshot"
          node android-native/engine-contract/create-bundle-manifest.mjs \
            "$snapshot" "$snapshot/canonical-readonly-engine.js" "$snapshot/canonical-readonly-manifest.json"
          mkdir -p android-native/app/src/debug/assets
          cp "$snapshot/canonical-readonly-engine.js" android-native/app/src/debug/assets/
          cp "$snapshot/canonical-readonly-manifest.json" android-native/app/src/debug/assets/
      - name: Verify Kotlin journal, restore and correction contracts
        working-directory: android-native
        run: gradle :domain-contract:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile preview APK
        working-directory: android-native
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pursuit-iron-native-preview
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
