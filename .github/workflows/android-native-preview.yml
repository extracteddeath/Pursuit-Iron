name: Native Android preview APK (milestone only)

# One user-authorized onboarding-to-Train debug milestone. Routine source
# commits do not produce APKs, only an explicit workflow-file edit does.
on:
  push:
    branches:
      - architecture/android-compose-foundation
    paths:
      - '.github/workflows/android-native-preview.yml'
  workflow_dispatch:

concurrency:
  group: native-android-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble-preview:
    # Debug tester preview only. No production release or device certification.
    if: ${{ github.ref == 'refs/heads/architecture/android-compose-foundation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 37
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Gate onboarding to real workout screen
        run: |
          node android-native/engine-bridge/native-onboarding-test.mjs
          node android-native/engine-bridge/native-workout-test.mjs
          node android-native/engine-bridge/workout-store-protocol-test.mjs
          node android-native/verification/native-onboarding-interaction-test.mjs
          node android-native/verification/native-preview-interaction-test.mjs
          node android-native/verification/no-apk-before-end-to-end-test.mjs
          grep -Fq 'onStartWorkout={runtime.startWorkout()}' android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/MainActivity.kt
          grep -Fq 'NativeWorkoutScreen(onboarding,onStartWorkout,' android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativePreviewApp.kt
          grep -Fq 'fun startWorkout(minutes: Int?=null)' android-native/app/src/main/java/io/github/extracteddeath/pursuitiron/NativeRuntimeHost.kt
      - name: Package verified canonical engine for debug first run
        run: |
          snapshot="$(mktemp -d)"
          trap 'rm -rf "$snapshot"' EXIT
          node engine-lab/canonical-export.mjs "$snapshot"
          node "$snapshot/scripts/verify-snapshot.mjs"
          node engine-lab/verify-parity.mjs "$snapshot"
          node android-native/engine-contract/snapshot-identity.mjs "$snapshot"
          node android-native/engine-bridge/stage-bundle-sources.mjs "$snapshot"
          npx --yes esbuild@0.28.2 "$snapshot/android-native/engine-bridge/android-entry.mjs" \
            --bundle --format=iife --platform=browser --target=es2020 \
            --global-name=PursuitIronBridge --legal-comments=none \
            --metafile="$snapshot/metafile.json" --outfile="$snapshot/canonical-readonly-engine.js"
          node --check "$snapshot/canonical-readonly-engine.js"
          node android-native/engine-bridge/verify-bundle-structure.mjs \
            "$snapshot/canonical-readonly-engine.js" "$snapshot/metafile.json" "$snapshot"
          node android-native/engine-contract/create-bundle-manifest.mjs \
            "$snapshot" "$snapshot/canonical-readonly-engine.js" "$snapshot/canonical-readonly-manifest.json"
          mkdir -p android-native/app/src/debug/assets
          cp "$snapshot/canonical-readonly-engine.js" android-native/app/src/debug/assets/
          cp "$snapshot/canonical-readonly-manifest.json" android-native/app/src/debug/assets/
      - name: Compile preview APK
        working-directory: android-native
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pursuit-iron-onboarding-to-train-preview
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
