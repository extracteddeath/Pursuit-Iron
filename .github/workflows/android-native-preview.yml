name: Native Android preview APK

on:
  push:
    branches:
      - architecture/android-compose-foundation
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile preview APK
        working-directory: android-native
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pursuit-iron-native-preview
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
