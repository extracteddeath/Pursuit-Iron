name: Apply legacy restore action fix

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-legacy-actions.mjs
      - .github/workflows/apply-legacy-actions-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch restore actions
        run: |
          node scripts/patch-legacy-actions.mjs
          node --check modules/App.js
          grep -q 'Remove saved plan' modules/App.js
          grep -q 'Restore to library' modules/App.js
          grep -q 'onRemoveLegacy: removeLegacyProgram' modules/App.js
          sed -i 's/pursuit-iron-production-m158-merged-r3/pursuit-iron-production-m158-merged-r4/g' sw.js BUILD_PROFILE.json
          grep -q 'pursuit-iron-production-m158-merged-r4' sw.js
          grep -q 'pursuit-iron-production-m158-merged-r4' BUILD_PROFILE.json
      - name: Commit production fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/App.js sw.js BUILD_PROFILE.json
          git rm scripts/patch-legacy-actions.mjs .github/workflows/apply-legacy-actions-fix.yml
          git commit -m 'Fix legacy restore controls and removal'
          git push
