name: Apply legacy restore UX fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-legacy-restore-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch saved-plan restore UX
        run: |
          set -euo pipefail
          node scripts/apply-legacy-restore-fix.mjs
          node --check modules/App.js
          grep -q 'Saved plans from previous version' modules/App.js
          grep -q 'Restore to library' modules/App.js
          grep -q 'Previous-version plans' modules/App.js
          ! grep -q 'Saved plans to update' modules/App.js
      - name: Commit fix and remove one-shot patcher
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/apply-legacy-restore-fix.mjs
          rm -f .github/workflows/apply-legacy-restore-fix.yml
          git add -A modules/App.js scripts/apply-legacy-restore-fix.mjs .github/workflows/apply-legacy-restore-fix.yml
          git commit -m 'Fix previous-version plan restore UX'
          git push
