name: Assemble B887 Home masthead release
on:
  push:
    branches:
      - release/b887-smooth-home-masthead
permissions:
  contents: write
jobs:
  assemble:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify complete B887 carrier
        run: echo "c3edba8d7dd9485a6fbe6558730b5d43d9ceaa27094f1e316873fba4c39d1be6  .release-import/b887-changes.tar.gz" | sha256sum -c -
      - name: Install verified B887 source
        run: |
          tar -xzf .release-import/b887-changes.tar.gz -C .
          node scripts/verify-release.mjs
          node verification/b887-home-masthead-motion-test.mjs
      - name: Replace release carrier with source files
        run: |
          rm -f .release-import/b887-changes.tar.gz .github/workflows/assemble-b887.yml
          git add -A
          git -c user.name="Pursuit Iron Release" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Build 887: smoothly collapse Home masthead while preserving Pursuit Iron name"
          git push origin HEAD:refs/heads/release/b887-smooth-home-masthead
