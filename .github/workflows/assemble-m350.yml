name: Assemble M350 candidate
on:
  push:
    branches: [improvement/m350-session-preview-hierarchy]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply verified source delta and remove this one-off workflow
        run: |
          python3 - <<'PY'
          import base64,hashlib,subprocess
          patch=base64.b64decode('')
          assert hashlib.sha256(patch).hexdigest()=='f0ee66a27942aea5230faa541b0262bb338d5497c82ccf74b77634a46af76f68'
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*["BUILD_PROFILE.json","DESIGN_PURPOSE_AUDIT_M334.md","RELEASE_MANIFEST.json","app.css","modules/App.js","sw.js","verification/b860-selective-improvements-browser-test.mjs","verification/shorter-session-browser-test.mjs"]],check=True)
          subprocess.run(['git','rm','.github/workflows/assemble-m350.yml'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='50800042fdc526d92ed8563aecfd9b9a7e05ad3e',tree
          
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'M350: prioritize executable session review and keep Start reachable'
          git push origin HEAD:improvement/m350-session-preview-hierarchy
