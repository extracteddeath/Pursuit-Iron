name: Assemble and exercise M351 candidate
on:
  push:
    branches: [fix/m351-created-session-preview]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Assemble exact source tree and remove temporary workflows
        run: |
          python3 - <<'PY'
          import base64,hashlib,subprocess
          subprocess.run(['git','restore','--source=eeea563aabdb43be42c969fec87559998bbf6a20','--staged','--worktree','--','verification/b899-stable-screen-browser-test.mjs'],check=True)
          subprocess.run(['git','rm','.github/workflows/m351-reproduce.yml','.github/workflows/assemble-m351.yml'],check=True)
          patch=base64.b64decode('')
          assert hashlib.sha256(patch).hexdigest()=='3e56befb2144ac877d9f318c2f44ac137d212216b91fda7fa348a90a715d4a3f'
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*["BUILD_PROFILE.json","DESIGN_PURPOSE_AUDIT_M334.md","RELEASE_MANIFEST.json","app.css","modules/App.js","sw.js","verification/b899-stable-screen-browser-test.mjs"]],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='6904b74f06a04061d335f3c18be4cceb0a0a3195',tree
          
          PY
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise real creation to preview to start and resume
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/b899-stable-screen-browser-test.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: node scripts/verify-release.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: m351-candidate-review
          path: verification/m351*-phone.png
          retention-days: 7
      - name: Publish verified candidate branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'M351: preserve selected program and day from creation through workout start'
          git push origin HEAD:fix/m351-created-session-preview
