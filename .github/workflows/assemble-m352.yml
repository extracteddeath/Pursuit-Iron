name: Assemble and review M352 candidate
on:
  push:
    branches: [improvement/m352-program-review-hierarchy]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Assemble exact source and remove temporary workflow
        run: |
          python3 - <<'PY'
          import base64,hashlib,subprocess
          patch=base64.b64decode('')
          assert hashlib.sha256(patch).hexdigest()=='504d334f69ba43d26254bd305908c3a037460c4b5bdc75f961aeb783b17c9149'
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*["BUILD_PROFILE.json","DESIGN_PURPOSE_AUDIT_M334.md","RELEASE_MANIFEST.json","app.css","modules/App.js","sw.js","verification/b899-stable-screen-browser-test.mjs"]],check=True)
          subprocess.run(['git','rm','.github/workflows/assemble-m352.yml'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='c1cb7a1e11c73b7bf63d50bac3e5a647f048f011',tree
          
          PY
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify generated review and existing training handoff
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/b899-stable-screen-browser-test.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: node scripts/verify-release.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: m352-candidate-review
          path: |
            verification/m352*-phone.png
            verification/m351*-phone.png
          retention-days: 7
      - name: Publish checked candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'M352: readable program identity and prioritized save review'
          git push origin HEAD:improvement/m352-program-review-hierarchy
