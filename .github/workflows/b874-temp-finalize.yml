name: B874 temporary finalizer

on:
  push:
    branches: [feature/b874-workout-plate-interactions]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[finalize-b874]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Finalize exact build
        run: |
          node --check modules/App.js
          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
          git add modules/App.js index.html sw.js BUILD_PROFILE.json RELEASE_MANIFEST.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(B874): finalized source and offline hashes"
          git push origin HEAD:feature/b874-workout-plate-interactions
