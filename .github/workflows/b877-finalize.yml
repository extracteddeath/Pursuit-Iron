name: Build 877 one-time release finalizer
on:
  push:
    branches:
      - improvement/b877-tablet-dock-focus-tools
    paths:
      - .github/workflows/b877-finalize.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improvement/b877-tablet-dock-focus-tools
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and finalize exact release assets
        run: |
          node --check modules/App.js
          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
      - name: Commit finalized package on the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/App.js index.html sw.js BUILD_PROFILE.json RELEASE_MANIFEST.json
          git diff --cached --quiet || git commit -m "[finalize-b877] Recertify expanded Focus controls"
          git push origin HEAD:improvement/b877-tablet-dock-focus-tools
