name: B943 focused Home review smoke (temporary)
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: read
jobs:
  focused:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'improve/b943-meaningful-plan-adjustments' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked browser harness
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Home/Preview load review journey
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/b904-session-review-browser-test.mjs
