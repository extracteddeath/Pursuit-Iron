name: Rehash B943 candidate (temporary)
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ github.actor == 'extracteddeath' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'improve/b943-meaningful-plan-adjustments' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: improve/b943-meaningful-plan-adjustments
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Recompute manifest without advancing release number
        run: |
          test "$(node -p "require('./RELEASE_MANIFEST.json').build")" = "943"
          node scripts/finalize-release.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/App.js index.html sw.js BUILD_PROFILE.json RELEASE_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "Rehash Build 943 after load-hold safety change"
            git push origin HEAD:improve/b943-meaningful-plan-adjustments
          fi
