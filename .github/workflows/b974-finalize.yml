name: B974 temporary release finalizer
on:
  push:
    branches: [test/pwa-update-session-readiness-coverage]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Certify numbered release and retire this temporary workflow
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='RELEASE_MANIFEST.json';
          const manifest=JSON.parse(fs.readFileSync(file,'utf8'));
          if(manifest.build!==973)throw new Error('Expected B973 candidate base');
          manifest.uiMilestone='Build 973 · Workout set order and update-prompt stability';
          fs.writeFileSync(file,JSON.stringify(manifest,null,2)+'\n');
          const log='CHANGELOG.md';
          fs.writeFileSync(log,'## Build 974 — Workout ordering and update-prompt verification\n\n- Newly added working sets now precede pending drop/myo extensions; already logged extensions retain their original order.\n- Expanded mobile PWA Restart visibility regression across 320px/393px, foreground checks, and Settings navigation.\n- Protected session-only set resizing, user-owned loads, workout history, and easier-day changes with additional tests.\n- Engine remains 0.65.9. Physical Android IME/TalkBack verification remains separate.\n\n'+fs.readFileSync(log,'utf8'));
          NODE
          node scripts/finalize-release.mjs --next-build
          node scripts/verify-release.mjs
          node scripts/verify-engine-contracts.mjs integration
          rm .github/workflows/b974-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "B974: certify workout ordering and PWA persistence release"
          git push origin HEAD:test/pwa-update-session-readiness-coverage
