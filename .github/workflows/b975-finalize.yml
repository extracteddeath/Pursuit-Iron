name: B975 temporary release finalizer
on:
  push:
    branches: [fix/b975-live-dock-update-layout]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Certify current shell and retire temporary finalizer
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='RELEASE_MANIFEST.json';
          const manifest=JSON.parse(fs.readFileSync(file,'utf8'));
          if(manifest.build!==974)throw new Error('B975 must start at certified B974');
          manifest.uiMilestone='Build 974 · Live workout dock and update control polish';
          fs.writeFileSync(file,JSON.stringify(manifest,null,2)+'\n');
          const log='CHANGELOG.md';
          fs.writeFileSync(log,'## Build 975 — Live workout and persistent update polish\n\n- Move eight minimized-workout, PWA update and offline status inline styles into shared theme CSS; preserve all workout and restart callbacks.\n- Keep phone-width dock above the tab rail with 44px Resume and Discard targets; provide clearer restart confirmation actions and visible focus treatment.\n- Assert 320px and 393px dock, offline update touch areas, layout, contrast and persistence in production Chromium.\n- No engine, progression, storage, workout event or history schema change; Engine 0.65.9.\n\n'+fs.readFileSync(log,'utf8'));
          NODE
          node scripts/finalize-release.mjs --next-build
          node scripts/verify-release.mjs
          node scripts/verify-engine-contracts.mjs integration
          rm .github/workflows/b975-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "B975: certify live dock and update control layout release"
          git push origin HEAD:fix/b975-live-dock-update-layout
