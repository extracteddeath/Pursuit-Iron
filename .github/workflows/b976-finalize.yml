name: B976 temporary release finalizer
on:
  push:
    branches: [refactor/b976-program-workout-geometry]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Certify numbered B976 release and remove finalizer
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='RELEASE_MANIFEST.json';
          const manifest=JSON.parse(fs.readFileSync(file,'utf8'));
          if(manifest.build!==975)throw new Error('B976 expected certified B975 base');
          manifest.uiMilestone='Build 975 · Program and workout geometry consolidation';
          fs.writeFileSync(file,JSON.stringify(manifest,null,2)+'\n');
          const log='CHANGELOG.md';
          fs.writeFileSync(log,'## Build 976 — Program and workout geometry consolidation\n\n- Retire 16 static JSX layout objects across program scheduling, exercise-swap search/results, plan restore, workout trace, previous-set controls, coaching, injury and history panels.\n- Use stable single-owner CSS for 44px schedule and workout trace actions, 48px workout exit, safe search scrolling, reduced motion and forced colors.\n- Keep engine 0.65.9, workout logging, progression, history, saved plan data and callback behavior unchanged.\n- Protect this cleanup with registered integration source contract and existing seven real-browser shards.\n\n'+fs.readFileSync(log,'utf8'));
          NODE
          node scripts/finalize-release.mjs --next-build
          node scripts/verify-release.mjs
          node scripts/verify-engine-contracts.mjs integration
          rm .github/workflows/b976-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "B976: certify program and workout geometry source consolidation"
          git push origin HEAD:refactor/b976-program-workout-geometry
