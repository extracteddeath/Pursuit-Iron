name: B977 one-time release recertification
on:
  push:
    branches: [refactor/b977-shared-chips-dialogs-metadata]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Recertify candidate CSS and retire this workflow
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('RELEASE_MANIFEST.json','utf8'));
          if(manifest.build!==977)throw new Error('Expected B977 candidate; build must not advance twice');
          NODE
          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
          node scripts/verify-engine-contracts.mjs integration
          rm .github/workflows/b977-recertify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "B977: recertify 44px expressive chip target and release hashes"
          git push origin HEAD:refactor/b977-shared-chips-dialogs-metadata
