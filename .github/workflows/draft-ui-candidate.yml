name: Draft UI candidate verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: draft-ui-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-contracts:
    # Draft UI work needs feedback before rebuilding the PWA release identity.
    # Official full release/engine gates still run only when marked ready.
    if: ${{ github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Syntax-check browser verification files before starting Chromium
        run: find verification -name '*-browser-test.mjs' -print0 | xargs -0 -n 1 node --check
      - name: Syntax-check app module before any browser work
        run: node --check modules/App.js
      - name: Verify all UI integration source contracts
        run: node scripts/verify-engine-contracts.mjs integration

  ui-browser:
    if: ${{ github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # The consolidated CSS reset affects the entire UI. Validate all seven
      # Chrome shards before the PR leaves draft; no PWA build bump needed.
      matrix:
        shard: [lifecycle, workout, program, integration, integration-motion, integration-accessibility, integration-data]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Chromium harness
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify draft UI browser shard
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/verify-browser-contracts.mjs ${{ matrix.shard }}
      - name: Preserve responsive visual evidence for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: draft-ui-visual-${{ matrix.shard }}-${{ github.event.pull_request.number }}
          path: verification/*.png
          if-no-files-found: ignore
          retention-days: 7

  stage-monotonic-build:
    # A single release identity is generated ONLY after all seven Chromium
    # shards and the full integration source group pass on the same PR head.
    needs: [source-contracts, ui-browser]
    if: ${{ github.event.pull_request.draft && (github.event.pull_request.number == 414 || github.event.pull_request.number == 416 || github.event.pull_request.number == 420 || github.event.pull_request.number == 421 || github.event.pull_request.number == 422 || github.event.pull_request.number == 427 || github.event.pull_request.number == 430 || github.event.pull_request.number == 433 || github.event.pull_request.number == 434) && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Stage one monotonic release only after every UI gate passes
        shell: bash
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          base_build="$(git show "${RELEASE_BASE}:RELEASE_MANIFEST.json" | node -e 'let input="";process.stdin.on("data",c=>input+=c);process.stdin.on("end",()=>console.log(JSON.parse(input).build))')"
          current_build="$(node -p 'require("./RELEASE_MANIFEST.json").build')"
          if [[ "${current_build}" == "${base_build}" ]]; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'RELEASE_MANIFEST.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          manifest.uiMilestone = process.env.TARGET_BRANCH === 'fix/b1004-positional-double-hold'
            ? `Build ${manifest.build} · Correct positional double-progression load holds`
            : process.env.TARGET_BRANCH === 'fix/b1003-live-advice-provenance-gate'
            ? `Build ${manifest.build} · Verified live-load suggestion consent diagnostics`
            : process.env.TARGET_BRANCH === 'feature/b1002-settings-routed-controls'
            ? `Build ${manifest.build} · Settings native field and routed control consolidation`
            : process.env.TARGET_BRANCH === 'feature/gallery-shared-card-roles'
            ? `Build ${manifest.build} · Shared Settings, Gallery and Progress M3 consolidation`
            : `Build ${manifest.build} · Program, Home and Workout M3 consolidation`;
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE
            node scripts/finalize-release.mjs --next-build
            PURSUIT_RELEASE_BASE="${RELEASE_BASE}" node scripts/verify-release.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add RELEASE_MANIFEST.json BUILD_PROFILE.json modules/App.js index.html sw.js
            git diff --cached --quiet && { echo "Release finalizer did not generate identity changes"; exit 1; }
            git commit -m "Build $((base_build + 1)): finalize consolidated M3 UI, runtime and offline identity"
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          elif [[ "${current_build}" == "$((base_build + 1))" ]]; then
            PURSUIT_RELEASE_BASE="${RELEASE_BASE}" node scripts/verify-release.mjs
            echo "Candidate already finalized at build ${current_build}; no additional build increment."
          else
            echo "Refusing to finalize: base=${base_build}, candidate=${current_build}" >&2
            exit 1
          fi
