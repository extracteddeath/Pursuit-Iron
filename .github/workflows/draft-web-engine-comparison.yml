name: Draft web engine comparison

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: web-engine-comparison-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  core-engine:
    # This draft remains explicitly non-releasable. Give focused engine PRs
    # generation/adaptation/quality results without promoting release identity.
    if: ${{ github.event.pull_request.draft && github.event.pull_request.head.ref == 'web-approved-engine-fixes-20261109' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [generation, adaptation, quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify web engine contract group
        run: node scripts/verify-engine-contracts.mjs ${{ matrix.group }}
