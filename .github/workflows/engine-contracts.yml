name: Core contracts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Draft changes are not release candidates. Run the full, unchanged gate
    # when ready for review, on later ready-PR updates, and on main.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [generation, adaptation, quality, integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify branch housekeeping safety rules
        if: ${{ matrix.group == 'integration' }}
        run: node --test verification/repo-hygiene-test.mjs
      - name: Verify contract group
        run: node scripts/verify-engine-contracts.mjs ${{ matrix.group }}

  lifecycle-audit:
    # Preserve one complete, revision-addressed lifecycle audit report per PR/main.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Run complete engine lifecycle audit
        run: node scripts/audit-training-lifecycle.mjs --report verification/engine-lifecycle-audit.json
      - name: Save revision-scoped engine lifecycle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-lifecycle-audit
          path: verification/engine-lifecycle-audit.json
          if-no-files-found: error
          retention-days: 14
