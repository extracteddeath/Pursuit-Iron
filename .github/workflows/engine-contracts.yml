name: Engine contracts
on:
  push:
    branches: [main, 'verification/**', 'engine/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [generation, adaptation, quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current engine contracts
        run: node scripts/verify-engine-contracts.mjs ${{ matrix.group }}
