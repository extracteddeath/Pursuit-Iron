name: Independent engine audit
on:
  push:
    branches: [main, 'verification/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix engine-lab --ignore-scripts
      - name: Materialize M228 canonical boundary
        id: m228
        if: github.ref == 'refs/heads/verification/m228-canonical-boundary'
        shell: bash
        run: |
          if [ ! -f modules/engine-shell.js ]; then
            node engine-lab/m228-migrate.mjs
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit M228 canonical boundary
        if: steps.m228.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/App.js modules/engine-shell.js
          git commit -m "M228: establish canonical engine boundary"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - if: steps.m228.outputs.changed != 'true'
        run: node engine-lab/export-engine.mjs ${{ runner.temp }}/pursuit-iron-engine
      - if: steps.m228.outputs.changed != 'true'
        run: node engine-lab/verify-parity.mjs ${{ runner.temp }}/pursuit-iron-engine
      - name: Verify source identity and independent regressions
        if: steps.m228.outputs.changed != 'true'
        working-directory: ${{ runner.temp }}/pursuit-iron-engine
        run: npm run verify && npm test
      - if: steps.m228.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pursuit-iron-engine
          path: ${{ runner.temp }}/pursuit-iron-engine
          retention-days: 30
