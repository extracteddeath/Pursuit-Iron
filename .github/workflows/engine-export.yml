name: Independent engine audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node engine-lab/export-engine.mjs ${{ runner.temp }}/pursuit-iron-engine
      - run: node engine-lab/verify-parity.mjs ${{ runner.temp }}/pursuit-iron-engine
      - name: Verify source identity and independent regressions
        working-directory: ${{ runner.temp }}/pursuit-iron-engine
        run: npm run verify && npm test
      - name: Publish verified engine artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pursuit-iron-engine
          path: ${{ runner.temp }}/pursuit-iron-engine
          retention-days: 14
