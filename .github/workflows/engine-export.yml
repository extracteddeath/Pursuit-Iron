name: Independent engine audit
on:
  push:
    branches: [main, 'verification/**', 'engine/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node engine-lab/export-engine.mjs ${{ runner.temp }}/pursuit-iron-engine
      - run: node engine-lab/verify-parity.mjs ${{ runner.temp }}/pursuit-iron-engine
      - name: Verify source identity and independent regressions
        working-directory: ${{ runner.temp }}/pursuit-iron-engine
        run: npm run verify && npm test
      - name: Publish verified engine artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pursuit-iron-engine
          path: ${{ runner.temp }}/pursuit-iron-engine
          retention-days: 14
