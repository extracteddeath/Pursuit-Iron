# One-shot Build 954 CSS ownership consolidation; deleted after verified commit.
name: Finalize B954 static presentation ownership
on:
  push:
    branches: [refactor/b954-static-style-consolidation]
    paths: ['.github/workflows/finalize-b954-static-style.yml']
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Consolidate exact duplicated presentation owners
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=p=>fs.readFileSync(p,'utf8');
          const write=(p,t)=>fs.writeFileSync(p,t);
          let app=read('modules/App.js'),css=read('app.css');
          const initialInline=(app.match(/style:\s*\{/g)||[]).length;
          const initialImportant=(css.match(/!important/g)||[]).length;
          const iconRx=/(_jsx\(([A-Z][A-Za-z0-9_]*), \{[^{}\n]{0,230}?)(,\s*)style:\s*\{\s*flexShrink:\s*0\s*\}/g;
          let iconCount=0;
          app=app.replace(iconRx,(all,head,component,comma)=>{
            assert.ok(!head.includes('className:'), 'Cannot attach second icon className');
            iconCount++;
            return head+comma+'className: "wpb-icon-no-shrink"';
          });
          assert.equal(iconCount,45,'Only known static Lucide icon sizing is migrated');
          const overlay='className: "wpb-backdrop", style: { position: "fixed", inset: 0, background: "rgba(0,0,0,.65)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 70, animation: "fadeIn .2s both", padding: 24 }';
          const overlayCount=app.split(overlay).length-1;
          assert.equal(overlayCount,7,'Only the seven identical modal backdrops are migrated');
          app=app.split(overlay).join('className: "wpb-backdrop wpb-shared-overlay"');
          assert.equal(initialInline-(app.match(/style:\s*\{/g)||[]).length,52,'Exactly 52 static inline objects retired');

          // Retire an earlier important property only if a later rule with the
          // exact same selector and at-rule context also declares it important.
          // Keep ordinary repeated values (such as 100vh/100dvh fallbacks).
          const frames=[],rules=[]; let last=0;
          for(let i=0;i<css.length;i++){
            if(css[i]==='{'){
              frames.push({pre:css.slice(last,i).replace(/\/\*[\s\S]*?\*\//g,'').trim(),at:i}); last=i+1;
            }else if(css[i]==='}'){
              const frame=frames.pop();
              if(frame){
                const body=css.slice(frame.at+1,i);
                if(!/[{}]/.test(body))rules.push({
                  selector:frame.pre.replace(/\/\*[\s\S]*?\*\//g,'').trim(),
                  context:frames.filter(x=>x.pre.startsWith('@')).map(x=>x.pre).join('|'),
                  body,at:frame.at
                });
              }
              last=i+1;
            }
          }
          const seen=new Map(),drops=[];
          for(const rule of rules){
            for(const m of rule.body.matchAll(/(?:^|;)\s*([\w-]+)\s*:\s*([^;{}]*?)\s*!important\s*(?=;|$)/g)){
              const key=[rule.context,rule.selector,m[1]].join('\t');
              const start=rule.at+1+m.index+(m[0].startsWith(';')?1:0);
              let end=rule.at+1+m.index+m[0].length;
              if(css[end]===';')end++;
              if(seen.has(key))drops.push(seen.get(key));
              seen.set(key,{start,end,key});
            }
          }
          assert.equal(drops.length,12,'Only the 12 audited superseded priority properties are removed');
          for(const d of drops.sort((a,b)=>b.start-a.start))css=css.slice(0,d.start)+css.slice(d.end);
          assert.equal(initialImportant-(css.match(/!important/g)||[]).length,12);
          const anchor='/* M187 premium interaction contract.';
          assert.equal(css.split(anchor).length-1,1,'Shared presentation insertion anchor must be unique');
          const shared=[
            '/* B954: one CSS owner for common icon stability and seven identical modal overlays.',
            '   Replaces static JSX styles, without changing inputs, gestures or saved data. */',
            '#root .wpb svg.wpb-icon-no-shrink{flex-shrink:0}',
            '#root .wpb .wpb-backdrop.wpb-shared-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:70;animation:fadeIn .2s both;padding:24px}',
            ''
          ].join('\n');
          css=css.replace(anchor,shared+anchor);
          write('modules/App.js',app); write('app.css',css);
          let test=read('verification/ui-ownership-test.mjs');
          function exact(from,to){assert.ok(test.includes(from),'Ownership budget marker missing '+from);test=test.replace(from,to);}
          exact('const MAX_IMPORTANT = 2073;','const MAX_IMPORTANT = 2061;');
          exact('const MAX_REPEAT_IMPORTANT = 14;','const MAX_REPEAT_IMPORTANT = 0;');
          exact('const MAX_INLINE_STYLE_OBJECTS = 2084;','const MAX_INLINE_STYLE_OBJECTS = 2032;');
          const ownerRx=/const allowedDebtKeys = new Set\(\[[\s\S]*?\]\);/;
          assert.ok(ownerRx.test(test),'Historical collision allowance marker missing');
          test=test.replace(ownerRx,'const allowedDebtKeys = new Set(); // B954: no competing important-property owners');
          write('verification/ui-ownership-test.mjs',test);
          const changelog=read('CHANGELOG.md');
          write('CHANGELOG.md',
            '## Build 954 — CSS ownership consolidation\n\n'
            +'- Replace 45 identical Lucide inline flex styles and seven modal overlay inline objects with shared class-owned styling.\n'
            +'- Retire 12 overridden important declarations and require zero competing important-property owners.\n'
            +'- Preserve the normal/Focus logger, saved weights, data models, gestures, spacing and responsive theme behavior.\n\n'
            +changelog);
          write('NEXT_APP_UPDATE_PLAN.md',read('NEXT_APP_UPDATE_PLAN.md')
            +'\n\n## Build 954 — Verified static presentation consolidation\n\n'
            +'One shared owner replaces 52 duplicated static App JSX style objects (45 icons, seven modal overlays). '
            +'Remove 12 superseded same-selector/same-at-rule important declarations; preserve CSS fallbacks and all dynamic inline geometry. '
            +'Tighten the enforced budgets to 2,061 external priorities, zero repeated-important collisions, and 2,032 inline objects. '
            +'No training engine or storage API changes. Browser regression must cover Workout/Focus, dialogs, responsive themes, layout and accessibility. '
            +'This is a measured first cleanup batch; remaining legitimate dynamic styles and legacy declarations require separate audits.\n');
          let manifest=JSON.parse(read('RELEASE_MANIFEST.json'));
          assert.equal(manifest.build,953,'Start from published B953');
          manifest.uiMilestone='Build 954 · Consolidated shared icon/modal styles and retired CSS conflicts';
          write('RELEASE_MANIFEST.json',JSON.stringify(manifest,null,2)+'\n');
          console.log('B954_SOURCE_DELTA '+JSON.stringify({icons:iconCount,overlays:overlayCount,inlineRetired:52,priorityRetired:12}));
          NODE
      - name: Finalize release bytes and prove scoped source contracts
        run: |
          node scripts/finalize-release.mjs --next-build
          node --check modules/App.js
          node verification/ui-ownership-test.mjs
          node verification/b884-workout-hierarchy-test.mjs
          node scripts/verify-release.mjs
      - name: Commit audited B954 source and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finalize-b954-static-style.yml
          git add -A
          git commit -m "B954: consolidate static icon/modal styles and remove 12 CSS priority collisions"
          git push origin HEAD:refactor/b954-static-style-consolidation
