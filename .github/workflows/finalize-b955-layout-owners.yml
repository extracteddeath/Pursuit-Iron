# B955 one-shot static layout consolidation, self-removing after verification.
name: Finalize B955 Program/Workout presentation owners
on:
  push:
    branches: [refactor/b955-program-workout-static-layout]
    paths: ['.github/workflows/finalize-b955-layout-owners.yml']
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Move exact static styles to one shared presentation family
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=p=>fs.readFileSync(p,'utf8');
          const write=(p,t)=>fs.writeFileSync(p,t);
          let app=read('modules/App.js'), css=read('app.css');
          const inlineBefore=(app.match(/style:\s*\{/g)||[]).length;
          const definitions=[
            ['flex: 1, minWidth: 0','wpb-layout-grow-min','flex:1;min-width:0'],
            ['minWidth: 0, flex: 1','wpb-layout-grow-min','flex:1;min-width:0'],
            ['fontSize: 18, fontWeight: 700, marginBottom: 6','wpb-layout-heading-18-gap6','font-size:18px;font-weight:700;margin-bottom:6px'],
            ['flex: 1','wpb-layout-flex-one','flex:1'],
            ['overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap"','wpb-layout-truncate','overflow:hidden;text-overflow:ellipsis;white-space:nowrap'],
            ['fontSize: 15, fontWeight: 700','wpb-layout-strong-15','font-size:15px;font-weight:700'],
            ['display: "flex", alignItems: "center", gap: 6, marginBottom: 8','wpb-layout-row-tight-bottom8','display:flex;align-items:center;gap:6px;margin-bottom:var(--pi-space-2,8px)'],
            ['marginBottom: 12','wpb-layout-bottom12','margin-bottom:var(--pi-space-3,12px)'],
            ['display: "flex", gap: 8','wpb-layout-row-gap8','display:flex;gap:var(--pi-space-2,8px)'],
            ['display: "flex", alignItems: "center", gap: 6','wpb-layout-row-tight','display:flex;align-items:center;gap:6px'],
            ['fontSize: 18, fontWeight: 700','wpb-layout-strong-18','font-size:18px;font-weight:700'],
            ['display: "flex", gap: 8, alignItems: "flex-start", marginBottom: 8','wpb-layout-row-start-bottom8','display:flex;gap:var(--pi-space-2,8px);align-items:flex-start;margin-bottom:var(--pi-space-2,8px)'],
            ['fontSize: 13, fontWeight: 600','wpb-layout-support-600','font-size:13px;font-weight:600'],
            ['marginBottom: 16','wpb-layout-bottom16','margin-bottom:var(--pi-space-4,16px)'],
            ['display: "flex", gap: 8, marginTop: 8','wpb-layout-row-gap8-top8','display:flex;gap:var(--pi-space-2,8px);margin-top:var(--pi-space-2,8px)']
          ];
          const map=new Map(definitions.map(([body,cls,style])=>[body,{cls,style}]));
          const styles=new Map();
          for(const [,cls,style] of definitions){
            if(styles.has(cls))assert.equal(styles.get(cls),style);
            styles.set(cls,style);
          }
          const spans=[
            {start:'function ProgramView(',expected:23,name:'Program'},
            {start:'function WorkoutSession(',expected:51,name:'Workout'}
          ];
          // Descending source order leaves every earlier boundary stable.
          for(const span of [...spans].reverse()){
            const start=app.indexOf(span.start);
            const end=app.indexOf('\nfunction ',start+1);
            assert.ok(start>0 && end>start,span.name+' source boundary moved');
            const before=app.slice(start,end);
            let replacements=0;
            const after=before.replace(/_(jsx|jsxs)\("([a-z]+)", \{ style: \{ ([^{}]*) \}/g,(literal,kind,tag,body)=>{
              const match=map.get(body);
              if(!match)return literal;
              replacements++;
              return '_'+kind+'("'+tag+'", { className: "'+match.cls+'"';
            });
            assert.equal(replacements,span.expected,span.name+' exact static-style count');
            app=app.slice(0,start)+after+app.slice(end);
            console.log('B955 '+span.name+' migrated '+replacements+' first-prop static JSX styles');
          }
          assert.equal(inlineBefore-(app.match(/style:\s*\{/g)||[]).length,74,'Exactly 74 inline presentation objects must be removed');
          const anchor='/* M187 premium interaction contract.';
          assert.equal(css.split(anchor).length-1,1,'Shared layout insertion anchor missing/ambiguous');
          const shared=[
            '/* B955: shared static presentation for Program and Workout.',
            '   Keep computed weights, set geometry, timed motion and dynamic color inline.',
            '   Values intentionally retain original computed pixels for screenshot parity. */',
            ...[...styles].map(([cls,style])=>'#root .wpb .'+cls+',#root .'+cls+'{'+style+'}'),
            ''
          ].join('\n');
          css=css.replace(anchor,shared+anchor);
          write('modules/App.js',app);
          write('app.css',css);
          let audit=read('verification/ui-ownership-test.mjs');
          assert.ok(audit.includes('const MAX_INLINE_STYLE_OBJECTS = 2032;'),'Existing style budget changed');
          audit=audit.replace('const MAX_INLINE_STYLE_OBJECTS = 2032;','const MAX_INLINE_STYLE_OBJECTS = 1958; // B955: 74 Program/Workout inline presentations have shared CSS owners.');
          const sourceGuard=[
            '// B955: exact Program/Workout layout ownership. Dynamic style is never migrated here.',
            'for (const cls of '+JSON.stringify([...styles.keys()])+') {',
            '  assert.ok(css.includes("."+cls+","), "Missing shared presentation owner "+cls);',
            '}',
            'const b955Program=app.slice(app.indexOf("function ProgramView("),app.indexOf("\nfunction ",app.indexOf("function ProgramView(")+1));',
            'const b955Workout=app.slice(app.indexOf("function WorkoutSession("),app.indexOf("\nfunction ",app.indexOf("function WorkoutSession(")+1));',
            'assert.equal((b955Program.match(/className: "wpb-layout-/g)||[]).length,23,"Program static styles must be shared");',
            'assert.equal((b955Workout.match(/className: "wpb-layout-/g)||[]).length,51,"Workout static styles must be shared");',
            ''
          ].join('\n');
          // Deliberately use a literal slash-n in authored JavaScript, not a line break inside a quoted expression.
          const safeGuard=sourceGuard.replaceAll('app.indexOf("\nfunction ', 'app.indexOf("\\nfunction ');
          const marker="console.log('PASS UI ownership:";
          assert.equal(audit.split(marker).length-1,1,'Ownership audit insertion marker missing');
          audit=audit.replace(marker,safeGuard+marker);
          write('verification/ui-ownership-test.mjs',audit);
          write('NEXT_APP_UPDATE_PLAN.md',read('NEXT_APP_UPDATE_PLAN.md')
            +'\n\n## Build 955 — Program/Workout static layout ownership\n\n'
            +'Scoped refactor of 74 exact first-prop static JSX style objects in the Program (23) and Workout (51) component owners. '
            +'Reuse one shared CSS family for grow/min-width, truncation, repeated heading/type and compact layout rows. '
            +'No new important declarations, no dynamic style migration, no training/recording policy or storage changes. '
            +'Keep the 48px workout actions and B953 density intact. Tighten the static-inline debt ceiling from 2,032 to 1,958; '
            +'require all exact-head browser, engine, offline and release checks plus production byte verification. '
            +'Physical Android remains a separate sign-off.\n');
          console.log('B955_DELTA '+JSON.stringify({stylesRemoved:74,program:23,workout:51,newSharedOwners:styles.size,
              cssPriorityDelta:0,inlineAfter:(app.match(/style:\s*\{/g)||[]).length}));
          NODE
      - name: Increment build and verify all local ownership/release guards
        run: |
          node scripts/finalize-release.mjs --next-build
          node --check modules/App.js
          node --check verification/ui-ownership-test.mjs
          node verification/ui-ownership-test.mjs
          node verification/b884-workout-hierarchy-test.mjs
          node scripts/verify-release.mjs
      - name: Commit verified Build 955 and delete this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finalize-b955-layout-owners.yml
          git add -A
          git commit -m "B955: consolidate 74 Program and Workout static presentation objects"
          git push origin HEAD:refactor/b955-program-workout-static-layout
