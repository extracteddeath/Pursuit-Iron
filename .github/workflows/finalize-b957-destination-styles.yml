# One-shot source consolidation for Build 957. Self-removing after checks.
name: Finalize B957 cross-screen static style ownership
on:
  push:
    branches: [refactor/b957-shared-destination-styles]
    paths: ['.github/workflows/finalize-b957-destination-styles.yml']
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Reuse static CSS owners across destinations
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=p=>fs.readFileSync(p,'utf8'), write=(p,v)=>fs.writeFileSync(p,v);
          let app=read('modules/App.js'),css=read('app.css');
          const owners=[
            ['Home',10],['SettingsView',18],['ProgressDetail',9],
            ['StrengthSnapshotCard',9],['OneRepMaxCalc',9],['CompareView',21],
            ['ExerciseCharts',1],['ThousandClubCard',5],['TrainingHeatmap',7],
            ['GalleryView',5],['BlockReviewView',12],['LegacyProgramsCard',1],['ChangelogSheet',6]
          ];
          const initialInline=(app.match(/style:\s*\{/g)||[]).length;
          const initialImportant=(css.match(/!important/g)||[]).length;
          const parse=v=>v.split(/,\s*(?=[A-Za-z]\w*:)/).map(p=>{
            const m=p.trim().match(/^([A-Za-z]\w*):\s*(.*?)\s*$/);
            assert.ok(m,'Style parse drift: '+p);
            return {prop:m[1],value:m[2],key:m[1]+': '+m[2]};
          });
          const literal=v=>v.split(/,\s*(?=[A-Za-z]\w*:)/).every(p=>/^[A-Za-z]\w*:\s*(?:"[^"]*"|'[^']*'|-?\d+(?:\.\d+)?)$/.test(p.trim()));
          const rx=/_(jsx|jsxs)\("([a-z]+)", \{ style: \{ ([^{}]*) \}/g;
          const span=(s,n)=>{
            const a=s.indexOf('function '+n+'('),b=s.indexOf('\nfunction ',a+1);
            assert.ok(a>0&&b>a,'Destination boundary moved: '+n);
            return {a,b,text:s.slice(a,b)};
          };
          const frequency=new Map();
          for(const [name] of owners)for(const m of span(app,name).text.matchAll(rx)){
            if(!literal(m[3]))continue;
            for(const p of parse(m[3]))frequency.set(p.key,(frequency.get(p.key)||0)+1);
          }
          const selected=[...frequency].filter(([,count])=>count>=2);
          assert.equal(selected.length,38,'Shared static declaration count drifted');
          const alias=v=>v.replaceAll('"','').replaceAll("'","").replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase();
          const kebab=p=>p.replace(/[A-Z]/g,c=>'-'+c.toLowerCase());
          const dimensions=new Set(['gap','fontSize','width','minWidth','maxWidth','height','marginTop','marginBottom','paddingTop','paddingBottom','letterSpacing']);
          const cssValue=p=>{
            const match=p.value.match(/^["'](.*)["']$/),v=match?match[1]:p.value;
            if(!match&&/^-?\d+(\.\d+)?$/.test(v)&&Number(v)!==0&&dimensions.has(p.prop)){
              const spaces={4:1,8:2,12:3,16:4,20:5,24:6,32:8,40:10};
              if((p.prop==='gap'||p.prop.startsWith('margin')||p.prop.startsWith('padding'))&&spaces[Number(v)])
                return 'var(--pi-space-'+spaces[Number(v)]+','+v+'px)';
              return v+'px';
            }
            return v;
          };
          const declarations=new Map(),fresh=[];
          for(const [key] of selected){
            const p=parse(key)[0],suffix=alias(p.prop)+'-'+alias(p.value);
            const reused='wpb-s956-'+suffix,created='wpb-s957-'+suffix;
            const property=kebab(p.prop)+':'+cssValue(p);
            if(css.includes('.'+reused+'{'+property+'}')){
              declarations.set(key,reused);
            }else{
              assert.ok(!css.includes('.'+created+','),'Existing B957 selector conflict '+created);
              declarations.set(key,created);fresh.push({name:created,property});
            }
          }
          assert.equal(fresh.length,10,'Expected exactly ten new reusable declarations');
          assert.equal(declarations.size,38);
          const migrationCounts=new Map();
          // Apply source replacements from the back to protect earlier function offsets.
          for(const [name,expected] of [...owners].reverse()){
            const s=span(app,name);let count=0;
            const after=s.text.replace(rx,(all,kind,tag,body)=>{
              if(!literal(body))return all;
              const parts=parse(body);
              if(!parts.every(p=>frequency.get(p.key)>=2))return all;
              const classes=parts.map(p=>{assert.ok(declarations.has(p.key));return declarations.get(p.key);});
              assert.equal(new Set(classes).size,classes.length,'Duplicate utility in '+name);
              count++;
              return '_'+kind+'("'+tag+'", { className: "'+classes.join(' ')+'"';
            });
            assert.equal(count,expected,'Static presentation mismatch in '+name);
            migrationCounts.set(name,count);
            app=app.slice(0,s.a)+after+app.slice(s.b);
          }
          const total=[...migrationCounts.values()].reduce((a,b)=>a+b,0);
          assert.equal(total,113);
          assert.equal(initialInline-(app.match(/style:\s*\{/g)||[]).length,113);
          const anchor='/* M187 premium interaction contract.';
          assert.equal(css.split(anchor).length-1,1,'CSS owner anchor moved');
          const addition=[
            '/* B957: ten new shared static presentation tokens reused by Home, Progress, Profile and Settings.',
            '   Other migrated styles reuse B956 owners; dynamic and measured styles remain inline. */',
            ...fresh.map(({name,property})=>'#root .wpb .'+name+',#root .'+name+'{'+property+'}'),
            ''
          ].join('\n');
          css=css.replace(anchor,addition+anchor);
          assert.equal((css.match(/!important/g)||[]).length,initialImportant,'No new priorities allowed');
          write('modules/App.js',app);
          write('app.css',css);
          let audit=read('verification/ui-ownership-test.mjs');
          assert.ok(audit.includes('const MAX_INLINE_STYLE_OBJECTS = 1870;'),'Expected B956 source baseline');
          audit=audit.replace('const MAX_INLINE_STYLE_OBJECTS = 1870;','const MAX_INLINE_STYLE_OBJECTS = 1757; // B957: 113 more static screen styles retired.');
          const clauses=[
            '// B957 static style owners: keep these shared classes and each migrated destination.',
            'const b957NewOwners='+JSON.stringify(fresh.map(x=>x.name))+';',
            'assert.equal(b957NewOwners.length,10);',
            'for(const cls of b957NewOwners)assert.ok(css.includes("."+cls+","),"Missing B957 CSS owner "+cls);',
            ...owners.map(([name,count])=>'assert.equal((app.split("function '+name+'(")[1].split(String.fromCharCode(10)+"function ")[0].match(/className: "[^"]*wpb-s95(?:6|7)-/g)||[]).length,'+count+',"'+name+' shared owner regression");'),
            ''
          ].join('\n');
          const mark="console.log('PASS UI ownership:";
          assert.equal(audit.split(mark).length-1,1);
          audit=audit.replace(mark,clauses+mark);
          write('verification/ui-ownership-test.mjs',audit);
          write('NEXT_APP_UPDATE_PLAN.md',read('NEXT_APP_UPDATE_PLAN.md')
            +'\n\n## Build 957 — Cross-screen shared style ownership\n\n'
            +'Retire 113 more literal first-property JSX inline style objects across 13 screen and card owners: '
            +'Home 10, Settings 18, Progress detail 9, Strength snapshot 9, one-rep-max tool 9, comparison 21, '
            +'exercise charts 1, Thousand Club 5, heatmap 7, Gallery 5, block review 12, legacy cards 1, changelog 6. '
            +'Reuse 28 B956 CSS declaration owners and add only ten new CSS rules for the remaining shared values. '
            +'Preserve actual computed sizes/spacing, data-driven styles, training engine, set logger, and motion. '
            +'No new important rules. Ownership debt ceiling tightens 1,870 to 1,757. '
            +'Full candidate and deployed browser/core/engine integrity remain compulsory; physical Android testing separate.\n');
          console.log('B957_MIGRATION '+JSON.stringify({total,migration:[...migrationCounts],reused:28,newCSSRules:fresh.length,before:initialInline,after:(app.match(/style:\s*\{/g)||[]).length}));
          NODE
      - name: Finalize B957 and verify local source, engine and release contracts
        run: |
          node scripts/finalize-release.mjs --next-build
          node --check modules/App.js
          node --check verification/ui-ownership-test.mjs
          node verification/ui-ownership-test.mjs
          node verification/b884-workout-hierarchy-test.mjs
          node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/set-display-integrity-test.mjs
          node scripts/verify-release.mjs
      - name: Commit audited B957, remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finalize-b957-destination-styles.yml
          git add -A
          git commit -m "B957: consolidate 113 static styles across 13 UI destinations"
          git push origin HEAD:refactor/b957-shared-destination-styles
