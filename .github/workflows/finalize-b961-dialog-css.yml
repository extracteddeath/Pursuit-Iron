# Candidate-only one-shot release certification; remove this file before merging.
name: Finalize B961 dialog CSS
on:
  push:
    branches: [b961-dialog-style-ownership]
    paths:
      - '.github/workflows/finalize-b961-dialog-css.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify ownership and syntax
        run: |
          node --check modules/App.js
          node --check verification/b961-dialog-css-owner-test.mjs
          node verification/b961-dialog-css-owner-test.mjs
          node verification/ui-ownership-test.mjs
      - name: Finalize B961 and rehash runtime/offline assets
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p="RELEASE_MANIFEST.json",m=JSON.parse(fs.readFileSync(p,"utf8"));
            if(m.build!==960)throw new Error("Expected Build 960");
            m.uiMilestone="Build 961 · Shared modal and informational icon CSS ownership";
            fs.writeFileSync(p,JSON.stringify(m,null,2));
          '
          node scripts/finalize-release.mjs --next-build
          node scripts/verify-release.mjs
      - name: Remove temporary workflow and commit certified candidate
        run: |
          rm .github/workflows/finalize-b961-dialog-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize B961: modal CSS owners and cache hashes"
          git push origin HEAD:b961-dialog-style-ownership
