name: Finalize B962 split verdict hardening
on:
  push:
    branches: [b962-gym-edit-stability]
    paths: ['.github/workflows/finalize-b962-split.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify optional item fields and source ownership
        run: |
          node --check modules/App.js
          node verification/ui-ownership-test.mjs
          node verification/swap-scroll-integrity-test.mjs
      - name: Rehash B962 modules without changing build number
        run: |
          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
      - name: Remove one-shot workflows, save certified candidate
        run: |
          rm .github/workflows/finalize-b962-split.yml
          rm .github/workflows/diagnose-b962-wizard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Certify B962: safe split verdicts and updated cache checksums"
          git push origin HEAD:b962-gym-edit-stability
