# Single-use Build 962 finalizer, removed before merge. No direct main writes.
name: Finalize B962 gym edit and style ownership
on:
  push:
    branches: [b962-gym-edit-stability]
    paths:
      - '.github/workflows/finalize-b962.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check edited modules and source contracts
        run: |
          node --check modules/App.js
          node --check modules/gym-load-fields.js
          node --check verification/b846-gym-bar-weights-browser-test.mjs
          node verification/b846-gym-bar-weights-test.mjs
          node verification/ui-ownership-test.mjs
      - name: Version and certify B962 offline shell
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const file="RELEASE_MANIFEST.json",m=JSON.parse(fs.readFileSync(file,"utf8"));
            if(m.build!==961)throw new Error("Expected Build 961 before B962");
            m.uiMilestone="Build 962 · Atomic gym loading edits and shared layout polish";
            fs.writeFileSync(file,JSON.stringify(m,null,2));
          '
          node scripts/finalize-release.mjs --next-build
          node scripts/verify-release.mjs
      - name: Commit candidate and retire finalizer
        run: |
          rm .github/workflows/finalize-b962.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize B962: atomic gym edits, shared CSS and release hashes"
          git push origin HEAD:b962-gym-edit-stability
