name: Finalize positional double progression B952
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-double-positional-b952.yml']
permissions: { contents: write }
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: true, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - name: Certify positional load holds and PR event behavior
        run: |
          set -e
          node verification/b951-progression-pr-contract-test.mjs
          node verification/m220-day-progression-test.mjs
          node verification/m222-custom-program-parity-test.mjs
          node verification/m224-engine-hardening-test.mjs
          node verification/m232-live-autoregulation-test.mjs
          node verification/custom-progression-safety-test.mjs
          node verification/ui-ownership-test.mjs
      - name: Prepare B952 label
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p="RELEASE_MANIFEST.json",m=JSON.parse(fs.readFileSync(p,"utf8"));
            if(m.build!==951)throw new Error("Expected B951");
            m.uiMilestone="Build 951 · Double progression holds previous per-set weights";
            fs.writeFileSync(p,JSON.stringify(m,null,2));
          '
      - name: Finalize B952 release and PWA cache
        run: node scripts/finalize-release.mjs --next-build
      - name: Certify full release
        run: node scripts/verify-release.mjs
      - name: Publish B952
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish B952: preserve prior set loads during double progression"
          git push origin HEAD:main
