name: Finalize opt-in double progression and honest PR B951
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-double-pr-b951.yml']
permissions: { contents: write }
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: true, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - name: Verify held-load prescription, PR, and style ownership
        run: |
          failures=0
          for test in verification/b951-progression-pr-contract-test.mjs verification/m220-day-progression-test.mjs verification/m232-live-autoregulation-test.mjs verification/ui-ownership-test.mjs; do
            node "$test" || failures=1
          done
          exit "$failures"
      - name: Prepare B951 label
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p="RELEASE_MANIFEST.json",m=JSON.parse(fs.readFileSync(p,"utf8"));
            if(m.build!==950)throw new Error("Expected B950");
            m.uiMilestone="Build 950 · Rep-first double progression and verified PR alerts";
            fs.writeFileSync(p,JSON.stringify(m,null,2));
          '
      - name: Bump build and offline cache
        run: node scripts/finalize-release.mjs --next-build
      - name: Verify certified release
        run: node scripts/verify-release.mjs
      - name: Publish B951
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish B951: opt-in lower load and accurate PR events"
          git push origin HEAD:main
