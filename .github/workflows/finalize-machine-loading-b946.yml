# One-shot release finalization for the B946 machine loading grid repair.
name: Finalize machine loading B946
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-machine-loading-b946.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify actual machine increment and 120 lb history
        run: node verification/b946-machine-loading-grid-test.mjs
      - name: Prepare B946 release label
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p="RELEASE_MANIFEST.json",m=JSON.parse(fs.readFileSync(p,"utf8"));
            if (m.build !== 945) throw new Error("Expected B945 base before B946");
            m.uiMilestone="Build 945 · Machine increments and stable dynamic loading";
            fs.writeFileSync(p,JSON.stringify(m,null,2));
          '
      - name: Finalize release build, runtime hashes and offline cache
        run: node scripts/finalize-release.mjs --next-build
      - name: Verify complete certified release
        run: node scripts/verify-release.mjs
      - name: Publish B946
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish B946: enforce real equipment increments in dynamic sessions"
          git push origin HEAD:main
