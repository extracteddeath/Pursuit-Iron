# One-shot B948 release verification and finalization.
name: Finalize persistent update B948
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-persistent-update-b948.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify persistent action and safe live-workout snapshot
        run: node verification/b948-persistent-update-workout-test.mjs
      - name: Prepare B948 label
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p="RELEASE_MANIFEST.json",m=JSON.parse(fs.readFileSync(p,"utf8"));
            if (m.build !== 947) throw new Error("Expected B947 before B948");
            m.uiMilestone="Build 947 · Persistent safe workout update";
            fs.writeFileSync(p,JSON.stringify(m,null,2));
          '
      - name: Bump release and offline cache revision
        run: node scripts/finalize-release.mjs --next-build
      - name: Validate certified release
        run: node scripts/verify-release.mjs
      - name: Publish B948
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish B948: keep restart prompt visible and save workouts safely"
          git push origin HEAD:main
