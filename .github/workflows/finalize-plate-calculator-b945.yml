# This one-shot workflow finalizes the B945 production snapshot and then becomes inert.
name: Finalize plate calculator B945
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-plate-calculator-b945.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify plate calculator regression against the actual engine
        run: node verification/b945-plate-calculator-test.mjs
      - name: Prepare release label
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p="RELEASE_MANIFEST.json",m=JSON.parse(fs.readFileSync(p,"utf8"));
            if (m.build !== 944) throw new Error("Expected build 944 before B945 finalization");
            m.uiMilestone="Build 944 · Conventional plate loading and gym inventory safety";
            fs.writeFileSync(p,JSON.stringify(m,null,2));
          '
      - name: Finalize production manifests, cache revision and build number
        run: node scripts/finalize-release.mjs --next-build
      - name: Verify complete release package
        run: node scripts/verify-release.mjs
      - name: Publish certified B945 production snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish B945: inventory-safe conventional plate calculator"
          git push origin HEAD:main
