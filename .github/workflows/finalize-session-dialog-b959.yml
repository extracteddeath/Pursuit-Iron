# One-use certification and self-removal for Build 959 follow-up.
name: Finalize dialog B959 repair
on:
  push:
    branches: [b959-dialog-containment]
    paths:
      - '.github/workflows/finalize-session-dialog-b959.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Source, browser syntax and release guards
        run: |
          node --check verification/b959-session-dialog-browser-test.mjs
          node --check modules/session-choice-dialog.js
          node verification/b959-dialog-owner-test.mjs
          node verification/ui-ownership-test.mjs
      - name: Rehash updated runtime without changing certified build number
        run: |
          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
      - name: Commit verified repair and retire temporary finalizer
        run: |
          rm .github/workflows/finalize-session-dialog-b959.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Certify B959 dialog keyboard repair and remove one-shot workflow"
          git push origin HEAD:b959-dialog-containment
