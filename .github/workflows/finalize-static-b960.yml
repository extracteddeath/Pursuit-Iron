# One-use B960 candidate release finalizer; removed in its own release commit.
name: Finalize static CSS B960
on:
  push:
    branches: [b960-static-style-ownership]
    paths:
      - '.github/workflows/finalize-static-b960.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify static migration and unchanged priorities
        run: |
          node --check modules/App.js
          node verification/b960-static-presentation-test.mjs
          node verification/ui-ownership-test.mjs
      - name: Refresh build 960 offline and hashes
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const f="RELEASE_MANIFEST.json",m=JSON.parse(fs.readFileSync(f,"utf8"));
            if(m.build!==959)throw new Error("Expected B959 baseline");
            m.uiMilestone="Build 960 · Shared static presentation CSS ownership";
            fs.writeFileSync(f,JSON.stringify(m,null,2));
          '
          node scripts/finalize-release.mjs --next-build
          node scripts/verify-release.mjs
      - name: Save finalized candidate without temporary workflow
        run: |
          rm .github/workflows/finalize-static-b960.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize B960: 133 static styles migrated to shared CSS"
          git push origin HEAD:b960-static-style-ownership
