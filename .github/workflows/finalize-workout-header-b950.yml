# One-shot B950 release certification: maintain the existing important-debt ceiling.
name: Finalize workout header B950
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-workout-header-b950.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify header and no extra priority overrides
        run: |
          node verification/b884-workout-hierarchy-test.mjs
          node verification/ui-ownership-test.mjs
      - name: Prepare B950 release label
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p="RELEASE_MANIFEST.json",m=JSON.parse(fs.readFileSync(p,"utf8"));
            if(m.build!==949)throw new Error("Expected B949 before B950");
            m.uiMilestone="Build 949 · Aligned workout header with clean style ownership";
            fs.writeFileSync(p,JSON.stringify(m,null,2));
          '
      - name: Bump release and offline cache
        run: node scripts/finalize-release.mjs --next-build
      - name: Verify certified release
        run: node scripts/verify-release.mjs
      - name: Publish B950
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish B950: aligned workout header without new CSS overrides"
          git push origin HEAD:main
