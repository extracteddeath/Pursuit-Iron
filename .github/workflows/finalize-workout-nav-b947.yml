# One-time B947 release finalization; no recurring deployment or background work.
name: Finalize workout navigation B947
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-workout-nav-b947.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Test exercise names, set counts and accessible full labels
        run: node verification/b947-workout-nav-abbreviations-test.mjs
      - name: Prepare B947 release label
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p="RELEASE_MANIFEST.json",m=JSON.parse(fs.readFileSync(p,"utf8"));
            if (m.build !== 946) throw new Error("Expected B946 base for B947");
            m.uiMilestone="Build 946 · Compact workout exercise navigation";
            fs.writeFileSync(p,JSON.stringify(m,null,2));
          '
      - name: Rebuild version, JS hashes and offline cache
        run: node scripts/finalize-release.mjs --next-build
      - name: Verify release integrity
        run: node scripts/verify-release.mjs
      - name: Publish certified B947
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish B947: readable compact exercise pills"
          git push origin HEAD:main
