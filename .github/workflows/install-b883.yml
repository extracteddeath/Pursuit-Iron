name: Assemble validated B883 candidate

on:
  push:
    branches:
      - release/b883-native-loading-full

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check release bundle identity
        run: echo "5626c61938a15b54448e1f20a03bfa5999dc255b7c415f308e873ba5aced66f9  .release-import/b883-changes.tar.gz" | sha256sum -c -
      - name: Install B879–B883 into the B878 release base
        run: |
          tar -xzf .release-import/b883-changes.tar.gz -C .
          node scripts/verify-release.mjs
          node verification/b883-native-loading-step-test.mjs
      - name: Replace carrier with release source files
        run: |
          rm -f .release-import/b883-changes.tar.gz .github/workflows/install-b883.yml
          git add -A
          git -c user.name="Pursuit Iron Release" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Build 883: preserve B879–B882 enhancements and repair native loading steps"
          git push origin HEAD:refs/heads/release/b883-native-loading-full
