name: Assemble B884 workout cleanup

on:
  push:
    branches:
      - release/b884-workout-hierarchy

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify transfer identity
        run: echo "413237a3e98c8a07f0948aaaebf3482fdabe09b7b41eaca1910c1e44ad2db438  .release-import/b884-source-delta.tar.gz" | sha256sum -c -
      - name: Install B884 source and verify release
        run: |
          tar -xzf .release-import/b884-source-delta.tar.gz -C .
          node scripts/verify-release.mjs
          node verification/b884-workout-hierarchy-test.mjs
      - name: Commit source without transfer artifacts
        run: |
          rm -f .release-import/b884-source-delta.tar.gz .github/workflows/install-b884.yml
          git add -A
          git -c user.name="Pursuit Iron Release" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Build 884: set-first workout screen hierarchy and honest prior-load cues"
          git push origin HEAD:refs/heads/release/b884-workout-hierarchy
