name: Assemble validated B885 candidate
on:
  push:
    branches:
      - release/b885-balanced-set-rows
permissions:
  contents: write
jobs:
  assemble:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify B885 bundle identity
        run: echo "55729971fff3cd02f0e0fba194aac8a8cb7d88a124aab1f5370c5058d1576c87  .release-import/b885-delta.tar.gz" | sha256sum -c -
      - name: Assemble B884 hierarchy and B885 stable rows
        run: |
          tar -xzf .release-import/b885-delta.tar.gz -C .
          node scripts/verify-release.mjs
          node verification/b885-stable-workout-rows-test.mjs
      - name: Commit real release files
        run: |
          rm -f .release-import/b885-delta.tar.gz .github/workflows/install-b885.yml
          git add -A
          git -c user.name="Pursuit Iron Release" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Build 885: set-first hierarchy and even thumb-safe set rows"
          git push origin HEAD:refs/heads/release/b885-balanced-set-rows
