name: M165 Final Promotion

on:
  push:
    branches: [main]
    paths:
      - '.m165-final/**'
      - '.github/workflows/m165-final-promote.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for complete payload
        id: ready
        shell: bash
        run: |
          if [ -f .m165-final/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Repair and verify staged payload
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.m165-final/part-00')
          b = bytearray(p.read_bytes())
          b.insert(9932, ord('b'))
          p.write_bytes(b)
          p = Path('.m165-final/part-03')
          b = bytearray(p.read_bytes())
          b[1224] = ord('H')
          p.write_bytes(b)
          p = Path('.m165-final/part-05')
          b = bytearray(p.read_bytes())
          b[5792] = ord('U')
          p.write_bytes(b)
          PY
          cat .m165-final/part-* > /tmp/m165.payload.b64
          echo "4229d467dd0b254e1bf62ce73876bd71b0dfe24a6b567d368cd323ab25034cf9  /tmp/m165.payload.b64" | sha256sum -c -
          base64 -d /tmp/m165.payload.b64 | gzip -d > /tmp/m165.patch
          echo "8b40d38e9189864227aae656f549c4e26b6b1c90422af12ecfc021b9455e4afd  /tmp/m165.patch" | sha256sum -c -

      - name: Apply verified M165 payload
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/m165.patch
          git apply /tmp/m165.patch
          node scripts/verify-release.mjs
          rm -rf .m164-promote .m165-promote .m165-final
          rm -f .github/workflows/m165-final-promote.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release M165 set display integrity"
          git push origin HEAD:main
