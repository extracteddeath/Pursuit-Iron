name: M166 inspect regression targets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m166-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect volume helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('modules/App.js').read_text(errors='replace')
          low = s.lower()
          for needle in ['function volumeVerdicts', 'recent sessions', 'history.length', 'setsDone', 'entry.volume', 'h.volume', 'average', 'avg']:
              pos = 0
              shown = 0
              while shown < 20:
                  i = low.find(needle.lower(), pos)
                  if i < 0:
                      break
                  chunk = s[max(0, i-1800):min(len(s), i+3200)]
                  if needle in ['function volumeVerdicts', 'recent sessions'] or ('volume' in chunk.lower() and ('session' in chunk.lower() or 'history' in chunk.lower())):
                      shown += 1
                      print(f'--- {needle} #{shown} @ {i} ---')
                      print(chunk.replace('\n','\\n'))
                  pos = i + len(needle)
              print(f'SHOWN {needle}={shown}')
          PY
