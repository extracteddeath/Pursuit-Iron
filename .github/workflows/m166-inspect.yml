name: M166 inspect regression targets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m166-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact M166 targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('modules/App.js'), Path('app.js')]
          needles = [
              'canonicalShellSetCount(o.sets, base.sets)',
              'Avg volume/session',
              'From your training',
              'recent sessions',
              'volume/session',
              'avg volume',
              'avgVolume',
              'trainingVolume',
          ]
          for p in files:
              if not p.exists():
                  continue
              s = p.read_text(errors='replace')
              print(f'===== {p} bytes={len(s)} =====')
              for needle in needles:
                  start = 0
                  count = 0
                  while True:
                      i = s.lower().find(needle.lower(), start)
                      if i < 0:
                          break
                      count += 1
                      lo = max(0, i - 1200)
                      hi = min(len(s), i + len(needle) + 1800)
                      print(f'--- needle={needle!r} hit={count} offset={i} ---')
                      print(s[lo:hi].replace('\n', '\\n'))
                      start = i + len(needle)
                      if count >= 8:
                          break
                  if count:
                      print(f'COUNT {needle!r} = {count}')
          PY
