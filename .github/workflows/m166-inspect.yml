name: M166 inspect regression targets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m166-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact M166 targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [Path('modules/App.js'), Path('app.js')]
          needles = [
              'canonicalShellSetCount(o.sets, base.sets)',
              'fastest gains',
              'your response, not averages',
              'const verdicts',
              'verdicts =',
              'tonnage',
              'sessionVolume',
              'totalVolume',
              'avgVol',
              'volumePer',
              'training history',
          ]
          for p in files:
              if not p.exists():
                  continue
              s = p.read_text(errors='replace')
              print(f'===== {p} bytes={len(s)} =====')
              for needle in needles:
                  start = 0
                  count = 0
                  while True:
                      i = s.lower().find(needle.lower(), start)
                      if i < 0:
                          break
                      count += 1
                      lo = max(0, i - 2200)
                      hi = min(len(s), i + len(needle) + 3200)
                      print(f'--- needle={needle!r} hit={count} offset={i} ---')
                      print(s[lo:hi].replace('\n', '\\n'))
                      start = i + len(needle)
                      if count >= 10:
                          break
                  if count:
                      print(f'COUNT {needle!r} = {count}')
              if p.name == 'App.js':
                  pats = [
                      r'.{0,450}(?:avg|average).{0,180}volume.{0,450}',
                      r'.{0,450}volume.{0,180}(?:avg|average).{0,450}',
                      r'.{0,450}volume.{0,220}sessions?.{0,450}',
                      r'.{0,450}sessions?.{0,220}volume.{0,450}',
                  ]
                  for pat in pats:
                      hits = list(re.finditer(pat, s, flags=re.I|re.S))
                      print(f'REGEX {pat!r} count={len(hits)}')
                      for j,m in enumerate(hits[:16],1):
                          print(f'--- regex hit={j} offset={m.start()} ---')
                          print(m.group(0).replace('\n','\\n'))
          PY
