name: M166 inspect regression targets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m166-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate session volume metric
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          s = Path('modules/App.js').read_text(errors='replace')
          low = s.lower()
          scored=[]
          pos=0
          while True:
              i=low.find('volume',pos)
              if i<0: break
              lo=max(0,i-1200); hi=min(len(s),i+1800)
              c=s[lo:hi]; cl=c.lower()
              score=0
              for word,pts in [('session',5),('history',5),('perf',5),('average',4),('avg',4),('setsdone',4),('weight',3),('reps',3),(' lb',3),('tonnage',4),('recent',2)]:
                  if word in cl: score+=pts
              if score>=8:
                  scored.append((score,i,c))
              pos=i+6
          # Deduplicate nearby hits and keep strongest candidates.
          scored.sort(key=lambda x:(-x[0],x[1]))
          chosen=[]
          for item in scored:
              if all(abs(item[1]-x[1])>1800 for x in chosen):
                  chosen.append(item)
              if len(chosen)>=24: break
          chosen.sort(key=lambda x:x[1])

          out=['# M166 session-volume candidates','']
          for n,(score,i,c) in enumerate(chosen,1):
              out += [f'## Candidate {n} — score {score} — offset {i}','', '```js', c, '```','']

          # Also include the exact custom-set expression context in compact form.
          needle='canonicalShellSetCount(o.sets, base.sets)'
          i=low.find(needle.lower())
          if i>=0:
              out += ['## Custom-set expression','',f'offset {i}','', '```js', s[max(0,i-900):i+1400], '```','']
          Path('M166_VOLUME_INSPECT.md').write_text('\n'.join(out))
          PY

      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add M166_VOLUME_INSPECT.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore: isolate M166 session volume metric'
          git push
