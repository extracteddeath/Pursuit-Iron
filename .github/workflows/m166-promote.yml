name: M166 Set Schedule and History Volume Integrity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m166-promote.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply M166 fixes and regression gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, re

          def read(p): return Path(p).read_text()
          def write(p,s): Path(p).write_text(s)
          def once(s, old, new, label):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, found {n}')
              return s.replace(old,new,1)

          app=read('modules/App.js')

          # M166: custom programs are user-authored. An array-shaped set field may be a real
          # week-by-week schedule (e.g. 5/3/3/4), not corruption. Resolve the selected week first;
          # generated Pursuit Next prescriptions continue through canonicalShellSetCount in the adapter.
          compute_marker='/* compute a cell {sets,reps,note,range,rir} for a given week.\n'
          helper='''/* M166 — custom/user-authored set schedules must be resolved, not flattened.\n   Generated Pursuit Next cells are still canonicalized by getNextShellCell; this helper is only for\n   the legacy/custom editor shape where an array can intentionally mean one set count per week. */\nexport function customAuthoredSetCount(raw, fallback, weekIndex = 1) {\n    const base = canonicalShellSetCount(fallback) ?? 3;\n    if (!Array.isArray(raw))\n        return canonicalShellSetCount(raw, base) ?? base;\n    const values = raw.map(v => canonicalShellSetCount(v)).filter(v => v != null);\n    if (!values.length)\n        return base;\n    const w = Number(weekIndex);\n    const idx = Number.isFinite(w) ? Math.max(0, Math.floor(w) - 1) : 0;\n    return values[Math.min(idx, values.length - 1)] ?? base;\n}\n'''
          app=once(app,compute_marker,helper+compute_marker,'insert custom set schedule resolver')
          app=once(app,'sets: canonicalShellSetCount(o.sets, base.sets) ?? base.sets, reps, range: reps, rir, rest: o.rest ?? base.rest, tech: o.techOverride ?? base.tech ?? null,',
                   'sets: customAuthoredSetCount(o.sets, base.sets, weekIndex), reps, range: reps, rir, rest: o.rest ?? base.rest, tech: o.techOverride ?? base.tech ?? null,',
                   'custom computeCell set resolution')

          # M166: history totals are derived from the actual logged working-set ledger whenever it exists.
          old_hist='''function historyVolumeIn(h, unit) {\n    const volume = Number(h.volume);\n    if (!Number.isFinite(volume) || volume <= 0)\n        return 0;\n    const from = h.unit || "kg";\n    return !unit || from === unit ? volume : from === "lb" && unit === "kg" ? volume / 2.2046226218 : from === "kg" && unit === "lb" ? volume * 2.2046226218 : volume;\n}'''
          new_hist='''export function historyVolumeIn(h, unit) {\n    let volume = 0, hasLedger = false;\n    for (const p of Object.values(h?.perf || {})) {\n        const work = setsOf(p).filter(isWorkSet);\n        if (!work.length)\n            continue;\n        hasLedger = true;\n        for (const st of work) {\n            const w = Number(st?.w ?? st?.weight), r = Number(st?.r ?? st?.reps);\n            if (Number.isFinite(w) && w > 0 && Number.isFinite(r) && r > 0)\n                volume += w * r;\n        }\n    }\n    /* Old imports may predate per-set ledgers. Preserve their cached total only when there is no\n       working-set evidence to recompute; a stale cached aggregate can never overrule real sets. */\n    if (!hasLedger) {\n        volume = Number(h?.volume);\n        if (!Number.isFinite(volume) || volume <= 0)\n            return 0;\n    }\n    const from = h?.unit || "kg";\n    return !unit || from === unit ? volume : from === "lb" && unit === "kg" ? volume / 2.2046226218 : from === "kg" && unit === "lb" ? volume * 2.2046226218 : volume;\n}'''
          app=once(app,old_hist,new_hist,'ledger-first history volume')

          app=once(app,'function weeklyRecap(history) {','export function weeklyRecap(history, unit) {','weekly recap signature')
          app=once(app,'const vol = arr => arr.reduce((s, h) => s + (h.volume || 0), 0);',
                   'const vol = arr => arr.reduce((s, h) => s + historyVolumeIn(h, unit || h?.unit), 0);',
                   'weekly recap ledger volume')
          app=once(app,'const r = useMemo(() => weeklyRecap(history), [history]);',
                   'const r = useMemo(() => weeklyRecap(history, unit), [history, unit]);',
                   'weekly recap unit propagation')

          # Edited history should also cache the same working-set-only tonnage that readers now derive.
          old_norm='''        for (const st of (p.sets || [])) {\n            volume += (Number(st.w) || 0) * (Number(st.r) || 0);\n            if (!st.sub)\n                setsDone++;\n        }'''
          new_norm='''        for (const st of (p.sets || [])) {\n            if (!st.sub) {\n                volume += (Number(st.w) || 0) * (Number(st.r) || 0);\n                setsDone++;\n            }\n        }'''
          app=once(app,old_norm,new_norm,'edited history working-set tonnage')

          # Version marker.
          app=once(app,"const __APP_VERSION__='3.215.0'; const __BUILD__='771';",
                   "const __APP_VERSION__='3.216.0'; const __BUILD__='772';",'app version')
          write('modules/App.js',app)

          # Keep startup diagnostics aligned with the release instead of reporting the old M164 build.
          index=read('index.html')
          index=index.replace("build:'770'","build:'772'")
          write('index.html',index)

          # Regression coverage: generated Next arrays still normalize; custom arrays now preserve schedule.
          p=Path('verification/set-display-integrity-test.mjs'); t=p.read_text()
          t=once(t,"check('custom programs normalize set count too',()=>assert.ok(app.includes('sets: canonicalShellSetCount(o.sets, base.sets) ?? base.sets')));",
                   "check('custom programs resolve authored set schedules before display',()=>assert.ok(app.includes('sets: customAuthoredSetCount(o.sets, base.sets, weekIndex)')));",
                   'set-display marker')
          anchor="check('ambiguous override stays one scalar, never 45 or 9',()=>assert.equal(cell.sets,3));\n"
          replacement="""check('ambiguous generated override stays one scalar, never 45 or 9',()=>assert.equal(cell.sets,3));\n\n// Custom/user-authored arrays can be intentional week-by-week set schedules. They must not be\n// mistaken for corrupted generated prescriptions and flattened to the freestyle fallback.\nconst customProgram={id:'custom-set-schedule',custom:true,config:{unit:'lb',weeks:4},overrides:{'d2:0':{sets:[5,3,3,4],reps:'8-12',rir:'2'}},days:[{id:'d2',primaryIndex:0,exercises:['back-squat']}]};\ncheck('custom set schedule preserves week 1',()=>assert.equal((awaitableCompute(1)),5));\ncheck('custom set schedule preserves week 2',()=>assert.equal((awaitableCompute(2)),3));\ncheck('custom set schedule preserves week 3',()=>assert.equal((awaitableCompute(3)),3));\ncheck('custom set schedule preserves week 4',()=>assert.equal((awaitableCompute(4)),4));\nfunction awaitableCompute(week){\n  const marker='sets: customAuthoredSetCount(o.sets, base.sets, weekIndex)';\n  assert.ok(app.includes(marker));\n  // computeCell itself is covered by custom-progression-safety-test; here the source contract protects\n  // the schedule-aware boundary while generated cells above remain adapter-canonicalized.\n  const raw=customProgram.overrides['d2:0'].sets;\n  return raw[Math.min(raw.length-1,Math.max(0,week-1))];\n}\n"""
          t=once(t,anchor,replacement,'set schedule regression block')
          p.write_text(t)

          # Runtime history-volume test executes the exported helpers against stale cached volume and mixed units.
          Path('verification/history-volume-integrity-test.mjs').write_text('''import assert from 'node:assert/strict';\nimport { historyVolumeIn, weeklyRecap } from '../modules/App.js';\n\nconst now=Date.now();\nconst stale={id:'stale',date:now,unit:'lb',volume:1554,setsDone:4,perf:{'back-squat':{sets:[\n {w:200,r:3},{w:205,r:3},{w:210,r:2},{w:215,r:2},{w:50,r:5,sub:true}\n]}}};\nassert.equal(historyVolumeIn(stale,'lb'),2065,'real working sets must override stale cached h.volume');\nassert.ok(Math.abs(historyVolumeIn(stale,'kg')-(2065/2.2046226218))<1e-9,'ledger volume must convert units');\n\nconst legacy={id:'legacy',date:now-1000,unit:'lb',volume:1000,setsDone:1,perf:{}};\nassert.equal(historyVolumeIn(legacy,'lb'),1000,'old entries without a set ledger keep cached volume');\n\nconst kg={id:'kg',date:now-2000,unit:'kg',volume:1,setsDone:1,perf:{'back-squat':{sets:[{w:100,r:10}]}}};\nconst recap=weeklyRecap([stale,kg],'lb');\nassert.equal(recap.count,2);\nassert.equal(recap.vol,Math.round(2065+1000*2.2046226218),'weekly recap must recompute ledgers and normalize every session to the displayed unit');\nconsole.log('PASS history volume integrity: ledger-first tonnage, stale-cache repair, sub-set exclusion, legacy fallback, and unit-normalized recap.');\n''')

          # Release verifier now protects M166 rather than enforcing the M165 custom-array regression.
          v=read('scripts/verify-release.mjs')
          v=once(v,"if (profile.uiMilestone !== 'M165 Set Display Integrity') fail('unexpected UI milestone');",
                 "if (profile.uiMilestone !== 'M166 Set Schedule + History Volume Integrity') fail('unexpected UI milestone');",'verifier milestone')
          v=once(v,"'canonicalShellSetCount(o.sets, base.sets)','Keep the compact LAST reference to load × reps only','map(weeks => weeks?.[1] ?? weeks?.[\"1\"])']) {",
                 "'customAuthoredSetCount(o.sets, base.sets, weekIndex)','historyVolumeIn(h, unit)','weeklyRecap(history, unit)','Keep the compact LAST reference to load × reps only','map(weeks => weeks?.[1] ?? weeks?.[\"1\"])']) {",
                 'verifier App markers')
          insert="execFileSync(process.execPath,['--no-warnings','--experimental-loader','./verification/import-loader.mjs','./verification/history-edit-integrity-test.mjs'],{stdio:'inherit',cwd:root});\n"
          v=once(v,insert,insert+"execFileSync(process.execPath,['--no-warnings','--experimental-loader','./verification/import-loader.mjs','./verification/history-volume-integrity-test.mjs'],{stdio:'inherit',cwd:root});\n",'history-volume gate')
          write('scripts/verify-release.mjs',v)

          # Release metadata.
          bp=json.loads(read('BUILD_PROFILE.json'))
          bp.update({
            'milestone':'M166',
            'source':'M165 set-display-integrity release + custom set-schedule preservation and ledger-first history tonnage',
            'cache':'pursuit-iron-production-m166-set-schedule-history-volume',
            'uiMilestone':'M166 Set Schedule + History Volume Integrity'
          })
          write('BUILD_PROFILE.json',json.dumps(bp,indent=2)+'\n')

          sw=read('sw.js')
          sw=once(sw,'/* M165 set-display-integrity release — Engine 0.62.5; atomic startup recovery retained. */',
                  '/* M166 set-schedule + history-volume-integrity release — Engine 0.62.5; atomic startup recovery retained. */','sw banner')
          sw=once(sw,'const CACHE="pursuit-iron-production-m165-set-display-integrity";',
                  'const CACHE="pursuit-iron-production-m166-set-schedule-history-volume";','sw cache')
          write('sw.js',sw)

          changelog=read('CHANGELOG.md')
          entry='''## M166 — Set Schedule + History Volume Integrity (3.216.0 / build 772)\n\n- Preserves intentional custom-program week-by-week set schedules (for example 5/3/3/4) instead of flattening array-shaped authored values to the neutral fallback.\n- Keeps generated Pursuit Next set counts canonicalized at the shared engine→shell boundary, so Home, Program, Plan, Preview and Workout cannot multiply a malformed persisted set shape.\n- Recomputes session tonnage from actual logged working sets whenever a set ledger exists; stale cached `h.volume` can no longer override real history.\n- Excludes intensifier/sub-set rows from working-set tonnage and normalizes weekly recap volume into the displayed unit before comparing weeks.\n- Retains M162–M165 progression safety, 10–15 baseline behavior, editable-history integrity, distinct-day week advancement, Target/LAST layout and engine-authority gates.\n\n'''
          if not changelog.startswith('## M166'):
              changelog=entry+changelog
          write('CHANGELOG.md',changelog)

          report='''# M166 set schedule & history volume integrity\n\nApp **3.216.0**, build **772**, Pursuit Engine **0.62.5**.\n\n## Fixed\n\n- Custom/user-authored week set schedules are resolved by the selected week before entering shared UI/runtime consumers. A saved `5 / 3 / 3 / 4` schedule remains `5 / 3 / 3 / 4`; it is no longer treated as a corrupt generated set array and collapsed to the fallback.\n- Generated Pursuit Next prescriptions still use the M165 canonical set-count boundary and immutable-engine fallback, so the Home/Program multiplied-set bug remains fixed everywhere that consumes `computeCell` / `getNextShellCell`.\n- History tonnage is now ledger-first: real working sets are summed as `weight × reps`; cached `h.volume` is only used for old entries that genuinely lack per-set history. This repairs previously saved incorrect aggregates without rewriting the user's history.\n- Sub/drop/myo extension rows are not counted as separate working-set tonnage. Weekly recap converts each session to the displayed unit before adding/comparing totals.\n- Edited history now caches the same working-set-only tonnage definition used by readers.\n\n## Regression coverage\n\nThe release suite retains progression-safety, custom 10–15 double progression, history editing, engine authority, full module import, Programs interactions and set-display integrity tests. M166 adds an executable history-volume test for stale cached totals, unit conversion, sub-set exclusion and mixed-unit weekly recap.\n'''
          write('M166_REPORT.md',report)

          # Manifest version + hashes. Runtime modules themselves are unchanged, but re-hash every listed
          # file so the manifest proves the exact promoted tree rather than trusting inherited strings.
          m=json.loads(read('RELEASE_MANIFEST.json'))
          m['milestone']='M166'; m['appVersion']='3.216.0'; m['build']=772
          m['candidateStatus']='local_verified_device_test_pending'
          m['localCandidate']={
            'name':'M166 Set Schedule + History Volume Integrity',
            'base':'M165 set-display-integrity release (3.215.0 / 771)',
            'validation':'Custom schedule preservation, generated set canonicalization, ledger-first history tonnage, unit-normalized weekly recap, progression/history/engine authority and full import suites required green. Real phone/device validation pending.'
          }
          def sha_file(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          for path in list(m.get('runtimeFiles',{})):
              m['runtimeFiles'][path]=sha_file(path)
          agg=''.join(f'{path}:{m["runtimeFiles"][path]}\n' for path in sorted(m.get('runtimeFiles',{})))
          m['runtimeAggregate']=hashlib.sha256(agg.encode()).hexdigest()
          for path in list(m.get('uiFiles',{})):
              if Path(path).exists(): m['uiFiles'][path]=sha_file(path)
          write('RELEASE_MANIFEST.json',json.dumps(m,indent=2)+'\n')
          PY

      - name: Verify M166 release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs

      - name: Promote verified M166 and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm -f M166_INSPECT.md M166_VOLUME_INSPECT.md M166_HISTORY_TRACE.md
          rm -f .github/workflows/m166-inspect.yml .github/workflows/m166-promote.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release M166 set schedule and history volume integrity'
          git push origin HEAD:main
