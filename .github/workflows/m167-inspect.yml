name: M167 Inspect Regressions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m167-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover legacy set-bias semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('modules/App.js').read_text()
          a=s.find('function computeCell(program, day, id, slotIndex, weekIndex)')
          b=s.find('\nfunction ',a+20)
          print('===== CURRENT computeCell =====')
          print(s[a:b if b>0 else a+14000])
          print('===== CURRENT autoBias hits =====')
          start=0
          for n in range(30):
            i=s.find('autoBias',start)
            if i<0: break
            print(f'--- {n+1} @ {i} ---')
            print(s[max(0,i-900):i+1600])
            start=i+8
          PY
          echo '===== HISTORY candidates touching computeCell/autoBias ====='
          git log --all --oneline -S'autoBias' -- modules/App.js | head -30 || true
          git log --all --oneline -S'function computeCell(program, day, id, slotIndex, weekIndex)' -- modules/App.js | head -30 || true
          echo '===== PRE-M165 parent/current computeCell snippets ====='
          for ref in 7d471effb245857442f9719f642e1f160a656ff5^ 7d471effb245857442f9719f642e1f160a656ff5^^ 14593365ff34e6427116d92d0333e2a0ed1a3425^; do
            echo "--- REF $ref ---"
            git show "$ref:modules/App.js" > /tmp/app-old.js 2>/dev/null || { echo missing; continue; }
            python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/app-old.js').read_text()
          a=s.find('function computeCell(program, day, id, slotIndex, weekIndex)')
          b=s.find('\nfunction ',a+20)
          print(s[a:b if b>0 else a+14000] if a>=0 else 'computeCell missing')
          PY
          done
