name: M167 Inspect Regressions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m167-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect cycle integrity boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('modules/App.js').read_text()
          for marker in ['function requireCompleteCycleShell(', 'const requireCompleteCycleShell', 'const doCompleteCycleBlock = (cycle) => {']:
            print('\n===== '+marker+' =====')
            i=s.find(marker)
            if i<0: print('NO MATCH'); continue
            print(s[max(0,i-1000):min(len(s),i+13000)])
          PY
