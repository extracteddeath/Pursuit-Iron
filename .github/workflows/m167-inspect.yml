name: M167 Inspect Regressions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m167-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect original legacy computeCell bias logic
        shell: bash
        run: |
          set -euo pipefail
          for ref in 0ab4de3 $(git rev-list --all -- modules/App.js | tail -1); do
            echo "===== REF $ref ====="
            git show "$ref:modules/App.js" > /tmp/app-old.js 2>/dev/null || { echo missing; continue; }
            python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/app-old.js').read_text(errors='replace')
          for marker in ['function computeCell(', 'function distributeVolBias(', 'slotBias?.[', 'autoBias?.[']:
            print('\n--- '+marker+' ---')
            start=0; hits=0
            while True:
              i=s.find(marker,start)
              if i<0 or hits>=8: break
              print(s[max(0,i-1200):min(len(s),i+6500)])
              start=i+len(marker); hits+=1
            if not hits: print('NO MATCH')
          PY
          done
          echo '===== commits mentioning custom branch introduction ====='
          git log --all --oneline -S'program?.custom === true' -- modules/App.js | head -20 || true
