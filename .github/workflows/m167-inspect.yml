name: M167 Inspect Regressions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m167-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace legacy dose helpers and conversion bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('modules/App.js').read_text()
          for marker in [
            'function baseSetsFor(',
            'function weeksOf(',
            'function weekIntent(',
            'function volumeLedger(',
            'const beginCycleConversion = (p) =>',
            'REBUILD A PREVIOUS-ENGINE PROGRAM',
            'const rebuild',
            'engineDeclined'
          ]:
            print('\n===== '+marker+' =====')
            start=0; hits=0
            while True:
              i=s.find(marker,start)
              if i<0 or hits>=10: break
              print(f'--- hit {hits+1} @ {i} ---')
              print(s[max(0,i-1600):min(len(s),i+8000)])
              start=i+len(marker); hits+=1
            if not hits: print('NO MATCH')

          c=Path('modules/next-engine/cycle-runtime-adapter.js').read_text()
          a=c.find('export function convertProgramToNextCycleForShell')
          print('\n===== FULL convertProgramToNextCycleForShell =====')
          print(c[a:])
          PY
