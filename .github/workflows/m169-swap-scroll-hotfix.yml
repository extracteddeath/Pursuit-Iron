name: M169 swap scroll hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m169-swap-scroll-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix swap exercise scrolling and publish M169
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const read = p => fs.readFileSync(p, 'utf8');
          const write = (p, s) => fs.writeFileSync(p, s);
          const countOf = (s, needle) => s.split(needle).length - 1;
          const replaceOnce = (s, oldText, newText, label) => {
            const n = countOf(s, oldText);
            if (n !== 1) throw new Error(`${label}: expected 1 match, found ${n}`);
            return s.replace(oldText, newText);
          };

          let app = read('modules/App.js');
          app = replaceOnce(app,
            "const __APP_VERSION__='3.218.0'; const __BUILD__='774';",
            "const __APP_VERSION__='3.219.0'; const __BUILD__='775';",
            'app version/build');

          app = replaceOnce(app,
            'className: "wpb-scroll wpb-swap-results", "data-swap-results": true, style: { flex: 1, minHeight: 0, overflowY: "auto", overscrollBehavior: "contain", WebkitOverflowScrolling: "touch", paddingRight: 2 }',
            'className: "wpb-scroll wpb-swap-results", "data-swap-results": true, style: { flex: 1, minHeight: 0, overflowY: "auto", overscrollBehavior: "contain", WebkitOverflowScrolling: "touch", touchAction: "pan-y", paddingRight: 2 }',
            'swap results native scroller');

          app = replaceOnce(app,
            '_jsxs("div", { className: "wpb-scroll", style: { overflowY: "auto", marginTop: 6 }, children: [filtered.length',
            '_jsxs("div", { className: "wpb-swap-list", "data-swap-list": true, style: { marginTop: 6 }, children: [filtered.length',
            'nested swap list scroller');
          write('modules/App.js', app);

          let index = read('index.html');
          index = index.replaceAll("build:'774'", "build:'775'");
          write('index.html', index);

          let sw = read('sw.js');
          sw = replaceOnce(sw,
            '/* M168 cycle-overview clarity + phase semantics — Engine 0.62.5; atomic startup recovery retained. */',
            '/* M169 swap-sheet native scrolling — Engine 0.62.5; atomic startup recovery retained. */',
            'service worker release comment');
          sw = replaceOnce(sw,
            'const CACHE="pursuit-iron-production-m168-cycle-overview";',
            'const CACHE="pursuit-iron-production-m169-swap-scroll";',
            'service worker cache');
          write('sw.js', sw);

          const profile = JSON.parse(read('BUILD_PROFILE.json'));
          profile.milestone = 'M169';
          profile.source = 'M168 + swap-sheet single native vertical scroller';
          profile.cache = 'pursuit-iron-production-m169-swap-scroll';
          profile.uiMilestone = 'M169 Swap Sheet Scrolling';
          write('BUILD_PROFILE.json', JSON.stringify(profile, null, 2) + '\n');

          let verify = read('scripts/verify-release.mjs');
          verify = replaceOnce(verify,
            "if (profile.uiMilestone !== 'M168 Cycle Overview + Phase Semantics') fail('unexpected UI milestone');",
            "if (profile.uiMilestone !== 'M169 Swap Sheet Scrolling') fail('unexpected UI milestone');",
            'verify milestone');
          if (!verify.includes("verification/swap-scroll-integrity-test.mjs")) {
            const hook = "execFileSync(process.execPath,['verification/cycle-overview-ui-test.mjs'],{stdio:'inherit',cwd:root});";
            verify = replaceOnce(verify, hook, hook + "\nexecFileSync(process.execPath,['verification/swap-scroll-integrity-test.mjs'],{stdio:'inherit',cwd:root});", 'swap regression hook');
          }
          write('scripts/verify-release.mjs', verify);

          write('verification/swap-scroll-integrity-test.mjs', `import fs from 'node:fs';\n\nconst app = fs.readFileSync(new URL('../modules/App.js', import.meta.url), 'utf8');\nconst fail = msg => { console.error('SWAP SCROLL TEST FAILED: ' + msg); process.exit(1); };\n\nconst resultAt = app.indexOf('"data-swap-results": true');\nif (resultAt < 0) fail('swap results container missing');\nconst results = app.slice(Math.max(0, resultAt - 100), resultAt + 420);\nfor (const marker of ['className: "wpb-scroll wpb-swap-results"','flex: 1','minHeight: 0','overflowY: "auto"','WebkitOverflowScrolling: "touch"','touchAction: "pan-y"']) {\n  if (!results.includes(marker)) fail('swap results is missing native-scroll marker: ' + marker);\n}\nif (!app.includes('className: "wpb-swap-list", "data-swap-list": true, style: { marginTop: 6 }')) fail('replacement list is not a non-scrolling child of the results scroller');\nif (app.includes('_jsxs("div", { className: "wpb-scroll", style: { overflowY: "auto", marginTop: 6 }, children: [filtered.length')) fail('nested vertical scroller returned to replacement list');\nconsole.log('Swap sheet single-scroller integrity OK.');\n`);

          let changelog = read('CHANGELOG.md');
          const entry = `## M169 — Swap Sheet Scrolling (3.219.0 / build 775)\n\n- Fixes the exercise replacement list on touch devices by making the swap-results region the single vertical scroll owner.\n- Removes the nested \`wpb-scroll\` from the ranked replacement list; that child had its own contained overscroll behavior and could consume a vertical swipe before the parent sheet moved.\n- Explicitly allows native vertical panning and momentum scrolling on the results region while keeping sheet drag-to-dismiss isolated to the sheet's top grab band.\n- Adds a regression gate for the single-scroller structure. Pursuit Engine 0.62.5 programming behavior is unchanged.\n\n`;
          if (!changelog.startsWith('## M169 — Swap Sheet Scrolling')) changelog = entry + changelog;
          write('CHANGELOG.md', changelog);

          write('M169_REPORT.md', `# M169 swap sheet scrolling\n\nApp **3.219.0**, build **775**, Pursuit Engine **0.62.5**.\n\n## Root cause\n\nThe Swap Exercise sheet had two nested vertical scroll owners: the full results region and a second \`wpb-scroll\` around the ranked exercise buttons. The shared \`wpb-scroll\` class uses contained overscroll and momentum scrolling. On touch devices, a swipe beginning on an exercise row could be captured by the inner element even though the parent was the element with the usable scroll range.\n\n## Fix\n\n- The \`wpb-swap-results\` region is now the only vertical scroller in the replacement results area.\n- It has \`minHeight: 0\`, native \`overflowY: auto\`, momentum scrolling, contained overscroll, and explicit \`touchAction: pan-y\`.\n- The ranked replacement list is a normal content container, so swipes on exercise cards move the parent results scroller.\n- The existing sheet drag gesture remains limited to the top grab band.\n\n## Verification\n\n- Added \`verification/swap-scroll-integrity-test.mjs\`.\n- Full release verification must pass before this workflow publishes.\n- No engine prescription, progression, history, or saved-program semantics were changed. Physical-device validation remains separate from static release verification.\n`);

          const manifest = JSON.parse(read('RELEASE_MANIFEST.json'));
          manifest.milestone = 'M169';
          manifest.appVersion = '3.219.0';
          manifest.build = 775;
          manifest.localCandidate = {
            name: 'M169 Swap Sheet Scrolling',
            base: 'M168 cycle overview + phase semantics (3.218.0 / 774)',
            validation: 'Single-scroll-owner swap-sheet regression plus existing progression/history/engine-authority/program interaction and cycle-overview suites. Physical phone validation pending.'
          };
          const hash = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          for (const file of Object.keys(manifest.runtimeFiles || {})) manifest.runtimeFiles[file] = hash(file);
          const aggregateBlob = Object.keys(manifest.runtimeFiles || {}).sort().map(file => `${file}:${manifest.runtimeFiles[file]}\n`).join('');
          manifest.runtimeAggregate = crypto.createHash('sha256').update(Buffer.from(aggregateBlob)).digest('hex');
          for (const file of Object.keys(manifest.uiFiles || {})) manifest.uiFiles[file] = hash(file);
          write('RELEASE_MANIFEST.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

          node scripts/verify-release.mjs

          rm -f SWAP_DEBUG.txt .github/workflows/swap-scroll-debug.yml .github/workflows/m169-swap-scroll-hotfix.yml
          git config user.name "Pursuit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "M169: fix swap exercise scrolling"
          git push
