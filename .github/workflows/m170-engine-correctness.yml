name: M170 Engine Correctness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m170-engine-correctness.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
