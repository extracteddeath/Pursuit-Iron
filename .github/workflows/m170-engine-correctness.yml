const allEquipment = ['barbell','rack','bench','dumbbell','cable','machine','smith','leg_press','pullup_bar','bodyweight'];
const requestOf = avoidedExercises => ({
  athlete:{experience:'intermediate'},
  goal:{type:'hypertrophy',musclePriorities:{},liftPriorities:{}},
  schedule:{days:[{day:'monday',maxMinutes:60},{day:'wednesday',maxMinutes:60},{day:'friday',maxMinutes:60}]},
