name: M170 Engine Correctness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m170-engine-correctness.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply M170 patch
        run: node scripts/m170-patch.mjs
      - name: Verify release
        run: node scripts/verify-release.mjs
      - name: Publish M170
        run: |
          rm -f .github/workflows/m170-engine-correctness.yml scripts/m170-patch.mjs
          git config user.name "Pursuit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "M170: engine correctness items 1-5"
          git push
