`export function deriveLongitudinalExerciseEvidence(diagnoses, latestDecisions = [], sourceExercises = []) {
    const successful = new Set();
    const protectedIds = new Set(sourceExercises.filter(ex => ex.role === 'primary_strength').map(ex => ex.exerciseId));
    const replaceExerciseIds = new Set();
    const techniqueLimitedExerciseIds = new Set();
    const fatigueLimitedExerciseIds = new Set();
    const diagnosisById = new Map((diagnoses ?? []).map(d => [d.exerciseId, d]));
    for (const diagnosis of diagnoses ?? []) {
        if (diagnosis.state === 'poor_fit')
            replaceExerciseIds.add(diagnosis.exerciseId);
        else if (diagnosis.state === 'technique_limited') {
            techniqueLimitedExerciseIds.add(diagnosis.exerciseId);
            protectedIds.add(diagnosis.exerciseId);
        }
        else if (diagnosis.state === 'fatigue_limited') {
            fatigueLimitedExerciseIds.add(diagnosis.exerciseId);
            protectedIds.add(diagnosis.exerciseId);
        }
        else if (['progressing', 'underloaded', 'possibly_understimulated'].includes(diagnosis.state) && diagnosis.confidence !== 'low')
            successful.add(diagnosis.exerciseId);
    }
    // A recent progression success may support continuity when the longitudinal diagnosis is still
    // uncertain, but it can never override repeated discomfort/poor-fit evidence.
    for (const decision of latestDecisions ?? []) {
        const diagnosis = diagnosisById.get(decision.exerciseId);
        if (recoverySignalForDecision(decision) > 0 && (!diagnosis || diagnosis.state === 'uncertain') && !replaceExerciseIds.has(decision.exerciseId))
            successful.add(decision.exerciseId);
    }
    for (const id of replaceExerciseIds) {
        successful.delete(id);
        protectedIds.delete(id);
    }
    return {
        successfulExerciseIds: [...successful],
        protectedExerciseIds: [...protectedIds],
        replaceExerciseIds: [...replaceExerciseIds],
        techniqueLimitedExerciseIds: [...techniqueLimitedExerciseIds],
        fatigueLimitedExerciseIds: [...fatigueLimitedExerciseIds]
    };
}

/** Runtime bridge only: asks Pursuit Engine's own performance evaluator what the next exposure should do. */`,
