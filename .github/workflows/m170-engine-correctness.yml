          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const read = p => fs.readFileSync(p, 'utf8');
          const write = (p, s) => fs.writeFileSync(p, s);
          const countOf = (s, needle) => s.split(needle).length - 1;
          const replaceOnce = (s, oldText, newText, label) => {
            const n = countOf(s, oldText);
            if (n !== 1) throw new Error(`${label}: expected 1 match, found ${n}`);
            return s.replace(oldText, newText);
          };
          const replaceRegexOnce = (s, re, replacement, label) => {
            const matches = [...s.matchAll(new RegExp(re.source, re.flags.includes('g') ? re.flags : re.flags + 'g'))];
            if (matches.length !== 1) throw new Error(`${label}: expected 1 match, found ${matches.length}`);
            return s.replace(re, replacement);
