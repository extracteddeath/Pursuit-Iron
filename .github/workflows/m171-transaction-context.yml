name: M171 Transactional Generation Context

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m171-transaction-context.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply M171 patch
        run: node scripts/m171-patch.mjs
      - name: Verify release
        run: node scripts/verify-release.mjs
      - name: Publish M171
        run: |
          rm -f .github/workflows/m171-transaction-context.yml scripts/m171-patch.mjs
          git config user.name "Pursuit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "M171: shared transactional generation context"
          git push
