name: M172 Actual Strength Baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m172-actual-strength-baseline.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair staging-script escaping
        shell: bash
        run: |
          python3 <<'PY'
          p='scripts/m172-patch.mjs'
          s=open(p,encoding='utf-8').read()
          s=s.replace("        decisions.push(`Residual muscle work was allocated from ${actualStrengthBaseline.realizedCount ?? 0} realized strength anchor${(actualStrengthBaseline.realizedCount ?? 0) === 1 ? '' : 's'} using their actual exercise stimulus and session time.`);", "        decisions.push('Residual muscle work was allocated from ' + (actualStrengthBaseline.realizedCount ?? 0) + ' realized strength anchor' + ((actualStrengthBaseline.realizedCount ?? 0) === 1 ? '' : 's') + ' using their actual exercise stimulus and session time.');")
          s=s.replace("                    throw new Error(`Pinned strength anchor ${pinned.exerciseId} is no longer eligible for ${a.id} on ${s.plan.day}.`);", "                    throw new Error('Pinned strength anchor ' + pinned.exerciseId + ' is no longer eligible for ' + a.id + ' on ' + s.plan.day + '.');")
          open(p,'w',encoding='utf-8').write(s)
          PY
          node --check scripts/m172-patch.mjs
      - name: Apply M172 patch
        run: node scripts/m172-patch.mjs
      - name: Verify release
        run: node scripts/verify-release.mjs
      - name: Publish M172
        run: |
          rm -f .github/workflows/m172-actual-strength-baseline.yml scripts/m172-patch.mjs
          git config user.name "Pursuit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "M172: allocate from realized strength anchors"
          git push
