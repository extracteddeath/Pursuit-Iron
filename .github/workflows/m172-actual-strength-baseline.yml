name: M172 Actual Strength Baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m172-actual-strength-baseline.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply M172 patch
        run: node scripts/m172-patch.mjs
      - name: Verify release
        run: node scripts/verify-release.mjs
      - name: Publish M172
        run: |
          rm -f .github/workflows/m172-actual-strength-baseline.yml scripts/m172-patch.mjs
          git config user.name "Pursuit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "M172: allocate from realized strength anchors"
          git push
