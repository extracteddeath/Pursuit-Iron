name: M177 History Sync Inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m177-history-sync-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture targeted history/storage source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lines=Path('modules/App.js').read_text().splitlines()
          needles=[
            'normalizeEditedHistoryEntry',
            'perfAfterHistoryReplace',
            'commitHistoryCorrection',
            'const [history, setHistory]',
            'setHistory(',
            'mergeStores',
            'parseStoredData',
            'STORE_KEY',
            "wpb:v1",
            'localStorage.setItem',
            'localStorage.getItem',
            'JSON.stringify({',
            'history,',
            'history:',
            'loaded',
          ]
          out=[]
          for needle in needles:
            hits=[i for i,line in enumerate(lines) if needle in line]
            out.append(f'===== {needle} ({len(hits)} hits) =====')
            for n,i in enumerate(hits[:24],1):
              lo=max(0,i-22); hi=min(len(lines),i+32)
              out.append(f'--- hit {n} lines {lo+1}-{hi} ---')
              out.extend(f'{j+1:06d}: {lines[j]}' for j in range(lo,hi))
            out.append('')
          Path('M177_INSPECT.txt').write_text('\n'.join(out)+'\n')
          PY
      - name: Publish inspection capture
        shell: bash
        run: |
          git config user.name "Pursuit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add M177_INSPECT.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: deepen M177 history persistence inspection"
          git push origin HEAD:main
