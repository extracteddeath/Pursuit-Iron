name: M177 Editable History Merge Promotion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m177-history-sync-inspect.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply M177 candidate
        shell: bash
        run: |
          set +e
          python scripts/m177-promote-v2.py > /tmp/m177-promote.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/m177-promote.log M177_RUN.txt
            git config user.name "Pursuit Release Bot"
            git config user.email "actions@users.noreply.github.com"
            git add M177_RUN.txt
            git commit -m "chore: capture M177 promotion failure"
            git push origin HEAD:main
            exit "$code"
          fi
          cat /tmp/m177-promote.log
      - name: Verify M177 focused and full gates
        run: |
          node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m177-history-merge-integrity-test.mjs
          node scripts/verify-release.mjs
      - name: Publish verified M177
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/m177-history-sync-inspect.yml M177_INSPECT.txt M177_RUN.txt M177_SCHEMA.txt scripts/m177-promote.py scripts/m177-promote-v2.py
          git config user.name "Pursuit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "M177: editable history merge integrity"
          git push origin HEAD:main
