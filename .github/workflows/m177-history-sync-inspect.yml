name: M177 Store Schema Inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m177-history-sync-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture current store schema and migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('modules/App.js').read_text().splitlines()
          hits=[]
          for i,line in enumerate(lines):
            if 'STORE_VERSION' in line or 'const MIGRATIONS' in line or 'MIGRATIONS =' in line:
              hits.append(i)
          out=[]
          for i in hits:
            lo=max(0,i-25); hi=min(len(lines),i+180)
            out.append(f'===== around line {i+1} =====')
            out.extend(f'{j+1:06d}: {lines[j]}' for j in range(lo,hi))
            out.append('')
          Path('M177_SCHEMA.txt').write_text('\n'.join(out)+'\n')
          PY
      - name: Publish schema capture
        shell: bash
        run: |
          git config user.name "Pursuit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add M177_SCHEMA.txt
          git commit -m "chore: capture current M177 store schema"
          git push origin HEAD:main
