name: M177 History Sync Inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m177-history-sync-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture targeted history/sync source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('modules/App.js')
          lines=path.read_text().splitlines()
          needles=[
            'normalizeEditedHistoryEntry',
            'perfAfterHistoryReplace',
            'setWorkoutHistory',
            'workoutHistory',
            'syncData',
            'lastWorkoutBackup',
            "wpb:v1",
            'onSnapshot',
            'setDoc',
            'getDoc',
          ]
          out=[]
          for needle in needles:
            hits=[i for i,line in enumerate(lines) if needle in line]
            out.append(f'===== {needle} ({len(hits)} hits) =====')
            for n,i in enumerate(hits[:16],1):
              lo=max(0,i-14); hi=min(len(lines),i+22)
              out.append(f'--- hit {n} lines {lo+1}-{hi} ---')
              out.extend(f'{j+1:06d}: {lines[j]}' for j in range(lo,hi))
            out.append('')
          Path('M177_INSPECT.txt').write_text('\n'.join(out)+'\n')
          PY
      - name: Publish inspection capture
        shell: bash
        run: |
          git config user.name "Pursuit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add M177_INSPECT.txt
          git commit -m "chore: capture M177 history sync boundary"
          git push origin HEAD:main
