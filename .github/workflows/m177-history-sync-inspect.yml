name: M177 History Sync Inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m177-history-sync-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture exact M177 ranges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('modules/App.js').read_text().splitlines()
          out=[]
          for label,lo,hi in [
            ('MIGRATION_AND_MERGE',17945,18130),
            ('APP_STATE_AND_STAMPERS',34135,34235),
            ('LOAD_AND_AUTOSAVE',34970,35180),
            ('HISTORY_COMPLETE_AND_EDIT',36555,36670),
          ]:
            out.append('===== '+label+' =====')
            out.extend(f'{j+1:06d}: {lines[j]}' for j in range(lo-1,min(len(lines),hi)))
            out.append('')
          Path('M177_INSPECT.txt').write_text('\n'.join(out)+'\n')
          PY
      - name: Publish inspection capture
        shell: bash
        run: |
          git config user.name "Pursuit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add M177_INSPECT.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: capture exact M177 persistence ranges"
          git push origin HEAD:main
