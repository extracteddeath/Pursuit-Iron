name: M178 PWA update hardening

on:
  push:
    branches: [m178-pwa-update-hardening]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect update handshake and live-session persistence
        shell: bash
        run: |
          set -euo pipefail
          grep -n -C 12 -E 'wpb:update-ready|pursuitUpdateRequested|SKIP_WAITING|updateReady' modules/App.js || true
          grep -n -C 8 -E 'persistLive|pagehide|visibilitychange|freeze|LIVE_KEY' modules/App.js | head -n 360 || true
          grep -n -C 8 -E 'serviceWorker|updatefound|controllerchange|pursuitUpdateRequested|reg\.update' index.html || true
      - name: Install browser test harness
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Run real-browser service-worker lifecycle test
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node verification/m178-pwa-update-browser-test.mjs
      - name: Run current release integrity suite
        run: node scripts/verify-release.mjs
