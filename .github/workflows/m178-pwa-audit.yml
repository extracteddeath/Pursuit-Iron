name: M178 PWA lifecycle promotion

on:
  push:
    branches: [m178-pwa-update-hardening]
    paths:
      - '.github/workflows/m178-pwa-audit.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply M178 candidate
        run: python scripts/m178-promote.py
      - name: Install browser test harness
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Verify M178 browser and full release gates
        env:
          CHROME_BIN: /usr/bin/google-chrome
        shell: bash
        run: |
          set -euo pipefail
          node verification/m178-pwa-update-browser-test.mjs
          node scripts/verify-release.mjs
      - name: Publish verified M178 to certification branch
        shell: bash
        run: |
          set -euo pipefail
          # Puppeteer is test harness only. Never let npm's temporary dependency resolution alter the release.
          git checkout -- package.json package-lock.json
          rm -f .github/workflows/m178-pwa-audit.yml scripts/m178-promote.py
          git config user.name "Pursuit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached -- package.json package-lock.json --exit-code
          git commit -m "M178: real-browser PWA update lifecycle certification"
          git push origin HEAD:m178-pwa-update-hardening
