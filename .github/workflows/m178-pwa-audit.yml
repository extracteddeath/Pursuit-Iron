name: M178 PWA lifecycle promotion

on:
  push:
    branches: [m178-pwa-update-hardening]
    paths:
      - '.github/workflows/m178-pwa-audit.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply M178 candidate
        run: python scripts/m178-promote.py
      - name: Install browser test harness
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Verify M178 browser and full release gates
        env:
          CHROME_BIN: /usr/bin/google-chrome
        shell: bash
        run: |
          set -euo pipefail
          node verification/m178-pwa-update-browser-test.mjs
          node scripts/verify-release.mjs
      - name: Publish verified M178 release files to certification branch
        shell: bash
        run: |
          set -euo pipefail
          # Puppeteer is test harness only. This repository intentionally has no tracked npm package files,
          # so remove npm's temporary install artifacts instead of assuming package.json/package-lock.json exist.
          rm -rf node_modules
          if git ls-files --error-unmatch package.json >/dev/null 2>&1; then
            git checkout -- package.json
          else
            rm -f package.json
          fi
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git checkout -- package-lock.json
          else
            rm -f package-lock.json
          fi

          # The Actions GITHUB_TOKEN does not have workflows permission. The candidate was tested with the
          # permanent workflow present, but publish workflow files separately after this verified release commit.
          rm -f .github/workflows/pwa-lifecycle.yml
          rm -f scripts/m178-promote.py

          git config user.name "Pursuit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "M178 promotion produced no tracked release changes" >&2
            exit 1
          fi
          git diff --cached -- .github/workflows package.json package-lock.json --exit-code
          git commit -m "M178: real-browser PWA update lifecycle certification"
          git push origin HEAD:m178-pwa-update-hardening
