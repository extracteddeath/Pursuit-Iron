name: M180 coach quality oracle audit

on:
  push:
    branches: [m180-coach-quality-oracle]
    paths:
      - '.github/workflows/m180-oracle-audit.yml'
      - 'modules/next-engine/coach-quality-oracle.js'
      - 'verification/m180-coach-quality-oracle-test.mjs'
      - 'verification/m180-coach-quality-matrix.mjs'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse oracle source
        run: node --check modules/next-engine/coach-quality-oracle.js
      - name: Run M180 oracle regression tests
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m180-coach-quality-oracle-test.mjs
      - name: Audit representative generated programs
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m180-coach-quality-matrix.mjs
