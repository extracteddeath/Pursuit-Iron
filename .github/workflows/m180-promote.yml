name: M180 candidate promotion

on:
  push:
    branches: [m180-coach-quality-oracle]
    paths:
      - '.github/workflows/m180-promote.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply M180 candidate packaging
        run: python scripts/m180-promote.py
      - name: Verify complete M180 candidate
        run: node scripts/verify-release.mjs
      - name: Publish verified candidate back to branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/m180-promote.py
          git config user.name "Pursuit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached -- .github/workflows --exit-code
          git commit -m "M180: coach quality oracle release candidate"
          git push origin HEAD:m180-coach-quality-oracle
