name: M181 dose-band baseline

on:
  push:
    branches: [m181-volume-dose-intelligence]
    paths:
      - '.github/workflows/m181-dose-baseline.yml'
      - 'verification/m181-dose-band-baseline.mjs'
      - 'verification/m181-dose-reconciliation-test.mjs'
      - 'modules/next-engine/dose-reconciliation.js'
      - 'modules/next-engine/generate.js'
      - 'modules/next-engine/allocator.js'
      - 'modules/next-engine/prescription.js'
      - 'modules/next-engine/realizer.js'

permissions:
  contents: read

jobs:
  dose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused dose reconciliation regression
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m181-dose-reconciliation-test.mjs
      - name: Run dose-band baseline
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m181-dose-band-baseline.mjs
      - name: Run affected engine regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            verification/m167-legacy-dose-cycle-test.mjs \
            verification/m170-engine-correctness-test.mjs \
            verification/m173-integration-torture-test.mjs \
            verification/m174-causal-cycle-state-test.mjs \
            verification/m175-longitudinal-adaptation-memory-test.mjs \
            verification/prescription-integrity-test.mjs \
            verification/progression-safety-test.mjs \
            verification/custom-progression-safety-test.mjs \
            verification/full-engine-import-test.mjs
          do
            echo "==> $test"
            node --no-warnings --experimental-loader ./verification/import-loader.mjs "$test"
          done
