name: M182 exercise-selection intelligence

on:
  push:
    branches: [m182-exercise-selection-intelligence]
    paths:
      - '.github/workflows/m182-exercise-selection.yml'
      - 'modules/next-engine/exercise-selection-intelligence.js'
      - 'modules/next-engine/exercise-economy.js'
      - 'modules/next-engine/realizer.js'
      - 'modules/next-engine/generate.js'
      - 'modules/next-engine/setup-economy.js'
      - 'verification/m182-exercise-selection-intelligence-test.mjs'
      - 'verification/m182-selection-matrix.mjs'

permissions:
  contents: read

jobs:
  selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused M182 knowledge-graph regression
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m182-exercise-selection-intelligence-test.mjs
      - name: Run M182 generated selection matrix
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m182-selection-matrix.mjs
      - name: Run M180 coach quality gates
        shell: bash
        run: |
          set -euo pipefail
          node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m180-coach-quality-oracle-test.mjs
          node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m180-coach-quality-matrix.mjs
      - name: Preserve M181 dose reconciliation contract
        shell: bash
        run: |
          set -euo pipefail
          node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m181-dose-reconciliation-test.mjs
          node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m181-dose-band-baseline.mjs
      - name: Run affected engine regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            verification/m167-legacy-dose-cycle-test.mjs \
            verification/m170-engine-correctness-test.mjs \
            verification/m173-integration-torture-test.mjs \
            verification/m174-causal-cycle-state-test.mjs \
            verification/m175-longitudinal-adaptation-memory-test.mjs \
            verification/prescription-integrity-test.mjs \
            verification/programs-test.mjs \
            verification/progression-safety-test.mjs \
            verification/custom-progression-safety-test.mjs \
            verification/full-engine-import-test.mjs
          do
            echo "==> $test"
            node --no-warnings --experimental-loader ./verification/import-loader.mjs "$test"
          done
