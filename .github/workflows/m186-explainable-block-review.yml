name: M186 explainable block review

on:
  push:
    branches: [m186-explainable-block-review]
    paths:
      - '.github/workflows/m186-explainable-block-review.yml'
      - 'modules/next-engine/explainability.js'
      - 'modules/next-engine/phase-transition.js'
      - 'verification/m186-explainable-block-review-test.mjs'

permissions:
  contents: read

jobs:
  explainability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run M186 Block Review contract
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m186-explainable-block-review-test.mjs
      - name: Preserve phase, longitudinal, dose, coach-quality, and import contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            verification/m185-phase-specialization-test.mjs \
            verification/m184-longitudinal-evidence-test.mjs \
            verification/m181-dose-reconciliation-test.mjs \
            verification/m180-coach-quality-oracle-test.mjs \
            verification/m180-coach-quality-matrix.mjs \
            verification/m174-causal-cycle-state-test.mjs \
            verification/m175-longitudinal-adaptation-memory-test.mjs \
            verification/prescription-integrity-test.mjs \
            verification/programs-test.mjs \
            verification/full-engine-import-test.mjs
          do
            echo "==> $test"
            node --no-warnings --experimental-loader ./verification/import-loader.mjs "$test"
          done
