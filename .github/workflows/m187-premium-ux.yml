name: M187 premium UX

on:
  push:
    branches: [m187-premium-ux]
    paths:
      - '.github/workflows/m187-premium-ux.yml'
      - 'app.css'
      - 'BUILD_PROFILE.json'
      - 'RELEASE_MANIFEST.json'
      - 'sw.js'
      - 'scripts/verify-release.mjs'
      - 'verification/m187-premium-ux-test.mjs'
      - 'verification/m187-release-integrity-test.mjs'
      - 'modules/next-engine/**'
      - 'modules/shadow-engine/**'
      - 'vendor/**'
      - 'verification/m186-explainable-block-review-test.mjs'

permissions:
  contents: write

jobs:
  premium-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stamp M187 release manifest and modernize release verifier
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const root=process.cwd();
          const sha=file=>crypto.createHash('sha256').update(fs.readFileSync(path.join(root,file))).digest('hex');
          const walkJs=dir=>{
            const out=[];
            for(const entry of fs.readdirSync(path.join(root,dir),{withFileTypes:true})){
              const rel=path.posix.join(dir,entry.name);
              if(entry.isDirectory()) out.push(...walkJs(rel));
              else if(entry.name.endsWith('.js')) out.push(rel);
            }
            return out;
          };
          const nextFiles=walkJs('modules/next-engine').sort();
          const shadowFiles=walkJs('modules/shadow-engine').sort();
          const runtimeFiles=[...nextFiles,...shadowFiles,...walkJs('vendor')].sort();
          const profile=JSON.parse(fs.readFileSync('BUILD_PROFILE.json','utf8'));
          profile.milestone='M187';
          profile.nextRuntimeModules=nextFiles.length;
          profile.shadowRuntimeModules=shadowFiles.length;
          profile.cache='pursuit-iron-production-m187-premium-ux';
          profile.uiMilestone='M187 Premium UX Audit + Cross-Screen Refactor';
          fs.writeFileSync('BUILD_PROFILE.json',JSON.stringify(profile,null,2)+'\n');

          const manifest=JSON.parse(fs.readFileSync('RELEASE_MANIFEST.json','utf8'));
          manifest.milestone='M187';
          manifest.cache=profile.cache;
          manifest.uiMilestone=profile.uiMilestone;
          manifest.candidateStatus='ci_verified_device_test_pending';
          manifest.runtimeFiles=Object.fromEntries(runtimeFiles.map(file=>[file,sha(file)]));
          const aggregateBlob=runtimeFiles.map(file=>`${file}:${manifest.runtimeFiles[file]}\n`).join('');
          manifest.runtimeAggregate=crypto.createHash('sha256').update(aggregateBlob).digest('hex');
          const uiFiles=['modules/App.js','index.html','sw.js','BUILD_PROFILE.json','CHANGELOG.md','app.css'];
          manifest.uiFiles=Object.fromEntries(uiFiles.map(file=>[file,sha(file)]));
          manifest.localCandidate={
            name:'M187 Premium UX + Explainable Block Review',
            base:'M180 / app 3.229.0 build 785 / Engine 0.63.3',
            validation:'M181-M187 engine, explainability, premium UX, exhaustive runtime hashing, offline-shell completeness, and production release verification.'
          };
          fs.writeFileSync('RELEASE_MANIFEST.json',JSON.stringify(manifest,null,2)+'\n');

          const verifierPath='scripts/verify-release.mjs';
          let verifier=fs.readFileSync(verifierPath,'utf8');
          const stale="if (profile.uiMilestone !== 'M169 Swap Sheet Scrolling') fail('unexpected UI milestone');";
          const current="if (profile.uiMilestone !== manifest.uiMilestone) fail('BUILD_PROFILE UI milestone does not match manifest');\nif (profile.cache !== manifest.cache) fail('BUILD_PROFILE cache does not match manifest');";
          if(verifier.includes(stale)) verifier=verifier.replace(stale,current);
          else if(!verifier.includes('BUILD_PROFILE UI milestone does not match manifest')) throw new Error('release verifier UI milestone guard changed unexpectedly');
          fs.writeFileSync(verifierPath,verifier);
          NODE
      - name: Run M187 premium UX contract
        run: node ./verification/m187-premium-ux-test.mjs
      - name: Run exhaustive M187 release and offline integrity contract
        run: node ./verification/m187-release-integrity-test.mjs
      - name: Run production release verifier
        run: node ./scripts/verify-release.mjs
      - name: Preserve M186 explainable Block Review
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m186-explainable-block-review-test.mjs
      - name: Preserve engine and program contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            verification/m185-phase-specialization-test.mjs \
            verification/m184-longitudinal-evidence-test.mjs \
            verification/m181-dose-reconciliation-test.mjs \
            verification/m180-coach-quality-oracle-test.mjs \
            verification/m180-coach-quality-matrix.mjs \
            verification/m174-causal-cycle-state-test.mjs \
            verification/m175-longitudinal-adaptation-memory-test.mjs \
            verification/prescription-integrity-test.mjs \
            verification/programs-test.mjs \
            verification/full-engine-import-test.mjs
          do
            echo "==> $test"
            node --no-warnings --experimental-loader ./verification/import-loader.mjs "$test"
          done
      - name: Commit verified M187 release stamp
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Release metadata already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BUILD_PROFILE.json RELEASE_MANIFEST.json scripts/verify-release.mjs
          git commit -m 'M187: finalize verified release metadata'
          git push origin HEAD:m187-premium-ux
