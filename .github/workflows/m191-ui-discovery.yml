name: M191 UI Discovery

on:
  push:
    branches:
      - m191-progression-explainability-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate progression card render seam
        shell: bash
        run: |
          set -euo pipefail
          echo '=== progression components ==='
          grep -n -E -C 18 'showProg|setShowProg|SetupCard|showSetup|ProgressionMatrix|Progression.*Card|THE PROGRESSION MATRIX' modules/App.js | head -n 680 || true
          echo '=== program controls render ==='
          grep -n -E -C 24 'How this was built|showVol|showWave|planInfo|showBlock' modules/App.js | head -n 760 || true
