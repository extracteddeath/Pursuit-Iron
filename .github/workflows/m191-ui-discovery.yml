name: M191 UI Discovery

on:
  push:
    branches:
      - m191-progression-explainability-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect progression card implementation
        shell: bash
        run: |
          set -euo pipefail
          sed -n '21517,21760p' modules/App.js
          echo '=== showProg uses ==='
          grep -n -E -C 5 'showProg|setShowProg' modules/App.js || true
