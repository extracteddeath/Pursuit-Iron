name: M192 Progression Transition Deltas

on:
  push:
    branches:
      - m192-progression-transition-deltas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  progression-deltas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply M192 progression deltas
        run: node scripts/apply-m192-progression-deltas.mjs

      - name: Parse App bundle
        run: node --check modules/App.js

      - name: M192 progression transition deltas
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/m192-progression-transition-deltas-test.mjs

      - name: M191 progression UI regression
        run: node verification/m191-progression-explainability-ui-test.mjs

      - name: M190 progression lifecycle regression
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/m190-progression-lifecycle-test.mjs

      - name: Premium UI carry-forward
        run: node verification/m188-premium-ux-carryforward-test.mjs

      - name: Production torture regression
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/m188-production-torture-test.mjs

      - name: Persist certified M192 progression deltas
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add modules/next-engine/phase-transition.js modules/next-engine/app-shell-adapter.js modules/App.js
          if git diff --cached --quiet; then
            echo "M192 runtime already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "M192: surface progression method changes across blocks"
          git push origin HEAD:m192-progression-transition-deltas
