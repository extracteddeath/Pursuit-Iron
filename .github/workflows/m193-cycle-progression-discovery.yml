name: M193 Cycle Progression Discovery

on:
  push:
    branches:
      - m193-cycle-progression-context
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect cycle generation paths
        shell: bash
        run: |
          set -euo pipefail
          echo '=== cycle creation/generation calls ==='
          grep -n -E -C 12 'generateNextProgramForShell|generateNextBlockFromShellHistory|cycleTemplate|cycleId|blockIdx|blocks\.map|createCycle|buildCycle|cycle.*program' modules/App.js | head -n 1200 || true
          echo '=== cycle helpers in modules ==='
          grep -R -n -E -C 8 'generateNextProgramForShell|generateNextBlockFromShellHistory|cycleTemplate|cycleId|blockIdx|blocks\.map' modules --exclude=App.js | head -n 1200 || true
