name: M197 finalize release

on:
  push:
    branches: [main]
    paths:
      - 'modules/next-engine/capacity-policy.js'
      - 'modules/next-engine/app-shell-adapter-capacity.js'
      - 'verification/m197-capacity-monotonic-test.mjs'
      - 'scripts/finalize-m197-release.mjs'
      - '.github/workflows/m197-finalize-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize M197 release identity
        run: node scripts/finalize-m197-release.mjs
      - name: Full Body capacity monotonic regression
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m197-capacity-monotonic-test.mjs
      - name: Verify finalized production runtime
        run: node scripts/verify-release.mjs
      - name: Commit finalized M197 release
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- modules/App.js index.html sw.js BUILD_PROFILE.json RELEASE_MANIFEST.json CHANGELOG.md; then
            echo "M197 release identity already finalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/App.js index.html sw.js BUILD_PROFILE.json RELEASE_MANIFEST.json CHANGELOG.md
          git commit -m "M197: finalize production release identity"
          git push origin HEAD:main
