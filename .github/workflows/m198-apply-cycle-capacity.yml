name: M198 apply cycle capacity fix

on:
  push:
    branches: [audit/m198-creation-pipeline]
    paths:
      - '.github/workflows/m198-apply-cycle-capacity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m198-creation-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply shared capacity contract to cycle creation
        run: node verification/m198-patch-cycle-capacity.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'Cycle capacity patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/next-engine/cycle-runtime-adapter.js
          git commit -m 'M198: unify cycle creation with capacity-aware generation'
          git push origin HEAD:audit/m198-creation-pipeline
