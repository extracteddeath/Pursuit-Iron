name: M198 apply full-body structural swap

on:
  push:
    branches: [audit/m198-creation-pipeline]
    paths:
      - '.github/workflows/m198-apply-full-body-structural-swap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m198-creation-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply structural swap fallback
        run: node verification/m198-patch-full-body-structural-swap.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'Structural swap patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/next-engine/realizer.js
          git commit -m 'M198: preserve full-body structure under capacity pressure'
          git push origin HEAD:audit/m198-creation-pipeline
