name: M198 cleanup duplicate structural swap

on:
  push:
    branches: [audit/m198-creation-pipeline]
    paths:
      - 'verification/m198-cleanup-duplicate-swap.mjs'
      - '.github/workflows/m198-cleanup-duplicate-swap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m198-creation-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove duplicate structural swap block
        run: node verification/m198-cleanup-duplicate-swap.mjs
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No duplicate structural swap cleanup needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/next-engine/realizer.js
          git commit -m 'M198: remove duplicate structural swap fallback'
          git pull --rebase origin audit/m198-creation-pipeline
          git push origin HEAD:audit/m198-creation-pipeline
