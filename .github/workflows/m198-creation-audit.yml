name: M198 creation audit

on:
  push:
    branches: [audit/m198-creation-pipeline]
    paths:
      - 'modules/next-engine/**'
      - 'verification/m198-creation-audit.mjs'
      - '.github/workflows/m198-creation-audit.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Create Program / Create Cycle contract
        shell: bash
        run: |
          set +e
          node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m198-creation-audit.mjs 2>&1 | tee m198-creation-audit.log
          status=${PIPESTATUS[0]}
          echo "$status" > m198-creation-audit.exit
          exit "$status"
      - name: Upload creation audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m198-creation-audit-diagnostics
          path: |
            m198-creation-audit.log
            m198-creation-audit.exit
          if-no-files-found: error
          retention-days: 7
