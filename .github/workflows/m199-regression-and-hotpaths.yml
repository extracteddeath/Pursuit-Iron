name: M199 responsiveness and loading integrity

on:
  push:
    branches: [main, audit/m199-performance-loading]
    paths:
      - 'modules/**'
      - 'index.html'
      - 'verification/m199-ui-responsiveness-test.mjs'
      - 'verification/m199-runtime-hotpath-scan.mjs'
      - 'verification/m199-browser-loading-test.mjs'
      - 'verification/m198-creation-audit.mjs'
      - '.github/workflows/m199-regression-and-hotpaths.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan runtime hot paths
        run: node verification/m199-runtime-hotpath-scan.mjs
      - name: Responsiveness/loading contract
        run: node verification/m199-ui-responsiveness-test.mjs
      - name: Creation regression
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m198-creation-audit.mjs
      - name: Upload hot-path report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m199-runtime-hotpaths
          path: m199-runtime-hotpath-scan.json
          if-no-files-found: error
          retention-days: 3

  browser-loading:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test harness
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Throttled cold-start loading probe
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node verification/m199-browser-loading-test.mjs
