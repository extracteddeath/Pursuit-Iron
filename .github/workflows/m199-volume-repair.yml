name: Engine volume integrity

on:
  push:
    branches: [main, fix/m199-volume-repair, fix/m200-regional-dose]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-volume-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regional dose preservation during generation
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m200-regional-dose-test.mjs
      - name: Volume repair and live accounting regression
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m199-volume-repair-test.mjs
      - name: Wizard and real Full Body regression
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m199-wizard-feasibility-test.mjs
      - name: Standalone and cycle creation matrix
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m198-creation-audit.mjs
      - name: Full release integrity
        run: node scripts/verify-release.mjs
      - name: Install browser harness
        run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Phone-size Auto-fix persistence and reload
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs ./verification/m199-volume-repair-browser-test.mjs
      - name: Upload phone verification screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m199-volume-repair-phone
          path: verification/m199-volume-repair-phone.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload regional dose verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m200-regional-dose-results
          path: verification/m200-regional-dose-results.json
          if-no-files-found: ignore
          retention-days: 7
