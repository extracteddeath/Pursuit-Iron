name: M202 locked-cycle dose integrity

on:
  push:
    branches: [fix/m202-locked-cycle-dose]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild clean M202 runtime from production source
        run: node verification/finalize-m202-clean.mjs
      - name: Locked-cycle displayed-volume regression
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/m202-locked-cycle-dose-test.mjs
      - name: Regional-dose generation regression
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/m200-regional-dose-test.mjs
      - name: Volume repair regression
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/m199-volume-repair-test.mjs
      - name: Workout prescription regression
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/m201-workout-prescription-test.mjs
      - name: Commit cleaned verified candidate
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Clean candidate already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/next-engine/volume-repair.js modules/next-engine/cycle-runtime-adapter.js RELEASE_MANIFEST.json M202_LOCKED_CYCLE_DOSE_REPORT.md
          git commit -m "M202: finalize clean locked-cycle dose repair"
          git push origin HEAD:fix/m202-locked-cycle-dose
