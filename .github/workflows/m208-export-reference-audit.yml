name: M208 export reference audit

on:
  push:
    branches:
      - audit/m208-dead-code

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Classify production-unused exports
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const candidates = [
            ['modules/next-engine/exercise-db.js','getExerciseDefinition'],
            ['modules/next-engine/exercise-economy.js','avoidableCompoundOverlap'],
            ['modules/next-engine/exercise-economy.js','redundantCompoundPairs'],
            ['modules/next-engine/exercise-selection-intelligence.js','exerciseSelectionPenalty'],
            ['modules/next-engine/extended-exercise-catalog.js','LEGACY_V661_EQUIPMENT_IDS'],
            ['modules/next-engine/focus-intent.js','enforceExplicitFocusIntents'],
            ['modules/next-engine/history.js','buildStrengthTrend'],
            ['modules/next-engine/ledgers.js','ZERO_FATIGUE'],
            ['modules/next-engine/loading.js','createLoadingInventory'],
            ['modules/next-engine/loading.js','summarizeLoadingInventory'],
            ['modules/next-engine/progression-style.js','resolveProgressionStyle'],
            ['modules/next-engine/response.js','diagnoseSessionResponses'],
            ['modules/next-engine/setup-economy.js','sessionSetupTransitionScore'],
            ['modules/next-engine/setup-economy.js','setupZoneRevisits'],
            ['modules/next-engine/shell-equipment.js','setShellEquipmentExpander'],
            ['modules/next-engine/simulation.js','defaultPowerbuildingBlocks'],
            ['modules/next-engine/simulation.js','runPowerbuildingSimulation']
          ];
          const all=[];
          function walk(dir){
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              if(['.git','node_modules'].includes(ent.name)) continue;
              const full=path.join(dir,ent.name);
              if(ent.isDirectory()) walk(full);
              else if(/\.(?:js|mjs|jsx|ts|tsx|md)$/.test(ent.name)) all.push(full);
            }
          }
          walk(process.cwd());
          for(const [defFile,name] of candidates){
            const re=new RegExp(`\\b${name.replace(/[$]/g,'\\$&')}\\b`,'g');
            const refs=[];
            for(const full of all){
              const rel=path.relative(process.cwd(),full).replaceAll('\\','/');
              if(rel===defFile) continue;
              const text=fs.readFileSync(full,'utf8');
              const count=(text.match(re)||[]).length;
              if(count) refs.push(`${rel}(${count})`);
            }
            console.log(`${defFile} :: ${name} => ${refs.length ? refs.join(', ') : 'NO_EXTERNAL_REFERENCES'}`);
          }
          NODE
