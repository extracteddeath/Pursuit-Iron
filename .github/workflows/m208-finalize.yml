name: M208 dead export cleanup finalizer

on:
  push:
    branches:
      - audit/m208-dead-code

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[m208-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m208-dead-code
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove dead exports and finalize M208
        shell: bash
        run: |
          npm install --prefix /tmp/m208 acorn@8 --no-save --ignore-scripts --silent
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parse } from '/tmp/m208/node_modules/acorn/dist/acorn.mjs';

          const targets = new Map([
            ['modules/next-engine/exercise-db.js', ['getExerciseDefinition']],
            ['modules/next-engine/exercise-economy.js', ['avoidableCompoundOverlap','redundantCompoundPairs','compoundEconomyCluster']],
            ['modules/next-engine/exercise-selection-intelligence.js', ['exerciseSelectionPenalty']],
            ['modules/next-engine/extended-exercise-catalog.js', ['LEGACY_V661_EQUIPMENT_IDS']],
            ['modules/next-engine/focus-intent.js', ['enforceExplicitFocusIntents']],
            ['modules/next-engine/history.js', ['buildStrengthTrend']],
            ['modules/next-engine/ledgers.js', ['ZERO_FATIGUE']],
            ['modules/next-engine/loading.js', ['createLoadingInventory','summarizeLoadingInventory']],
            ['modules/next-engine/progression-style.js', ['resolveProgressionStyle']],
            ['modules/next-engine/response.js', ['diagnoseSessionResponses']],
            ['modules/next-engine/setup-economy.js', ['setupZoneRevisits']],
            ['modules/next-engine/simulation.js', ['defaultPowerbuildingBlocks']]
          ]);

          function namesForExport(node) {
            const d = node.declaration;
            if (!d) return [];
            if (d.type === 'FunctionDeclaration' || d.type === 'ClassDeclaration') return d.id ? [d.id.name] : [];
            if (d.type === 'VariableDeclaration') return d.declarations.flatMap(item => item.id?.type === 'Identifier' ? [item.id.name] : []);
            return [];
          }

          for (const [file, wanted] of targets) {
            let text = fs.readFileSync(file, 'utf8');
            const comments = [];
            const ast = parse(text, { ecmaVersion: 'latest', sourceType: 'module', onComment: comments });
            const removals = [];
            for (const node of ast.body) {
              if (node.type !== 'ExportNamedDeclaration') continue;
              const names = namesForExport(node);
              if (!names.some(name => wanted.includes(name))) continue;
              const unrelated = names.filter(name => !wanted.includes(name));
              if (unrelated.length) throw new Error(`${file}: targeted declaration also exports ${unrelated.join(', ')}`);
              let start = node.start;
              const prior = comments.filter(comment => comment.end <= start).sort((a,b) => b.end - a.end)[0];
              if (prior) {
                const gap = text.slice(prior.end, start);
                if (/^[ \t]*\r?\n[ \t]*$/.test(gap)) start = prior.start;
              }
              removals.push({ start, end: node.end, names });
            }
            const removed = new Set(removals.flatMap(item => item.names));
            for (const name of wanted) if (!removed.has(name)) throw new Error(`${file}: export ${name} not found`);
            for (const removal of removals.sort((a,b) => b.start - a.start)) {
              let end = removal.end;
              while (end < text.length && (text[end] === '\r' || text[end] === '\n')) end++;
              text = text.slice(0, removal.start) + text.slice(end);
            }
            fs.writeFileSync(file, text);
          }
          NODE

          node <<'NODE'
          const fs = require('node:fs');
          const replaceOnce = (file, from, to) => {
            let text = fs.readFileSync(file, 'utf8');
            const first = text.indexOf(from);
            if (first < 0 || text.indexOf(from, first + from.length) >= 0) throw new Error(`${file}: expected exactly one match for ${from}`);
            fs.writeFileSync(file, text.slice(0, first) + to + text.slice(first + from.length));
          };

          replaceOnce('modules/next-engine/config.js', "ENGINE_VERSION = '0.64.7'", "ENGINE_VERSION = '0.64.8'");
          replaceOnce('modules/next-engine/config.js',
            "Object.freeze(['0.64.3', '0.64.4', '0.64.5', '0.64.6', ENGINE_VERSION])",
            "Object.freeze(['0.64.4', '0.64.5', '0.64.6', '0.64.7', ENGINE_VERSION])");

          const testFile = 'verification/m205-engine-cleanup-test.mjs';
          const anchor = "assert.doesNotMatch(index, /app-shell-adapter/, 'Node and browser must resolve the same canonical adapter');";
          const check = `const retiredDeadExports = {\n    'modules/next-engine/exercise-db.js': ['getExerciseDefinition'],\n    'modules/next-engine/exercise-economy.js': ['avoidableCompoundOverlap', 'redundantCompoundPairs', 'compoundEconomyCluster'],\n    'modules/next-engine/exercise-selection-intelligence.js': ['exerciseSelectionPenalty'],\n    'modules/next-engine/extended-exercise-catalog.js': ['LEGACY_V661_EQUIPMENT_IDS'],\n    'modules/next-engine/focus-intent.js': ['enforceExplicitFocusIntents'],\n    'modules/next-engine/history.js': ['buildStrengthTrend'],\n    'modules/next-engine/ledgers.js': ['ZERO_FATIGUE'],\n    'modules/next-engine/loading.js': ['createLoadingInventory', 'summarizeLoadingInventory'],\n    'modules/next-engine/progression-style.js': ['resolveProgressionStyle'],\n    'modules/next-engine/response.js': ['diagnoseSessionResponses'],\n    'modules/next-engine/setup-economy.js': ['setupZoneRevisits'],\n    'modules/next-engine/simulation.js': ['defaultPowerbuildingBlocks']\n};\nfor (const [file, symbols] of Object.entries(retiredDeadExports)) {\n    const source = fs.readFileSync(new URL('../' + file, import.meta.url), 'utf8');\n    for (const symbol of symbols) assert.equal(source.includes(symbol), false, \`unreferenced runtime export must stay removed: \${symbol}\`);\n}\n${anchor}`;
          replaceOnce(testFile, anchor, check);

          const manifestFile = 'RELEASE_MANIFEST.json';
          const manifest = JSON.parse(fs.readFileSync(manifestFile, 'utf8'));
          manifest.milestone = 'M208';
          manifest.build = 798;
          manifest.engineVersion = '0.64.8';
          manifest.cache = 'pursuit-iron-production-v4-0-0-m208-dead-export-cleanup-b798';
          manifest.uiMilestone = 'Pursuit Iron 4.0 Production Release · M208 Dead Export Cleanup';
          manifest.localCandidate = {
            name: 'Pursuit Iron 4.0 Production Release · M208',
            base: 'M207 / app 4.0.0 build 797 / Engine 0.64.7',
            validation: 'All authored runtime modules remain production-reachable. Fifteen zero-reference runtime exports are removed while live and verification-only contracts remain intact.'
          };
          manifest.runtimeHotfix = 'Prune zero-reference runtime exports and obsolete compatibility helpers without changing generation, progression, volume, recovery, or backup behavior.';
          fs.writeFileSync(manifestFile, JSON.stringify(manifest, null, 2) + '\n');

          const profileFile = 'BUILD_PROFILE.json';
          const profile = JSON.parse(fs.readFileSync(profileFile, 'utf8'));
          profile.milestone = 'M208';
          profile.source = 'M207 production baseline + repository-wide production reachability/export audit';
          profile.engine = '0.64.8 with M207 behavior unchanged and zero-reference runtime APIs removed';
          profile.cache = manifest.cache;
          profile.uiMilestone = manifest.uiMilestone;
          fs.writeFileSync(profileFile, JSON.stringify(profile, null, 2) + '\n');

          const changelogFile = 'CHANGELOG.md';
          const changelog = fs.readFileSync(changelogFile, 'utf8');
          const entry = `## M208 — Dead export cleanup (build 798)\n\n- Audited the complete production module graph: all 50 authored runtime modules remain reachable from the real app entry point.\n- Removed 15 runtime exports with zero references anywhere in production, verification, or documentation, including obsolete M81 compatibility helpers and unused diagnostic/loading APIs.\n- Preserved live shell-equipment wiring plus verification-only simulation/setup contracts that still protect engine behavior.\n- Added cleanup invariants preventing the removed APIs from silently returning. Pursuit Engine 0.64.8; offline cache rotated for build 798.\n\n`;
          if (!changelog.startsWith('## M208')) fs.writeFileSync(changelogFile, entry + changelog);
          NODE

          find modules -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
          node scripts/verify-engine-contracts.mjs

      - name: Commit finalized M208 candidate
        shell: bash
        run: |
          rm -f .github/workflows/m208-dead-code-audit.yml \
                .github/workflows/m208-export-reference-audit.yml \
                .github/workflows/m208-prune-dry-run.yml \
                .github/workflows/m208-finalize.yml
          git config user.name "Pursuit Iron Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "M208 dead export cleanup [m208-finalized]"
          git push origin HEAD:audit/m208-dead-code
