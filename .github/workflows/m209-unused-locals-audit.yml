name: M209 unused local audit

on:
  push:
    branches:
      - audit/m209-unused-locals

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit unused imports and locals
        shell: bash
        run: |
          npm install --prefix /tmp/m209 eslint@9 --no-save --ignore-scripts --silent
          cat >/tmp/m209/eslint.config.mjs <<'EOF'
          export default [{
            files: ['**/*.js'],
            languageOptions: {
              ecmaVersion: 'latest',
              sourceType: 'module',
              globals: {
                window: 'readonly', document: 'readonly', navigator: 'readonly', localStorage: 'readonly',
                indexedDB: 'readonly', location: 'readonly', history: 'readonly', crypto: 'readonly',
                performance: 'readonly', requestAnimationFrame: 'readonly', cancelAnimationFrame: 'readonly',
                setTimeout: 'readonly', clearTimeout: 'readonly', setInterval: 'readonly', clearInterval: 'readonly',
                fetch: 'readonly', Blob: 'readonly', URL: 'readonly', FileReader: 'readonly', HTMLElement: 'readonly',
                MutationObserver: 'readonly', ResizeObserver: 'readonly', structuredClone: 'readonly', console: 'readonly',
                process: 'readonly', Buffer: 'readonly'
              }
            },
            rules: {
              'no-unused-vars': ['warn', {
                vars: 'all', args: 'after-used', ignoreRestSiblings: true,
                argsIgnorePattern: '^_', varsIgnorePattern: '^_', caughtErrors: 'none'
              }]
            }
          }];
          EOF
          cd /tmp/m209
          ./node_modules/.bin/eslint "$GITHUB_WORKSPACE/modules/**/*.js" --config ./eslint.config.mjs --format json > /tmp/m209-report.json || true
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const report=JSON.parse(fs.readFileSync('/tmp/m209-report.json','utf8'));
          const root=process.env.GITHUB_WORKSPACE;
          const findings=[];
          for(const file of report){
            for(const msg of file.messages||[]){
              if(msg.ruleId!=='no-unused-vars') continue;
              findings.push({file:path.relative(root,file.filePath).replaceAll('\\','/'),line:msg.line,column:msg.column,message:msg.message});
            }
          }
          const byFile=new Map();
          for(const f of findings){const arr=byFile.get(f.file)||[];arr.push(f);byFile.set(f.file,arr);}
          console.log(`UNUSED_FINDINGS ${findings.length} across ${byFile.size} files`);
          for(const [file,items] of [...byFile].sort(([a],[b])=>a.localeCompare(b))){
            console.log(`FILE ${file} (${items.length})`);
            for(const f of items) console.log(`  ${f.line}:${f.column} ${f.message}`);
          }
          NODE
