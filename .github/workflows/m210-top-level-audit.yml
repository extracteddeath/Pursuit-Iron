name: M210 top-level App dead-code audit

on:
  push:
    branches:
      - audit/m210-app-shell-cleanup

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify module-scope unused App bindings
        shell: bash
        run: |
          npm install --prefix /tmp/m210 eslint@9 espree@10 --no-save --ignore-scripts --silent
          cat >eslint.m210.config.mjs <<'EOF'
          export default [{
            files: ['modules/App.js'],
            languageOptions: {
              ecmaVersion: 'latest', sourceType: 'module',
              globals: { window:'readonly',document:'readonly',navigator:'readonly',localStorage:'readonly',indexedDB:'readonly',location:'readonly',history:'readonly',crypto:'readonly',performance:'readonly',requestAnimationFrame:'readonly',cancelAnimationFrame:'readonly',setTimeout:'readonly',clearTimeout:'readonly',setInterval:'readonly',clearInterval:'readonly',fetch:'readonly',Blob:'readonly',URL:'readonly',FileReader:'readonly',HTMLElement:'readonly',MutationObserver:'readonly',ResizeObserver:'readonly',structuredClone:'readonly',console:'readonly',process:'readonly',Buffer:'readonly' }
            },
            rules: { 'no-unused-vars': ['warn',{vars:'all',args:'after-used',ignoreRestSiblings:true,argsIgnorePattern:'^_',varsIgnorePattern:'^_',caughtErrors:'none'}] }
          }];
          EOF
          /tmp/m210/node_modules/.bin/eslint modules/App.js --config ./eslint.m210.config.mjs --format json > /tmp/m210.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parse } from '/tmp/m210/node_modules/espree/dist/espree.cjs';
          const file='modules/App.js';
          const src=fs.readFileSync(file,'utf8');
          const report=JSON.parse(fs.readFileSync('/tmp/m210.json','utf8'))[0]?.messages ?? [];
          const unused=report.filter(m=>m.ruleId==='no-unused-vars');
          const ast=parse(src,{ecmaVersion:'latest',sourceType:'module',loc:true,range:true});
          const spans=[];
          for(const node of ast.body){
            if(node.type==='ImportDeclaration') spans.push({kind:'import',start:node.loc.start.line,end:node.loc.end.line,text:src.slice(node.range[0],node.range[1])});
            else if(['VariableDeclaration','FunctionDeclaration','ClassDeclaration'].includes(node.type)) spans.push({kind:node.type,start:node.loc.start.line,end:node.loc.end.line,text:src.slice(node.range[0],node.range[1])});
          }
          const top=[];
          for(const m of unused){
            const span=spans.find(s=>m.line>=s.start&&m.line<=s.end);
            if(span) top.push({line:m.line,message:m.message,kind:span.kind,statement:span.text.replace(/\s+/g,' ').slice(0,240)});
          }
          console.log(`APP_UNUSED_TOTAL ${unused.length}`);
          console.log(`TOP_LEVEL_UNUSED ${top.length}`);
          for(const x of top) console.log(`${x.line} | ${x.kind} | ${x.message} | ${x.statement}`);
          NODE
          rm eslint.m210.config.mjs
