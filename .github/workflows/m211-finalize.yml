name: M211 pure App local cleanup finalizer

on:
  push:
    branches:
      - audit/m211-app-pure-locals

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[m211-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m211-app-pure-locals
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove proven-dead pure App locals and finalize M211
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = file => fs.readFileSync(file, 'utf8');
          const write = (file, text) => fs.writeFileSync(file, text);
          const replaceOnce = (file, from, to) => {
            const text = read(file);
            const first = text.indexOf(from);
            if (first < 0 || text.indexOf(from, first + from.length) >= 0)
              throw new Error(`${file}: expected exactly one match for ${from}`);
            write(file, text.slice(0, first) + to + text.slice(first + from.length));
          };
          const replaceRegexOnce = (file, re, to) => {
            const text = read(file);
            const matches = [...text.matchAll(new RegExp(re.source, re.flags.includes('g') ? re.flags : re.flags + 'g'))];
            if (matches.length !== 1) throw new Error(`${file}: expected exactly one regex match, got ${matches.length}: ${re}`);
            write(file, text.replace(re, to));
          };

          // The abandoned dimensional-token experiment is entirely unreachable; remove its prose and values together.
          replaceRegexOnce('modules/App.js', /\/\* ============================== DIMENSIONAL TOKENS[\s\S]*?const RADIUS = \{ sm: 8, md: 12, lg: 16, pill: 999 \};\n/, '');

          // Simple dead reads / helpers only. No hook, callback, prop-surface, or compatibility-path removal in M211.
          replaceOnce('modules/App.js', '    const eng = typeof src === "number" ? src : 0;\n', '');
          replaceOnce('modules/App.js', '    const { program, day, ex, slot, perf, history, weekIndex, unit } = o || {};', '    const { program, day, ex, slot, perf, history, weekIndex } = o || {};');
          replaceOnce('modules/App.js', '        const hasBarbell = isBarLike(config.equipment);\n', '');
          replaceRegexOnce('modules/App.js', /    \/\* Single primitive for the effect's dependency list\.[\s\S]*?    const retroKey = hasRetro \? `\$\{retro\.headline\}\|\$\{retro\.recs\.length\}` : "";\n/, '');
          replaceOnce('modules/App.js', '    const angArm = (sh, hOpen, hClose, sign, t) => { const { mid, end } = angLimb(sh, hOpen, hClose, 14, 13, sign, t); return { sh, el: mid, wr: end }; };\n', '');
          replaceOnce('modules/App.js', 'const [id, sessions]', 'const [, sessions]');
          replaceOnce('modules/App.js', '        const swapTRIR = parseRIRNum(swapCell.rir);\n', '');
          replaceOnce('modules/App.js', '            const cellTRIR = parseRIRNum(cell.rir);\n', '');
          replaceOnce('modules/App.js', '                const stepW = loadStep(EX_BY_ID[e.id], unit);\n', '');
          replaceOnce('modules/App.js', '        const anyChange = nextPlan.some(p => p.dir !== "hold");\n', '');
          replaceOnce('modules/App.js', '    const roundTo = (v) => { const inc = unit === "lb" ? 5 : 2.5; return Math.round(v / inc) * inc; };\n', '');
          replaceOnce('modules/App.js', '    const { rows, total, current, maxedOut, next, pct, remaining, inThousand } = snap;', '    const { rows, total, current, maxedOut, next, pct, remaining } = snap;');
          replaceOnce('modules/App.js', '    const xOf = (d, i) => padL +', '    const xOf = (d) => padL +');
          replaceOnce('modules/App.js', '    const totalOf = (b) => (b.weeks || 0) + (deloadOf(b) ? 1 : 0);\n', '');
          replaceOnce('modules/App.js', '    const doneWeeks = P.doneWeeks, pct = P.pct;', '    const pct = P.pct;');

          const testFile = 'verification/m205-engine-cleanup-test.mjs';
          const anchor = "assert.doesNotMatch(index, /app-shell-adapter/, 'Node and browser must resolve the same canonical adapter');";
          const assertions = `const retiredPureAppLocals = [\n    'const TYPE = {', 'const WEIGHT = {', 'const SPACE = {', 'const RADIUS = {',\n    'const eng = typeof src === "number" ? src : 0;',\n    'const { program, day, ex, slot, perf, history, weekIndex, unit } = o || {};',\n    'const hasBarbell = isBarLike(config.equipment);', 'const retroKey = hasRetro ?',\n    'const angArm = (sh, hOpen, hClose, sign, t) =>', 'const [id, sessions]',\n    'const swapTRIR = parseRIRNum(swapCell.rir);', 'const cellTRIR = parseRIRNum(cell.rir);',\n    'const stepW = loadStep(EX_BY_ID[e.id], unit);', 'const anyChange = nextPlan.some(p => p.dir !== "hold");',\n    'const roundTo = (v) => { const inc = unit === "lb" ? 5 : 2.5;', 'inThousand } = snap;',\n    'const xOf = (d, i) =>', 'const totalOf = (b) =>', 'const doneWeeks = P.doneWeeks, pct = P.pct;'\n];\nfor (const snippet of retiredPureAppLocals)\n    assert.equal(app.includes(snippet), false, \`pure dead App local must stay removed: \${snippet}\`);\n${anchor}`;
          replaceOnce(testFile, anchor, assertions);

          const manifestFile = 'RELEASE_MANIFEST.json';
          const manifest = JSON.parse(read(manifestFile));
          manifest.milestone = 'M211';
          manifest.build = 801;
          manifest.cache = 'pursuit-iron-production-v4-0-0-m211-app-pure-locals-b801';
          manifest.uiMilestone = 'Pursuit Iron 4.0 Production Release · M211 App Pure-Local Cleanup';
          manifest.localCandidate = {
            name: 'Pursuit Iron 4.0 Production Release · M211',
            base: 'M210 / app 4.0.0 build 800 / Engine 0.64.9',
            validation: 'Dead side-effect-free App locals and abandoned dimensional-token scaffolding removed; hooks, callbacks, prop contracts, compatibility paths, and engine behavior remain unchanged.'
          };
          manifest.runtimeHotfix = 'Prune pure dead App locals only; defer hook/callback/prop and complex calculation cleanup to separate audited passes.';
          write(manifestFile, JSON.stringify(manifest, null, 2) + '\n');

          const profileFile = 'BUILD_PROFILE.json';
          const profile = JSON.parse(read(profileFile));
          profile.milestone = 'M211';
          profile.source = 'M210 production baseline + pure-local App unused-binding audit';
          profile.engine = '0.64.9 unchanged; pure App dead locals removed';
          profile.cache = manifest.cache;
          profile.uiMilestone = manifest.uiMilestone;
          write(profileFile, JSON.stringify(profile, null, 2) + '\n');

          const changelogFile = 'CHANGELOG.md';
          const changelog = read(changelogFile);
          const entry = `## M211 — App pure-local cleanup (build 801)\n\n- Removed abandoned dimensional-token scaffolding whose values were never read.\n- Removed simple dead App reads/helpers and unused destructured fields without touching hooks, callbacks, prop contracts, or backup compatibility.\n- Added source-level cleanup invariants so the retired locals do not silently return.\n- Engine behavior remains 0.64.9; offline cache rotated for build 801.\n\n`;
          if (!changelog.startsWith('## M211')) write(changelogFile, entry + changelog);
          NODE

          node --check modules/App.js
          npm install --prefix /tmp/m211 eslint@9 --no-save --ignore-scripts --silent
          cat >eslint.m211.config.mjs <<'EOF'
          export default [{
            files: ['modules/App.js'],
            languageOptions: {
              ecmaVersion: 'latest', sourceType: 'module',
              globals: { window:'readonly',document:'readonly',navigator:'readonly',localStorage:'readonly',indexedDB:'readonly',location:'readonly',history:'readonly',crypto:'readonly',performance:'readonly',requestAnimationFrame:'readonly',cancelAnimationFrame:'readonly',setTimeout:'readonly',clearTimeout:'readonly',setInterval:'readonly',clearInterval:'readonly',fetch:'readonly',Blob:'readonly',URL:'readonly',FileReader:'readonly',HTMLElement:'readonly',MutationObserver:'readonly',ResizeObserver:'readonly',structuredClone:'readonly',console:'readonly',process:'readonly',Buffer:'readonly' }
            },
            rules: { 'no-unused-vars': ['warn',{vars:'all',args:'after-used',ignoreRestSiblings:true,argsIgnorePattern:'^_',varsIgnorePattern:'^_',caughtErrors:'none'}] }
          }];
          EOF
          /tmp/m211/node_modules/.bin/eslint modules/App.js --config ./eslint.m211.config.mjs --format json > /tmp/m211-after.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const messages = (JSON.parse(fs.readFileSync('/tmp/m211-after.json','utf8'))[0]?.messages ?? []).filter(m => m.ruleId === 'no-unused-vars');
          console.log(`M211_REMAINING_UNUSED ${messages.length}`);
          if (messages.length > 23) throw new Error(`M211 expected at most 23 remaining unused findings, got ${messages.length}`);
          for (const m of messages) console.log(`${m.line}: ${m.message}`);
          NODE
          rm eslint.m211.config.mjs

          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
          node scripts/verify-engine-contracts.mjs

      - name: Commit finalized M211 candidate
        shell: bash
        run: |
          rm -f .github/workflows/m211-pure-locals-audit.yml .github/workflows/m211-finalize.yml
          git config user.name "Pursuit Iron Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "M211 App pure-local cleanup [m211-finalized]"
          git push origin HEAD:audit/m211-app-pure-locals
