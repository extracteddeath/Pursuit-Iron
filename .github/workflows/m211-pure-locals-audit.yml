name: M211 pure App local audit

on:
  push:
    branches:
      - audit/m211-app-pure-locals

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify unused App variable declarators
        shell: bash
        run: |
          npm install --prefix /tmp/m211 eslint@9 espree@10 eslint-scope@8 --no-save --ignore-scripts --silent
          cat >eslint.m211.config.mjs <<'EOF'
          export default [{
            files: ['modules/App.js'],
            languageOptions: {
              ecmaVersion: 'latest', sourceType: 'module',
              globals: { window:'readonly',document:'readonly',navigator:'readonly',localStorage:'readonly',indexedDB:'readonly',location:'readonly',history:'readonly',crypto:'readonly',performance:'readonly',requestAnimationFrame:'readonly',cancelAnimationFrame:'readonly',setTimeout:'readonly',clearTimeout:'readonly',setInterval:'readonly',clearInterval:'readonly',fetch:'readonly',Blob:'readonly',URL:'readonly',FileReader:'readonly',HTMLElement:'readonly',MutationObserver:'readonly',ResizeObserver:'readonly',structuredClone:'readonly',console:'readonly',process:'readonly',Buffer:'readonly' }
            },
            rules: { 'no-unused-vars': ['warn',{vars:'all',args:'after-used',ignoreRestSiblings:true,argsIgnorePattern:'^_',varsIgnorePattern:'^_',caughtErrors:'none'}] }
          }];
          EOF
          /tmp/m211/node_modules/.bin/eslint modules/App.js --config ./eslint.m211.config.mjs --format json > /tmp/m211.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import * as espree from '/tmp/m211/node_modules/espree/dist/espree.cjs';
          const src=fs.readFileSync('modules/App.js','utf8');
          const messages=(JSON.parse(fs.readFileSync('/tmp/m211.json','utf8'))[0]?.messages??[]).filter(m=>m.ruleId==='no-unused-vars');
          const ast=espree.parse(src,{ecmaVersion:'latest',sourceType:'module',loc:true,range:true});
          const parents=new Map();
          (function walk(node,parent=null){ if(!node||typeof node!=='object')return; if(node.type) parents.set(node,parent); for(const [k,v] of Object.entries(node)){if(k==='parent'||k==='loc'||k==='range')continue;if(Array.isArray(v))for(const x of v)walk(x,node);else if(v&&typeof v==='object')walk(v,node);} })(ast);
          function findSmallest(line,col){let best=null;for(const node of parents.keys()){if(!node.loc)continue;const s=node.loc.start,e=node.loc.end;const after=line>s.line||(line===s.line&&col>=s.column+1);const before=line<e.line||(line===e.line&&col<=e.column+1);if(after&&before){const size=node.range[1]-node.range[0];if(!best||size<best.size)best={node,size};}}return best?.node;}
          function declFor(node){let cur=node;while(cur){if(cur.type==='VariableDeclarator')return cur;cur=parents.get(cur);}return null;}
          const out=[];
          for(const m of messages){const node=findSmallest(m.line,m.column);const d=declFor(node);if(!d)continue;const p=parents.get(d);const init=d.init?src.slice(d.init.range[0],d.init.range[1]).replace(/\s+/g,' ').slice(0,260):'';const decl=src.slice(p.range[0],p.range[1]).replace(/\s+/g,' ').slice(0,320);out.push({line:m.line,message:m.message,name:d.id.type==='Identifier'?d.id.name:'<pattern>',idType:d.id.type,initType:d.init?.type??null,init,decl});}
          console.log(`UNUSED_VARIABLE_DECLARATORS ${out.length}`);
          for(const x of out)console.log(`${x.line} | ${x.name} | id=${x.idType} init=${x.initType} | ${x.message} | DECL ${x.decl}`);
          NODE
          rm eslint.m211.config.mjs
