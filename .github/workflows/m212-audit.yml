name: M212 remaining App signature audit

on:
  push:
    branches:
      - audit/m212-signature-cleanup

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect remaining unused bindings and their call sites
        shell: bash
        run: |
          echo '=== remaining eslint findings ==='
          npm install --prefix /tmp/m212 eslint@9 --no-save --ignore-scripts --silent
          cat >eslint.m212.config.mjs <<'EOF'
          export default [{
            files: ['modules/App.js'],
            languageOptions: {
              ecmaVersion: 'latest', sourceType: 'module',
              globals: { window:'readonly',document:'readonly',navigator:'readonly',localStorage:'readonly',indexedDB:'readonly',location:'readonly',history:'readonly',crypto:'readonly',performance:'readonly',requestAnimationFrame:'readonly',cancelAnimationFrame:'readonly',setTimeout:'readonly',clearTimeout:'readonly',setInterval:'readonly',clearInterval:'readonly',fetch:'readonly',Blob:'readonly',URL:'readonly',FileReader:'readonly',HTMLElement:'readonly',MutationObserver:'readonly',ResizeObserver:'readonly',structuredClone:'readonly',console:'readonly',process:'readonly',Buffer:'readonly' }
            },
            rules: { 'no-unused-vars': ['warn',{vars:'all',args:'after-used',ignoreRestSiblings:true,argsIgnorePattern:'^_',varsIgnorePattern:'^_',caughtErrors:'none'}] }
          }];
          EOF
          /tmp/m212/node_modules/.bin/eslint modules/App.js --config ./eslint.m212.config.mjs || true
          rm eslint.m212.config.mjs

          echo '=== definitions + callsites ==='
          for q in \
            'sessionExercisePlan' 'isAxialLoad' 'StepBody' 'PlanView' 'NextWorkoutView' \
            'showWave' 'SwapSheet' 'const barbell = ' 'const arm = ' 'simulateAndAudit' \
            'WorkoutSession' 'swapRange' 'overreachSignal' 'homeCardPlan' 'onNextBlock' \
            'SettingsView' 'savedCount' 'BlockReviewView' 'GalleryView' 'setErr' \
            'propagateCycleEdits' 'handleRegenerate' 'toEngine'; do
            echo "--- $q ---"
            grep -n -F -C 2 -- "$q" modules/App.js || true
          done
