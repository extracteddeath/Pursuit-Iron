name: M212 remaining App signature audit

on:
  push:
    branches:
      - audit/m212-signature-cleanup

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ambiguous remaining bindings
        shell: bash
        run: |
          echo '=== n in SPLITS ==='
          sed -n '3198,3215p' modules/App.js
          echo '=== StepBody gaps ==='
          sed -n '11524,11543p' modules/App.js
          echo '=== simulate range ==='
          sed -n '17292,17310p' modules/App.js
          echo '=== WorkoutSession call/signature props ==='
          sed -n '17339,17349p' modules/App.js
          sed -n '28955,28978p' modules/App.js
          echo '=== swapRange block ==='
          sed -n '18558,18586p' modules/App.js
          echo '=== stale eslint-disable ==='
          sed -n '11236,11247p' modules/App.js
          echo '=== home plan exact ==='
          sed -n '23148,23175p' modules/App.js
          sed -n '24484,24495p' modules/App.js
          echo '=== propagate callback whole block ==='
          sed -n '27698,27745p' modules/App.js
