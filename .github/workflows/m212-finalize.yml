name: M212 App signature cleanup finalizer

on:
  push:
    branches:
      - audit/m212-signature-cleanup

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[m212-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m212-signature-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove proven-dead App signature plumbing and finalize M212
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = file => fs.readFileSync(file, 'utf8');
          const write = (file, text) => fs.writeFileSync(file, text);
          const replaceOnce = (file, from, to) => {
            const text = read(file);
            const first = text.indexOf(from);
            if (first < 0 || text.indexOf(from, first + from.length) >= 0)
              throw new Error(`${file}: expected exactly one match for ${from}`);
            write(file, text.slice(0, first) + to + text.slice(first + from.length));
          };
          const replaceRegexOnce = (file, re, to) => {
            const text = read(file);
            const flags = re.flags.includes('g') ? re.flags : re.flags + 'g';
            const matches = [...text.matchAll(new RegExp(re.source, flags))];
            if (matches.length !== 1) throw new Error(`${file}: expected exactly one regex match, got ${matches.length}: ${re}`);
            write(file, text.replace(re, to));
          };
          const app = 'modules/App.js';

          // Preserve positional compatibility on exported / historical seams, but make their intentionally
          // ignored parameters explicit rather than pretending the values still affect current behavior.
          replaceOnce(app, 'build: (n) => ["b531_a", "b531_b", "b531_a"]', 'build: (_n) => ["b531_a", "b531_b", "b531_a"]');
          replaceOnce(app, 'function sessionExercisePlan(session, goal = "hypertrophy", experience = "intermediate", eng = ENGINE_V) {', 'function sessionExercisePlan(session, goal = "hypertrophy", _experience = "intermediate", eng = ENGINE_V) {');
          replaceOnce(app, 'function isAxialLoad(ex, eng = 1) {', 'function isAxialLoad(ex, _eng = 1) {');
          replaceOnce(app, 'function overreachSignal(history, program) {', 'function overreachSignal(history, _program) {');
          replaceOnce(app, 'const handleRegenerate = (seed, toEngine = null, configPatch = null, metaPatch = null) => {', 'const handleRegenerate = (seed, _toEngine = null, configPatch = null, metaPatch = null) => {');
          replaceOnce(app, '`toEngine` is retained in', '`_toEngine` is retained in');

          // Pursuit Next is already the only generation path; the old boolean flag now has no branch to control.
          replaceOnce(app, ', allowModeChoice = false, nextEngineOnly = true }) {', ', allowModeChoice = false }) {');
          replaceOnce(app, 'cycleMode: true, nextEngineOnly: nextEngineOnly, onCancel:', 'cycleMode: true, onCancel:');
          replaceOnce(app, 'allowModeChoice: true, nextEngineOnly: nextEngineOnly, onCancel:', 'allowModeChoice: true, onCancel:');
          replaceRegexOnce(app, /^\s*\/\/ M46: Pursuit Next is the sole owner of all user-facing plan generation\. This is intentionally\n\s*\/\/ not a preference anymore: a testing build cannot prove the new engine if the old generator can\n\s*\/\/ still be selected or reached as a silent fallback\.\n\s*const nextEngineOnly = true;\n/m, '');

          // Wizard / view prop contracts that no longer consume these values.
          replaceOnce(app, ', nextEngineOnly, nextRecommendedSplit }) {', ', nextRecommendedSplit }) {');
          replaceOnce(app, ', nextEngineOnly: nextEngineOnly, nextRecommendedSplit: nextRecommendedSplit', ', nextRecommendedSplit: nextRecommendedSplit');
          replaceOnce(app, 'ordered.map(([k, sp, gaps, v]) => {', 'ordered.map(([k, sp, , v]) => {');
          replaceOnce(app, 'function PlanView({ program, plan, unit, onOpenDay, onOpenProgram, onBack }) {', 'function PlanView({ program, plan, onOpenDay, onOpenProgram, onBack }) {');
          replaceOnce(app, 'return (_jsx(PlanView, { program: pp, plan: planOverview(pp, wk, cyc, history), unit: unit, onOpenDay:', 'return (_jsx(PlanView, { program: pp, plan: planOverview(pp, wk, cyc, history), onOpenDay:');
          replaceOnce(app, 'function NextWorkoutView({ program, day, weekIndex, unit = "kg", loadMode = "rir",', 'function NextWorkoutView({ program, day, weekIndex, loadMode = "rir",');
          replaceOnce(app, 'return (_jsx(NextWorkoutView, { program: shown.program, day: shown.day, weekIndex: shown.weekIndex, unit: unit, loadMode: loadMode,', 'return (_jsx(NextWorkoutView, { program: shown.program, day: shown.day, weekIndex: shown.weekIndex, loadMode: loadMode,');
          replaceRegexOnce(app, /^\s*const \[showWave, setShowWave\] = useState\(false\);\n/m, '');
          replaceOnce(app, 'function SwapSheet({ ex, alts, onPick, onBanCurrent, onClose, trend, program, day, unit, sessionExerciseIds = null, scopeMode = "workout" }) {', 'function SwapSheet({ ex, alts, onPick, onBanCurrent, onClose, trend, program, day, sessionExerciseIds = null, scopeMode = "workout" }) {');
          replaceOnce(app, 'sessionExerciseIds: data.map(item => item.id), unit: unit, onPick: doSwap', 'sessionExerciseIds: data.map(item => item.id), onPick: doSwap');

          // Animation helper call shapes are retained; only the unused parameter names are made explicit.
          replaceOnce(app, 'const barbell = (cx, cy, ang = 0, half = 20) =>', 'const barbell = (cx, cy, _ang = 0, _half = 20) =>');
          replaceOnce(app, 'const arm = (sh, wr, sign) => ({ sh, el:', 'const arm = (sh, wr, _sign) => ({ sh, el:');

          // Pure calculations whose results are never read.
          replaceRegexOnce(app, /^\s*const isPrimary = slot === day\.primaryIndex;\n\s*let sets = null, sug = null;\n\s*try \{\n\s*const cell = computeCell\(program, day, ex\.id, slot, w\);\n\s*const range = cellRepRange\(cell, program, ex, isPrimary\);\n/m,
            '                let sets = null, sug = null;\n                try {\n');
          replaceRegexOnce(app, /^\s*const isP = slot === day\.primaryIndex;\n\s*const swapCell = computeCell\(program, day, newId, slot, weekIndex\);\n\s*const swapRange = \(\(\) => \{[\s\S]*?return cellRepRange\(swapCell, program, newEx, isP\);\n\s*\}\)\(\);\n/m, '');

          // Workout, home, settings, review, and gallery plumbing that no longer has a consumer.
          replaceOnce(app, 'weekIndex, unit, setUnit, perf,', 'weekIndex, unit, perf,');
          replaceOnce(app, 'weekIndex: sessionWeek, unit: unit, setUnit: chooseUnit, perf: perf,', 'weekIndex: sessionWeek, unit: unit, perf: perf,');
          replaceRegexOnce(app, /^\s*const chooseUnit = \(u\) => \{ setUnit\(u\); setUnitChosen\(true\); \};\n/m, '');
          replaceOnce(app, 'function homeCardPlan(history, { bodyweight, unit, sex, age } = {}) {', 'function homeCardPlan(history, { bodyweight } = {}) {');
          replaceOnce(app, 'homeCardPlan(history, { bodyweight, unit, sex, age }), [history, bodyweight, unit, sex, age]', 'homeCardPlan(history, { bodyweight }), [history, bodyweight]');
          replaceOnce(app, ', onDuplicate, onNextBlock, onConvertCycle,', ', onDuplicate, onConvertCycle,');
          replaceOnce(app, ', onDuplicate: handleDuplicate, onNextBlock: startNextBlock, onConvertCycle:', ', onDuplicate: handleDuplicate, onConvertCycle:');
          replaceOnce(app, ', onGyms, nextEngineOnly, theme,', ', onGyms, theme,');
          replaceOnce(app, ', historyCount, savedCount, onClearBanned,', ', historyCount, onClearBanned,');
          replaceOnce(app, ', onGyms: () => setGymsOpen(true), nextEngineOnly: nextEngineOnly, initialFocus:', ', onGyms: () => setGymsOpen(true), initialFocus:');
          replaceOnce(app, ', historyCount: history.length, savedCount: saved.length, onClearBanned:', ', historyCount: history.length, onClearBanned:');
          replaceOnce(app, 'function BlockReviewView({ cycle, blockIdx, history = [], onBack, onOpenBlock }) {', 'function BlockReviewView({ cycle, blockIdx, history = [], onBack }) {');
          replaceOnce(app, 'const [err, setErr] = useState(null);', 'const [, setErr] = useState(null);');
          replaceOnce(app, '}, [config.days, nextRecommendedSplit]); // eslint-disable-line', '}, [config.days, nextRecommendedSplit]);');

          // Cleanup invariants: M212 leaves only the separately-audited propagateCycleEdits callback.
          const testFile = 'verification/m205-engine-cleanup-test.mjs';
          const anchor = "assert.doesNotMatch(index, /app-shell-adapter/, 'Node and browser must resolve the same canonical adapter');";
          const assertions = `const retiredAppSignaturePlumbing = [\n    'build: (n) => ["b531_a", "b531_b", "b531_a"]',\n    'function sessionExercisePlan(session, goal = "hypertrophy", experience =',\n    'function isAxialLoad(ex, eng = 1)', 'function Wizard({ initialEquipment, initialExperience, initialUnit = "kg", skipUnits = false, onCancel, onDone, cycleMode: cycleModeInit = false, allowModeChoice = false, nextEngineOnly = true })',\n    'const nextEngineOnly = true;', 'nextEngineOnly, nextRecommendedSplit',\n    'ordered.map(([k, sp, gaps, v])', 'function PlanView({ program, plan, unit,',\n    'function NextWorkoutView({ program, day, weekIndex, unit =', 'const [showWave, setShowWave]',\n    'program, day, unit, sessionExerciseIds', 'const barbell = (cx, cy, ang = 0, half = 20)',\n    'const arm = (sh, wr, sign) =>', 'const range = cellRepRange(cell, program, ex, isPrimary);',\n    'weekIndex, unit, setUnit, perf,', 'const chooseUnit = (u) =>', 'const swapRange = (() =>',\n    'function overreachSignal(history, program)', 'homeCardPlan(history, { bodyweight, unit, sex, age })',\n    'onDuplicate, onNextBlock, onConvertCycle', 'onGyms, nextEngineOnly, theme',\n    'historyCount, savedCount, onClearBanned', 'onNextBlock: startNextBlock',\n    'savedCount: saved.length', 'function BlockReviewView({ cycle, blockIdx, history = [], onBack, onOpenBlock })',\n    'const [err, setErr] = useState(null);', 'toEngine = null', '// eslint-disable-line'\n];\nfor (const snippet of retiredAppSignaturePlumbing)\n    assert.equal(app.includes(snippet), false, \`dead App signature plumbing must stay removed: \${snippet}\`);\n${anchor}`;
          replaceOnce(testFile, anchor, assertions);

          const manifestFile = 'RELEASE_MANIFEST.json';
          const manifest = JSON.parse(read(manifestFile));
          manifest.milestone = 'M212';
          manifest.build = 802;
          manifest.cache = 'pursuit-iron-production-v4-0-0-m212-app-signatures-b802';
          manifest.uiMilestone = 'Pursuit Iron 4.0 Production Release · M212 App Signature Cleanup';
          manifest.localCandidate = {
            name: 'Pursuit Iron 4.0 Production Release · M212',
            base: 'M211 / app 4.0.0 build 801 / Engine 0.64.9',
            validation: 'Removed dead App prop/signature plumbing and discarded pure calculations while retaining positional compatibility seams; engine behavior unchanged.'
          };
          manifest.runtimeHotfix = 'Prune unused App props, no-op state, and discarded calculations; retain historical positional seams with explicit ignored parameters.';
          write(manifestFile, JSON.stringify(manifest, null, 2) + '\n');

          const profileFile = 'BUILD_PROFILE.json';
          const profile = JSON.parse(read(profileFile));
          profile.milestone = 'M212';
          profile.source = 'M211 production baseline + App signature/callsite audit';
          profile.engine = '0.64.9 unchanged; dead App signature plumbing removed';
          profile.cache = manifest.cache;
          profile.uiMilestone = manifest.uiMilestone;
          write(profileFile, JSON.stringify(profile, null, 2) + '\n');

          const changelogFile = 'CHANGELOG.md';
          const changelog = read(changelogFile);
          const entry = `## M212 — App signature cleanup (build 802)\n\n- Removed unused view/component props and their call-site plumbing.\n- Removed discarded simulation/swap calculations and a no-op ProgramView state hook.\n- Removed the retired next-engine-only boolean plumbing now that Pursuit Next is the sole generation path.\n- Preserved historical/exported positional seams with explicit ignored parameters instead of breaking callers.\n- Tightened the static gate: only the separately-audited cycle-propagation callback may remain unused after this release.\n- Engine behavior remains 0.64.9; offline cache rotated for build 802.\n\n`;
          if (!changelog.startsWith('## M212')) write(changelogFile, entry + changelog);
          NODE

          node --check modules/App.js
          npm install --prefix /tmp/m212 eslint@9 --no-save --ignore-scripts --silent
          cat >eslint.m212.config.mjs <<'EOF'
          export default [{
            files: ['modules/App.js'],
            languageOptions: {
              ecmaVersion: 'latest', sourceType: 'module',
              globals: { window:'readonly',document:'readonly',navigator:'readonly',localStorage:'readonly',indexedDB:'readonly',location:'readonly',history:'readonly',crypto:'readonly',performance:'readonly',requestAnimationFrame:'readonly',cancelAnimationFrame:'readonly',setTimeout:'readonly',clearTimeout:'readonly',setInterval:'readonly',clearInterval:'readonly',fetch:'readonly',Blob:'readonly',URL:'readonly',FileReader:'readonly',HTMLElement:'readonly',MutationObserver:'readonly',ResizeObserver:'readonly',structuredClone:'readonly',console:'readonly',process:'readonly',Buffer:'readonly' }
            },
            rules: { 'no-unused-vars': ['warn',{vars:'all',args:'after-used',ignoreRestSiblings:true,argsIgnorePattern:'^_',varsIgnorePattern:'^_',caughtErrors:'none'}] }
          }];
          EOF
          /tmp/m212/node_modules/.bin/eslint modules/App.js --config ./eslint.m212.config.mjs --format json > /tmp/m212-after.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const all = JSON.parse(fs.readFileSync('/tmp/m212-after.json','utf8'))[0]?.messages ?? [];
          console.log(`M212_ESLINT_MESSAGES ${all.length}`);
          for (const m of all) console.log(`${m.line}: ${m.ruleId || 'config'}: ${m.message}`);
          if (all.length !== 1 || all[0].ruleId !== 'no-unused-vars' || !all[0].message.includes("'propagateCycleEdits'"))
            throw new Error('M212 must leave exactly one known unused binding: propagateCycleEdits');
          NODE
          rm eslint.m212.config.mjs

          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
          node scripts/verify-engine-contracts.mjs

      - name: Commit finalized M212 candidate
        shell: bash
        run: |
          rm -f .github/workflows/m212-audit.yml .github/workflows/m212-finalize.yml
          git config user.name "Pursuit Iron Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "M212 App signature cleanup [m212-finalized]"
          git push origin HEAD:audit/m212-signature-cleanup
