name: M212 narrowed-assertion resume

on:
  push:
    branches:
      - audit/m212-signature-cleanup

permissions:
  contents: write

jobs:
  resume:
    if: ${{ !contains(github.event.head_commit.message, '[m212-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m212-signature-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run validated M212 finalizer with exact old-signature assertion
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/m212-finalize.yml').read_text()
          marker = '      - name: Remove proven-dead App signature plumbing and finalize M212\n'
          pos = text.index(marker)
          start = text.index('        run: |\n', pos) + len('        run: |\n')
          end = text.index('\n      - name: Commit finalized M212 candidate', start)
          block = text[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          old = "'toEngine = null'"
          new = "'const handleRegenerate = (seed, toEngine = null,'"
          if script.count(old) != 1:
              raise SystemExit(f'expected one broad assertion, found {script.count(old)}')
          script = script.replace(old, new)
          Path('/tmp/m212-finalize.sh').write_text(script)
          PY
          bash /tmp/m212-finalize.sh
      - name: Commit finalized M212 candidate
        shell: bash
        run: |
          rm -f .github/workflows/m212-audit.yml .github/workflows/m212-finalize.yml .github/workflows/m212-resume.yml
          git config user.name "Pursuit Iron Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "M212 App signature cleanup [m212-finalized]"
          git push origin HEAD:audit/m212-signature-cleanup
