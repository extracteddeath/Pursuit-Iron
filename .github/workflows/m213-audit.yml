name: M213 final unused App audit

on:
  push:
    branches:
      - audit/m213-zero-unused-app

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove final unused callback is isolated
        shell: bash
        run: |
          npm install --prefix /tmp/m213 eslint@9 --no-save --ignore-scripts --silent
          cat >eslint.m213.config.mjs <<'EOF'
          export default [{
            files: ['modules/App.js'],
            languageOptions: {
              ecmaVersion: 'latest', sourceType: 'module',
              globals: { window:'readonly',document:'readonly',navigator:'readonly',localStorage:'readonly',indexedDB:'readonly',location:'readonly',history:'readonly',crypto:'readonly',performance:'readonly',requestAnimationFrame:'readonly',cancelAnimationFrame:'readonly',setTimeout:'readonly',clearTimeout:'readonly',setInterval:'readonly',clearInterval:'readonly',fetch:'readonly',Blob:'readonly',URL:'readonly',FileReader:'readonly',HTMLElement:'readonly',MutationObserver:'readonly',ResizeObserver:'readonly',structuredClone:'readonly',console:'readonly',process:'readonly',Buffer:'readonly' }
            },
            rules: { 'no-unused-vars': ['warn',{vars:'all',args:'after-used',ignoreRestSiblings:true,argsIgnorePattern:'^_',varsIgnorePattern:'^_',caughtErrors:'none'}] }
          }];
          EOF
          /tmp/m213/node_modules/.bin/eslint modules/App.js --config ./eslint.m213.config.mjs --format json > /tmp/m213.json || true
          node <<'NODE'
          const fs=require('node:fs');
          const all=JSON.parse(fs.readFileSync('/tmp/m213.json','utf8'))[0]?.messages ?? [];
          console.log(`M213_BASELINE_MESSAGES ${all.length}`);
          for(const m of all) console.log(`${m.line}: ${m.ruleId}: ${m.message}`);
          if(all.length!==1 || all[0].ruleId!=='no-unused-vars' || !all[0].message.includes("'propagateCycleEdits'"))
            throw new Error('expected propagateCycleEdits to be the sole unused App binding');
          NODE
          rm eslint.m213.config.mjs
          echo '=== propagateCycleEdits refs ==='
          grep -n -F -C 8 'propagateCycleEdits' modules/App.js || true
          echo '=== pure helper refs ==='
          grep -n -F -C 3 'propagateCycleEditsPure' modules/App.js || true
