name: M213 zero-unused App cleanup finalizer

on:
  push:
    branches:
      - audit/m213-zero-unused-app

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[m213-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m213-zero-unused-app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove final dead App callback and finalize M213
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = file => fs.readFileSync(file, 'utf8');
          const write = (file, text) => fs.writeFileSync(file, text);
          const replaceOnce = (file, from, to) => {
            const text = read(file);
            const first = text.indexOf(from);
            if (first < 0 || text.indexOf(from, first + from.length) >= 0)
              throw new Error(`${file}: expected exactly one match for ${from}`);
            write(file, text.slice(0, first) + to + text.slice(first + from.length));
          };
          const replaceRegexOnce = (file, re, to) => {
            const text = read(file);
            const flags = re.flags.includes('g') ? re.flags : re.flags + 'g';
            const matches = [...text.matchAll(new RegExp(re.source, flags))];
            if (matches.length !== 1) throw new Error(`${file}: expected exactly one regex match, got ${matches.length}: ${re}`);
            write(file, text.replace(re, to));
          };

          const app = 'modules/App.js';
          replaceRegexOnce(
            app,
            /    \/\* When a cycle block's exercise SELECTION is edited,[\s\S]*?    const propagateCycleEdits = \(edited, before\) => \{[\s\S]*?    \};\n(?=    \/\/ Persist an in-session swap)/,
            ''
          );

          const testFile = 'verification/m205-engine-cleanup-test.mjs';
          const anchor = "assert.doesNotMatch(index, /app-shell-adapter/, 'Node and browser must resolve the same canonical adapter');";
          const assertions = `assert.equal(app.includes('const propagateCycleEdits = (edited, before) =>'), false,\n    'dead App cycle-propagation wrapper must stay removed');\nassert.match(app, /function propagateCycleEditsPure\\(/,\n    'live cycle-propagation helper must remain available to programSavePlan');\nassert.match(app, /programSavePlan[\\s\\S]*?propagateCycleEditsPure\\(/,\n    'programSavePlan must remain wired to the live cycle-propagation helper');\n${anchor}`;
          replaceOnce(testFile, anchor, assertions);

          const manifestFile = 'RELEASE_MANIFEST.json';
          const manifest = JSON.parse(read(manifestFile));
          manifest.milestone = 'M213';
          manifest.build = 803;
          manifest.cache = 'pursuit-iron-production-v4-0-0-m213-zero-unused-app-b803';
          manifest.uiMilestone = 'Pursuit Iron 4.0 Production Release · M213 Zero-Unused App';
          manifest.localCandidate = {
            name: 'Pursuit Iron 4.0 Production Release · M213',
            base: 'M212 / app 4.0.0 build 802 / Engine 0.64.9',
            validation: 'Removed the final dead App callback and stale duplicate-path commentary; App unused-binding audit is now zero while the live programSavePlan cycle-propagation path remains intact.'
          };
          manifest.runtimeHotfix = 'Remove final dead App cycle-propagation wrapper; enforce zero unused App bindings.';
          write(manifestFile, JSON.stringify(manifest, null, 2) + '\n');

          const profileFile = 'BUILD_PROFILE.json';
          const profile = JSON.parse(read(profileFile));
          profile.milestone = 'M213';
          profile.source = 'M212 production baseline + final App unused-binding isolation audit';
          profile.engine = '0.64.9 unchanged; App unused-binding count reduced to zero';
          profile.cache = manifest.cache;
          profile.uiMilestone = manifest.uiMilestone;
          write(profileFile, JSON.stringify(profile, null, 2) + '\n');

          const changelogFile = 'CHANGELOG.md';
          const changelog = read(changelogFile);
          const entry = `## M213 — zero-unused App cleanup (build 803)\n\n- Removed the final dead App callback, the retired in-component cycle-edit propagation wrapper.\n- Kept the live \`propagateCycleEditsPure\` implementation used by \`programSavePlan\` and its exported verification seam.\n- App static analysis now requires zero unused bindings; the stale comment claiming the dead wrapper was the helper's only caller is gone with it.\n- Engine behavior remains 0.64.9; offline cache rotated for build 803.\n\n`;
          if (!changelog.startsWith('## M213')) write(changelogFile, entry + changelog);
          NODE

          node --check modules/App.js
          npm install --prefix /tmp/m213 eslint@9 --no-save --ignore-scripts --silent
          cat >eslint.m213.config.mjs <<'EOF'
          export default [{
            files: ['modules/App.js'],
            languageOptions: {
              ecmaVersion: 'latest', sourceType: 'module',
              globals: { window:'readonly',document:'readonly',navigator:'readonly',localStorage:'readonly',indexedDB:'readonly',location:'readonly',history:'readonly',crypto:'readonly',performance:'readonly',requestAnimationFrame:'readonly',cancelAnimationFrame:'readonly',setTimeout:'readonly',clearTimeout:'readonly',setInterval:'readonly',clearInterval:'readonly',fetch:'readonly',Blob:'readonly',URL:'readonly',FileReader:'readonly',HTMLElement:'readonly',MutationObserver:'readonly',ResizeObserver:'readonly',structuredClone:'readonly',console:'readonly',process:'readonly',Buffer:'readonly' }
            },
            rules: { 'no-unused-vars': ['warn',{vars:'all',args:'after-used',ignoreRestSiblings:true,argsIgnorePattern:'^_',varsIgnorePattern:'^_',caughtErrors:'none'}] }
          }];
          EOF
          /tmp/m213/node_modules/.bin/eslint modules/App.js --config ./eslint.m213.config.mjs --format json > /tmp/m213-after.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const all = JSON.parse(fs.readFileSync('/tmp/m213-after.json','utf8'))[0]?.messages ?? [];
          console.log(`M213_ESLINT_MESSAGES ${all.length}`);
          for (const m of all) console.log(`${m.line}: ${m.ruleId || 'config'}: ${m.message}`);
          if (all.length !== 0) throw new Error(`M213 requires zero App lint messages, got ${all.length}`);
          NODE
          rm eslint.m213.config.mjs

          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
          node scripts/verify-engine-contracts.mjs

      - name: Commit finalized M213 candidate
        shell: bash
        run: |
          rm -f .github/workflows/m213-audit.yml .github/workflows/m213-finalize.yml
          git config user.name "Pursuit Iron Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "M213 zero-unused App cleanup [m213-finalized]"
          git push origin HEAD:audit/m213-zero-unused-app
