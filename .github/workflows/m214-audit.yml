name: M214 focused export-surface audit

on:
  push:
    branches:
      - audit/m214-repo-dead-code

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify non-App zero-reference exports
        shell: bash
        run: |
          npm install --prefix /tmp/m214 espree@10 --no-save --ignore-scripts --silent
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import * as espree from '/tmp/m214/node_modules/espree/dist/espree.cjs';

          const targets = [
            ['modules/next-engine/app-shell-adapter.js','shellPrescriptionOwners'],
            ['modules/next-engine/arm-coverage.js','armCoverageContribution'],
            ['modules/next-engine/config.js','CORE_MUSCLES'],
            ['modules/next-engine/cycles.js','recommendNextPhase'],
            ['modules/next-engine/exercise-economy.js','primaryDirectMuscles'],
            ['modules/next-engine/exercise-economy.js','isStrengthSpecificAnchor'],
            ['modules/next-engine/ledgers.js','emptyMuscleLedger'],
            ['modules/next-engine/loading.js','DEFAULT_LOADING_INVENTORY'],
            ['modules/next-engine/loading.js','nextAvailableLoad'],
            ['modules/next-engine/prescription.js','strengthLiftRegion'],
            ['modules/next-engine/progression-style.js','SUPPORTED_PROGRESSION_STYLES'],
            ['modules/next-engine/public-mev.js','PUBLIC_MEV'],
            ['modules/next-engine/public-mev.js','PUBLIC_MEV_EXPERIENCE_SCALE'],
            ['modules/next-engine/public-mev.js','publicRegionPriority'],
            ['modules/next-engine/simulation.js','weeklyProgressionStyle'],
            ['modules/next-engine/topology.js','intentPreference']
          ];

          const escape=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
          for (const [file,name] of targets) {
            const src=fs.readFileSync(file,'utf8');
            const ast=espree.parse(src,{ecmaVersion:'latest',sourceType:'module',loc:true,range:true});
            const occurrences=[];
            const re=new RegExp(`\\b${escape(name)}\\b`,'g');
            for(const m of src.matchAll(re)){
              const before=src.slice(0,m.index);
              const line=before.split('\n').length;
              const text=src.split('\n')[line-1].trim();
              occurrences.push({line,text});
            }
            let exportForm='none', declLine=null, declType=null;
            for(const node of ast.body){
              if(node.type==='ExportNamedDeclaration'){
                const d=node.declaration;
                if(d){
                  if((d.type==='FunctionDeclaration'||d.type==='ClassDeclaration')&&d.id?.name===name){ exportForm='inline';declLine=d.loc.start.line;declType=d.type; }
                  if(d.type==='VariableDeclaration') for(const x of d.declarations) if(x.id.type==='Identifier'&&x.id.name===name){ exportForm='inline';declLine=x.loc.start.line;declType=x.init?.type||'Variable'; }
                }
                for(const s of node.specifiers||[]) if(s.exported?.name===name||s.local?.name===name) exportForm='specifier';
              }
              if(node.type==='FunctionDeclaration'&&node.id?.name===name){declLine=node.loc.start.line;declType=node.type;}
              if(node.type==='VariableDeclaration') for(const x of node.declarations) if(x.id.type==='Identifier'&&x.id.name===name){declLine=x.loc.start.line;declType=x.init?.type||'Variable';}
            }
            console.log(`TARGET ${file} | ${name} | export=${exportForm} | decl=${declType}@${declLine} | own_occurrences=${occurrences.length}`);
            for(const o of occurrences) console.log(`  ${o.line}: ${o.text}`);
          }
          NODE
