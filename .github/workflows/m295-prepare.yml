          -  padding:14px 15px 13px!important;
          +  padding:var(--pi-space-3) var(--pi-space-3) var(--pi-space-2)!important;
             margin-top:0!important;
             margin-bottom:var(--pi-space-3)!important;
             border-color:var(--pi-r48-divider)!important;
          @@ -5257,7 +5254,7 @@ body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-r
             overflow-wrap:anywhere;
           }
           #root[data-pi-motion="expressive"] .wpb .wpb-home-hero>.wpb-primary-action{
          -  margin-top:var(--pi-space-3)!important;
          +  margin-top:var(--pi-space-2)!important;
           }
           #root[data-pi-motion="expressive"] .wpb .wpb-plan-overview{
             margin-block:var(--pi-space-6) var(--pi-space-3);
          @@ -8223,17 +8220,41 @@ body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-r
             #root .wpb-cycle-change-preview{border-color:CanvasText;}
           }
           
          +/* Cohesion 23 — one token-owned Home rhythm; callbacks and order are unchanged. */
          +#root .wpb .wpb-home-hero>.wpb-primary-action{
          +  display:flex;align-items:center;justify-content:center;gap:var(--pi-space-2);
