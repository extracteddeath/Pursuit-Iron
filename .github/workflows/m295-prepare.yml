          index d353cd2..d2a9c9d 100644
          --- a/app.css
          +++ b/app.css
          @@ -1430,11 +1430,8 @@ body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-r
             padding-top:0!important;
           }
