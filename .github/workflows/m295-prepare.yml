name: Prepare M295 release
on:
  push:
    branches: [release/m295-complete-integration]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Apply reviewed changes and certify release
        shell: bash
        run: |
          cat > /tmp/m295.patch <<'M295_PATCH'
          diff --git a/CHANGELOG.md b/CHANGELOG.md
          index 8d3fed6..386fa40 100644
          --- a/CHANGELOG.md
          +++ b/CHANGELOG.md
          @@ -1,3 +1,9 @@
          +## M295 — Finish workout alignment and enforce custom load increments
          +
          +- Finish M294's compact, horizontally accessible exercise tags and top-aligned workout actions. Match numeric headings to the full-bleed row in both the phone flex layout and the tablet companion grid.
          +- Route custom-program advice through the same equipment boundary as generated programs. Held loads, per-set targets and cross-program/unit-converted references honor the exercise increment or actual rack; earned increases still reach the next selectable load. Logged history is unchanged.
          +- Extend the existing custom progression regression with 38.5 lb on 5 lb equipment, converted/reference history, executable set rows, earned increases and explicitly fractional stock. Retain Build 905 / Engine 0.65.9 and refresh release/offline hashes.
          +
           ## M292 — Progress and History presentation ownership
           
           - Move 225 fixed inline style objects from the four Progress panes into the maintained CSS family. Shared card, caption, field, list-row and history-action classes retain the current appearance; action/field owners also remove 32 repeated CSS declarations. Five chart objects keep only calculated widths/heights and data-derived ink inline.
          diff --git a/app.css b/app.css
          index ac680d3..d353cd2 100644
          --- a/app.css
          +++ b/app.css
          @@ -5932,6 +5932,10 @@ body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-r
               min-width:0;
               max-width:100%;
             }
          +  /* Grid items retain the full-bleed row padding inside their border box. */
          +  #root .wpb-workout[data-focus-mode="false"] .wpb-workout-scroll:has(>.wpb-workout-side)>.wpb-set-head{
          +    width:calc(100% - 36px);
          +  }
             #root[data-pi-motion="expressive"] .wpb .wpb-workout-scroll>.wpb-workout-side{
               box-sizing:border-box;
               display:block;
          @@ -6972,13 +6976,14 @@ body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-r
             color:var(--pi-color-on-muted)!important;
             letter-spacing:.25px!important;
           }
          -/* M294: the tablet/foldable logger insets set-row content 4px left and
          -   32px right. Align its heading to those measured tracks; phone-sized
          -   logger rows use full-width tracks and must retain their own geometry. */
          -@media(min-width:700px){
          +/* M294: normal logger set rows start after the 4px row border.
          +   The heading must share their measured numeric tracks,
          +   instead of centering labels across a wider card. Compact phones use
          +   the labels attached to their own field tracks below. */
          +@media(min-width:421px){
             #root .wpb-workout[data-focus-mode="false"] .wpb-set-head{
               box-sizing:border-box;
          -    width:calc(100% - 36px);
          +    width:calc(100% - 4px);
               margin-left:4px;
             }
           }
          @@ -7993,7 +7998,8 @@ body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-r
           }
           #root .wpb-workout[data-focus-mode="true"] .wpb-exercise-meta{
             display:flex;align-items:center;flex-wrap:wrap;column-gap:12px;row-gap:0;
          -  margin-top:2px;min-width:0;
          +  /* Preserve Focus spacing independently of exercise-detail presentation. */
          +  margin:6px 0 14px;min-width:0;
           }
           #root .wpb-workout .wpb-progression-explanation{flex-basis:100%;}
           #root .wpb-workout .wpb-workout-tools{
          diff --git a/modules/App.js b/modules/App.js
          index bedbe58..77d0c1c 100644
          --- a/modules/App.js
          +++ b/modules/App.js
          @@ -2048,7 +2048,7 @@ function StyleTag({ theme } = {}) {
                 .wpb-exercise-detail-header{padding-left:16px!important;padding-right:16px!important;background:${C.bg}!important;}
                 .wpb-exercise-detail-body{padding-left:16px!important;padding-right:16px!important;background:${C.bg}!important;}
                 .wpb-exercise-figure-wrap{margin-bottom:10px!important;}
          -      .wpb-exercise-meta{margin-top:6px!important;margin-bottom:14px!important;color:${C.muted}!important;}
          +      .wpb-exercise-detail .wpb-exercise-meta{margin-top:6px!important;margin-bottom:14px!important;color:${C.muted}!important;}
                 .wpb-exercise-tabs{margin-bottom:14px!important;background:${C.bg}!important;border:1px solid var(--section-rule)!important;}
                 .wpb-exercise-tabs>button{min-height:36px!important;font-size:12.5px!important;font-weight:650!important;}
                 .wpb-exercise-history-session{
          diff --git a/modules/training-domain/prescriptions.js b/modules/training-domain/prescriptions.js
          index c0b09e6..f8d951b 100644
          --- a/modules/training-domain/prescriptions.js
          +++ b/modules/training-domain/prescriptions.js
          @@ -712,9 +712,11 @@ function dayPerfFor(day, perf, history, program = null) {
           
           function engineSessionSuggestion(program, day, slot, dayPerf, unit, weekIndex, history) {
               void dayPerf;
          -    if (program?.custom === true && program?.engineSource !== "pursuit-next")
          -        return customProgramSuggestion(program, day, slot, unit, weekIndex, history);
          -    const original = nextWorkoutSuggestionForShell(program, history || [], EXERCISES, day, slot, weekIndex, unit);
          +    // Custom and generated programs share the same final equipment boundary.
          +    // A converted/reference load or held per-set target can otherwise bypass snapping.
          +    const original = program?.custom === true && program?.engineSource !== "pursuit-next"
          +        ? customProgramSuggestion(program, day, slot, unit, weekIndex, history)
          +        : nextWorkoutSuggestionForShell(program, history || [], EXERCISES, day, slot, weekIndex, unit);
               const convert = value => convertHistoryLoad(value, original?.unit ?? program.config?.unit, unit);
               const s = original ? { ...original, weight: convert(original.weight),
                   last: original.last,
          diff --git a/verification/b896-expressive-workout-browser-test.mjs b/verification/b896-expressive-workout-browser-test.mjs
          index c0df2fd..927c2a8 100644
          --- a/verification/b896-expressive-workout-browser-test.mjs
          +++ b/verification/b896-expressive-workout-browser-test.mjs
          @@ -133,7 +133,7 @@ try {
             assert.ok(toolbar.count>=4,'Preserve exercise actions including warm-up and session notes');
             assert.ok(toolbar.rows.every(y=>Math.abs(y)<=2),'Warm-up/Superset/Swap/Notes/Plates remain in one line: '+JSON.stringify(toolbar));
             assert.equal(toolbar.overflow,'auto','Toolbar must be horizontally scrollable');
          -  assert.ok(toolbar.top-heading.progression.bottom<=36,'Remove unused space below progression: '+JSON.stringify({heading,toolbar}));
          +  assert.ok(toolbar.top-heading.progression.bottom<=16,'Remove unused space below progression: '+JSON.stringify({heading,toolbar}));
             if(width<=393){
              assert.ok(toolbar.scrollWidth>toolbar.clientWidth+8,'Phone action strip should be wider than viewport and swipeable');
              const scroll=await page.$eval('.wpb-workout-tools',el=>{el.scrollLeft=el.scrollWidth;return el.scrollLeft;});
          diff --git a/verification/custom-progression-safety-test.mjs b/verification/custom-progression-safety-test.mjs
          index 0f752c7..2c050aa 100644
          --- a/verification/custom-progression-safety-test.mjs
          +++ b/verification/custom-progression-safety-test.mjs
          @@ -1,5 +1,6 @@
           import assert from 'node:assert/strict';
          -import { sessionSuggestion, computeCell } from '../modules/App.js';
          +import { sessionSuggestion, computeCell, prescribeSets, EX_BY_ID } from '../modules/App.js';
          +import { setExLoadInc } from '../modules/training-domain/records.js';
           const program={id:'custom1',custom:true,config:{unit:'lb'},overrides:{'d1:0':{sets:3,reps:'5-8',rir:'2',progressionStyle:'double'}},days:[{id:'d1',exercises:['back-squat']}]};
           const history=[{programId:'custom1',dayId:'d1',date:Date.now(),unit:'lb',perf:{'back-squat':{weight:215,reps:2,sets:[
            {w:200,r:3,rir:null,done:true},{w:205,r:3,rir:null,done:true},{w:210,r:2,rir:null,done:true},{w:215,r:2,rir:0,done:true}
          @@ -49,3 +50,33 @@ console.log('PASS custom 10-15 array range: 10s hold/build; only 15s across all
           const setScheduleProgram={id:'custom-set-schedule',custom:true,config:{unit:'lb',weeks:4},overrides:{'d3:0':{sets:[5,3,3,4],reps:'8-12',rir:'2'}},days:[{id:'d3',primaryIndex:0,exercises:['back-squat']}]};
           assert.deepEqual([1,2,3,4].map(week=>computeCell(setScheduleProgram,setScheduleProgram.days[0],'back-squat',0,week).sets),[5,3,3,4]);
           console.log('PASS custom set schedule: computeCell preserves 5/3/3/4 across weeks 1–4.');
          +
          +// Fractional history and unit-converted references must pass the SAME loadability
          +// boundary as generated plans. Logged observations themselves remain untouched.
          +const gridProgram = { id: 'custom-grid', custom: true, config: { unit: 'lb' },
          +    overrides: { 'grid:0': { sets: 3, reps: '8-12', rir: '2', progressionStyle: 'double' } },
          +    days: [{ id: 'grid', primaryIndex: 0, exercises: ['inc-curl'] }] };
          +const gridDay = gridProgram.days[0], gridEx = EX_BY_ID['inc-curl'];
          +const gridHistory = (load, unit = 'lb', owner = gridProgram.id, reps = 9) => [{
          +    id: 'grid-log', programId: owner, dayId: gridDay.id, date: 1, unit,
          +    perf: { 'inc-curl': { weight: load, reps, sets: Array.from({ length: 3 }, () => ({ w: load, r: reps, rir: 2, done: true })) } }
          +}];
          +setExLoadInc({ 'inc-curl': { v: 5, unit: 'lb' } });
          +try {
          +    for (const [load, unit, owner] of [[38.5, 'lb', gridProgram.id], [17.5, 'kg', gridProgram.id],
          +        [38.5, 'lb', 'previous-program'], [17.5, 'kg', 'previous-program']]) {
          +        const hs = gridHistory(load, unit, owner), before = structuredClone(hs);
          +        const suggestion = sessionSuggestion(gridProgram, gridDay, 0, null, 'lb', 1, hs);
          +        assert.equal(suggestion.weight, 35, '5 lb equipment cannot suggest 38.5 or a raw converted reference');
          +        assert.ok((suggestion.setTargets ?? []).every(t => t.weight % 5 === 0));
          +        const rows = prescribeSets(gridProgram, gridDay, gridEx, 0, 1, 'lb', suggestion, null, {}, hs, false);
          +        assert.ok(rows.filter(s => !s.warm && !s.sub).every(s => Number(s.weight) % 5 === 0));
          +        assert.deepEqual(hs, before, 'rounding prescriptions never rewrites logged weights');
          +    }
          +    const earned = sessionSuggestion(gridProgram, gridDay, 0, null, 'lb', 1, gridHistory(35, 'lb', gridProgram.id, 12));
          +    assert.equal(earned.weight, 40, 'earned increases still reach the next selectable load');
          +    setExLoadInc({ 'inc-curl': { v: 0.5, unit: 'lb' } });
          +    assert.equal(sessionSuggestion(gridProgram, gridDay, 0, null, 'lb', 1, gridHistory(38.5)).weight, 38.5,
          +        'explicit fractional equipment increments remain valid');
          +} finally { setExLoadInc({}); }
          +console.log('PASS custom load grid: 38.5 lb and converted references snap to 35 on 5 lb equipment; earned increases and real fractional stock preserved.');
          M295_PATCH
          git apply --check /tmp/m295.patch
          git apply /tmp/m295.patch
          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
          git rm .github/workflows/m295-prepare.yml
          git config user.name 'extracteddeath'
          git config user.email '92632906+extracteddeath@users.noreply.github.com'
          git add modules/App.js app.css modules/training-domain/prescriptions.js CHANGELOG.md verification/b896-expressive-workout-browser-test.mjs verification/custom-progression-safety-test.mjs BUILD_PROFILE.json RELEASE_MANIFEST.json sw.js
          git commit -m 'M295: integrate workout and equipment fixes; certify complete release'
          git push origin HEAD:release/m295-complete-integration
