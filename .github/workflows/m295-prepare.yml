name: Prepare M295 release
on:
  push:
    branches: [release/m295-complete-integration]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Apply reviewed changes and certify release
        shell: bash
        run: |
          cat > /tmp/m295.patch <<'M295_PATCH'
          diff --git a/CHANGELOG.md b/CHANGELOG.md
          index 386fa40..8b1400d 100644
          --- a/CHANGELOG.md
          +++ b/CHANGELOG.md
          @@ -1,7 +1,8 @@
          -## M295 — Finish workout alignment and enforce custom load increments
          +## M295 — Complete cohesion integration and enforce custom load increments
           
           - Finish M294's compact, horizontally accessible exercise tags and top-aligned workout actions. Match numeric headings to the full-bleed row in both the phone flex layout and the tablet companion grid.
           - Route custom-program advice through the same equipment boundary as generated programs. Held loads, per-set targets and cross-program/unit-converted references honor the exercise increment or actual rack; earned increases still reach the next selectable load. Logged history is unchanged.
          +- Recover remaining Cohesion 23/24 Home action ownership, compact preview/change-history spacing and complete Plan mode labels at enlarged text. Preserve the newer shared app bars, weekly-card hierarchy and sticky-header behavior.
           - Extend the existing custom progression regression with 38.5 lb on 5 lb equipment, converted/reference history, executable set rows, earned increases and explicitly fractional stock. Retain Build 905 / Engine 0.65.9 and refresh release/offline hashes.
           
           ## M292 — Progress and History presentation ownership
          diff --git a/DESIGN_SYSTEM.md b/DESIGN_SYSTEM.md
          index 5e51619..01ad128 100644
          --- a/DESIGN_SYSTEM.md
          +++ b/DESIGN_SYSTEM.md
          @@ -175,3 +175,7 @@ The existing Profile family owns the level card’s layout, level marker, title/
           The main `HistoryView` uses the maintained Progress CSS family for fixed presentation. Reuse named card, support/caption, growth/alignment, field, row and history-action owners; do not return paint, spacing or typography to JSX. Native `aria-selected`, `aria-pressed`, `aria-current` and `disabled` state owns control paint. Data attributes describe existing presentation states; they must not become parallel filtering, history, progression or volume calculations. The five remaining inline objects carry only chart widths, range height and data-derived chart ink. Publish consumed palette roles once through `applyTheme`.
           
           Retire a superseded declaration at its original owner. Same-selector declarations may be removed only when a later declaration in the same at-rule scope fully wins; preserve separate media/forced-color states. The existing inline-masked group-header font rule is retired. M292 removes 225 inline objects and ten embedded priorities: ceilings are 2,800 inline, 1,229 embedded, 2,360 external and 15 repeated priorities. Progress helper cards/charts retain their separate existing owners pending later migration.
          +
          +### M295 integration of remaining cohesion work
          +
          +Home Start and Switch program actions use maintained classes and shared tokens. The preview owns one inset; compact change history remains secondary to the workout. Cohesion 24 spacing supersedes Cohesion 23's overlapping row-spacing proposal. The current root app bars, This week placement and attached sticky headers retain their newer owners. Plan mode labels reflow in narrow/enlarged-text rails instead of truncating. Workout metadata must not inherit exercise-detail margins; Focus keeps its own spacing.
