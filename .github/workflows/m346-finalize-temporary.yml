name: M346 candidate release finalizer (temporary)
on:
  push:
    branches: [engine/m346-plateau-evidence]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ github.actor == 'extracteddeath' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Finalize runtime release and cache fingerprint
        run: |
          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
      - name: Commit finalized release assets to feature branch
        run: |
          if ! git diff --quiet -- sw.js BUILD_PROFILE.json RELEASE_MANIFEST.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sw.js BUILD_PROFILE.json RELEASE_MANIFEST.json
            git commit -m "M346: certify production runtime and refresh offline cache"
            git push origin HEAD:engine/m346-plateau-evidence
          fi
