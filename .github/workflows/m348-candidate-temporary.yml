name: M348 candidate release verification (temporary)
on:
  push:
    branches: [engine/m348-observed-volume-response]
permissions:
  contents: write
jobs:
  candidate:
    if: ${{ github.actor == 'extracteddeath' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify volume-response tests
        run: |
          node verification/m348-observed-volume-response-test.mjs
          node verification/m231-athlete-response-test.mjs
          node verification/m347-stagnation-decision-test.mjs
      - name: Finalize signed runtime and new offline cache
        run: |
          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
      - name: Commit updated release assets
        run: |
          if ! git diff --quiet -- sw.js BUILD_PROFILE.json RELEASE_MANIFEST.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sw.js BUILD_PROFILE.json RELEASE_MANIFEST.json
            git commit -m "M348: certify production runtime and offline cache"
            git push origin HEAD:engine/m348-observed-volume-response
          fi
