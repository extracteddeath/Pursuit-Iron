name: M351 reproduce selected preview
on:
  push:
    branches: [fix/m351-created-session-preview]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/b899-stable-screen-browser-test.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: m351-baseline-reproduction
          path: verification/m351*-phone.png
          retention-days: 7
