name: Assemble M353 candidate
on:
  push:
    branches: [improvement/m353-cycle-preview-current-week]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Certify offline release and retire assembly workflow
        run: |
          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/App.js BUILD_PROFILE.json RELEASE_MANIFEST.json sw.js
          git rm .github/workflows/m353-finalize.yml
          git commit -m "M353: certify saved-week preview and retire assembly"
          git push origin HEAD:improvement/m353-cycle-preview-current-week
