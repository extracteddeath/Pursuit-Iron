name: Assemble M354 candidate
on:
  push:
    branches: [improvement/m354-cycle-exercises-first]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check and finalize cycle-preview release
        run: |
          node --check modules/App.js
          node --check verification/b890-cycle-browsing-browser-test.mjs
          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/App.js app.css BUILD_PROFILE.json RELEASE_MANIFEST.json sw.js
          git rm .github/workflows/m354-finalize.yml
          git commit -m "M354: certify exercise-first cycle preview and retire assembly"
          git push origin HEAD:improvement/m354-cycle-exercises-first
