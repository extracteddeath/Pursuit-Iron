name: Assemble M357 live transition candidate
on:
  push:
    branches: [fix/m357-live-cycle-transition-dose]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check live cycle transition and finalize
        run: |
          node --check modules/App.js
          node --check verification/b890-cycle-browsing-browser-test.mjs
          node --check verification/cycle-overview-ui-test.mjs
          node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/cycle-overview-ui-test.mjs
          node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/m304-realized-week-volume-test.mjs
          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/App.js BUILD_PROFILE.json RELEASE_MANIFEST.json sw.js
          git rm .github/workflows/m357-finalize.yml
          git commit -m "M357: certify live phase-boundary dose and retire assembly"
          git push origin HEAD:fix/m357-live-cycle-transition-dose
