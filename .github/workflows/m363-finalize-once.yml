name: M363 one-time branch release finalizer
on:
  push:
    branches:
      - refactor/m363-plan-session-surfaces
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Finalize app build and source-hash manifest
        run: |
          node scripts/finalize-release.mjs --next-build
          node scripts/verify-release.mjs
      - name: Commit exact candidate and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m363-finalize-once.yml
          git add RELEASE_MANIFEST.json BUILD_PROFILE.json modules/App.js index.html sw.js
          git commit -m 'Build 910: finalize plan session ownership release and offline cache'
          git push origin HEAD:refactor/m363-plan-session-surfaces
