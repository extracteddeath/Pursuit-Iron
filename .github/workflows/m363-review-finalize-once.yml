name: M363 program review candidate finalizer
on:
  push:
    branches: [refactor/m363-program-review-ownership]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Finalize release and validate integrity
        run: |
          node scripts/finalize-release.mjs --next-build
          node scripts/verify-release.mjs
      - name: Commit candidate and retire one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m363-review-finalize-once.yml
          git add RELEASE_MANIFEST.json BUILD_PROFILE.json modules/App.js index.html sw.js
          git commit -m 'Build 911: finalize Program review CSS and offline release'
          git push origin HEAD:refactor/m363-program-review-ownership
