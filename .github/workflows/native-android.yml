name: Native Android
on:
  push:
    branches: [native-app]
    paths: ['native/**', 'modules/**', '.github/workflows/native-android.yml']
  workflow_dispatch:

concurrency:
  group: native-android-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Set these as repository variables (Settings → Secrets and variables → Actions → Variables).
      # PI_APP_ID must be the package name of the current Play listing so this ships as an update.
      PI_APP_ID: ${{ vars.PI_APP_ID || 'io.github.extracteddeath.pursuitiron' }}
      PI_VERSION_CODE_BASE: ${{ vars.PI_VERSION_CODE_BASE || '1000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Core tests and engine bundle
        working-directory: native/core
        run: |
          npm ci --no-audit --no-fund
          node build.mjs
          npm test

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.8.1'

      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.PI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "PI_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "::notice title=Signing::Release bundle will be signed with the upload key."
          else
            echo "::notice title=Signing::No PI_KEYSTORE_BASE64 secret; the release bundle is unsigned. The debug APK installs anywhere."
          fi

      - name: Build
        working-directory: native/android
        env:
          PI_KEYSTORE_PASSWORD: ${{ secrets.PI_KEYSTORE_PASSWORD }}
          PI_KEY_ALIAS: ${{ secrets.PI_KEY_ALIAS }}
          PI_KEY_PASSWORD: ${{ secrets.PI_KEY_PASSWORD }}
        run: |
          set -o pipefail
          VC=$(( PI_VERSION_CODE_BASE + GITHUB_RUN_NUMBER ))
          echo "::notice title=Version::appId=$PI_APP_ID versionCode=$VC"
          gradle --no-daemon --console=plain assembleDebug bundleRelease \
            -PappId="$PI_APP_ID" -PversionCode="$VC" 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Compiler output is reported as annotations so it can be read without log access.
      - name: Errors 1-10
        if: failure()
        run: |
          L="$RUNNER_TEMP/build.log"; [ -f "$L" ] || exit 0
          { grep -E '^e: ' "$L"; grep -E '^ *[0-9]+\. +Dependency|requires|minCompileSdk|AAPT: error|error: |Lint found' "$L"; grep -A3 -E '^\* What went wrong' "$L" | grep -vE '^\* What went wrong|^--$'; } \
            | awk '!seen[$0]++' > "$RUNNER_TEMP/errors.txt" || true
          wc -l < "$RUNNER_TEMP/errors.txt" | xargs -I{} echo "::notice title=Error count::{}"
          sed -n '1,10p' "$RUNNER_TEMP/errors.txt" | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | while IFS= read -r l; do echo "::error::$l"; done
      - name: Errors 11-20
        if: failure()
        run: sed -n '11,20p' "$RUNNER_TEMP/errors.txt" 2>/dev/null | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | while IFS= read -r l; do echo "::error::$l"; done
      - name: Errors 21-30
        if: failure()
        run: sed -n '21,30p' "$RUNNER_TEMP/errors.txt" 2>/dev/null | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | while IFS= read -r l; do echo "::error::$l"; done
      - name: Errors 31-40
        if: failure()
        run: sed -n '31,40p' "$RUNNER_TEMP/errors.txt" 2>/dev/null | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | while IFS= read -r l; do echo "::error::$l"; done
      - name: Errors 41-50
        if: failure()
        run: sed -n '41,50p' "$RUNNER_TEMP/errors.txt" 2>/dev/null | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | while IFS= read -r l; do echo "::error::$l"; done

      - name: Outputs
        if: success()
        run: |
          ls -la native/android/app/build/outputs/apk/debug native/android/app/build/outputs/bundle/release | while IFS= read -r l; do echo "::notice::$l"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: pursuit-iron-native-${{ github.run_number }}
          path: |
            native/android/app/build/outputs/apk/debug/*.apk
            native/android/app/build/outputs/bundle/release/*.aab
            native/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

  # Runs the debug build on an emulator through the main flows; screenshots come back as an artifact.
  smoke:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write   # only to force-push screenshots to the scratch branch native-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pursuit-iron-native-${{ github.run_number }}
          path: out
      - name: Handoff link and APK path
        run: |
          node native/android/smoke/handoff-link.mjs "$RUNNER_TEMP/link.txt"
          echo "APK=$(find out -name '*-debug.apk' | head -1)" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator run
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb install -r "$APK" && python3 native/android/smoke/smoke.py "${{ vars.PI_APP_ID || 'io.github.extracteddeath.pursuitiron' }}.dev" smoke-out "$RUNNER_TEMP/link.txt"
      - name: Result
        if: always()
        run: |
          [ -f smoke-out/result.txt ] && while IFS= read -r l; do echo "::notice title=Smoke::$l"; done < smoke-out/result.txt || echo "::warning title=Smoke::no result file"
          [ -s smoke-out/logcat-errors.txt ] && head -8 smoke-out/logcat-errors.txt | while IFS= read -r l; do echo "::error title=logcat::$l"; done || true
      - name: Screens to the native-smoke branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -d smoke-out ] || exit 0
          cd smoke-out
          git init -q && git checkout -q -b native-smoke
          git add -A && git -c user.name=pi-ci -c user.email=pi-ci@users.noreply.github.com commit -qm "Smoke screens, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" native-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-screens-${{ github.run_number }}
          path: smoke-out
          retention-days: 14
