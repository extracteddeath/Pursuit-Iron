name: Native beta integrated source gate (no APK)

on:
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/native-beta-integrated-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-beta-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-kotlin-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android compile platform
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify integrated Kotlin domains, coach persistence and Compose compilation
        working-directory: android-native
        run: >
          gradle :kotlin-engine:testDebugUnitTest
          :native-coach-store:testDebugUnitTest
          :domain-contract:testDebugUnitTest
          :app:compileDebugKotlin
          --no-daemon --stacktrace
      - name: Check out frozen web engine for actual matched executions
        uses: actions/checkout@v4
        with:
          ref: 903b4a78564590d8983e651cbe19d81acd1efb9c
          path: comparison-legacy
      - name: Execute matched web and Kotlin progression and equipment probes
        run: |
          node android-native/kotlin-engine/verification/run-paired-progression.mjs --legacy-root comparison-legacy --check-current
          node android-native/kotlin-engine/verification/run-paired-functional.mjs --legacy-root comparison-legacy --check-current
      - name: Preserve fresh paired raw engine outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-beta-fresh-web-kotlin-pairs
          path: |
            android-native/kotlin-engine/build/reports/paired-progression*.json
            android-native/kotlin-engine/build/reports/paired-functional*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verify Kotlin-only ownership, lifecycle navigation and safe resume
        run: |
          node android-native/kotlin-engine/verification/offline-only-test.mjs
          node android-native/verification/kotlin-lab-navigation-test.mjs
          node android-native/verification/kotlin-train-resume-test.mjs
          node android-native/verification/no-apk-before-end-to-end-test.mjs
      - name: Audit parity and superiority without assuming a pass
        run: |
          node android-native/kotlin-engine/verification/engine-superiority-gate.mjs --self-test
          node android-native/kotlin-engine/verification/engine-superiority-gate.mjs --audit --write-report
      - name: Publish truthful superiority evidence summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'android-native/kotlin-engine/reports/engine-superiority-audit.json';
          const output = process.env.GITHUB_STEP_SUMMARY;
          if (!fs.existsSync(path)) {
            fs.appendFileSync(output, '## Engine evidence audit\\n\\nNo audit report was produced; superiority is unverified.\\n');
            process.exit(0);
          }
          const audit = JSON.parse(fs.readFileSync(path, 'utf8'));
          const rows = [
            '## Engine evidence audit',
            '',
            '| Field | Measured status |',
            '| --- | --- |',
            '| Verdict | ' + String(audit.verdict) + ' |',
            '| Completed paired proofs | ' + String(audit.completedPairs) + ' / ' + String(audit.requiredPairs) + ' |',
            '| Missing paired proofs | ' + String(audit.missingPairs) + ' |',
            '| Demonstrated improvement domains | ' + String((audit.improvedDomains || []).length) + ' |',
            '| Open blockers | ' + String((audit.blockers || []).length) + ' |',
            '',
            'A green source gate is **not** a parity, device-readiness, or superiority certificate.',
            ''
          ];
          fs.appendFileSync(output, rows.join('\\n'));
          NODE
      - name: Preserve superiority audit for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-beta-superiority-audit
          path: android-native/kotlin-engine/reports/engine-superiority-audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce absence of legacy runtime on app release classpath
        working-directory: android-native
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > /tmp/pursuit-native-release-dependencies.txt
          if grep -E 'project :(engine-runtime|engine-bridge)( |$)' /tmp/pursuit-native-release-dependencies.txt; then
            echo "::error::Legacy engine module present on release runtime classpath"
            exit 1
          fi
          echo "No legacy engine-runtime or engine-bridge project dependency detected."
