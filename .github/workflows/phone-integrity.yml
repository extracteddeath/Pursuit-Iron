name: Phone and offline integrity
on:
  push:
    branches: [main, 'verification/**', 'engine/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test: [m178-pwa-update, m199-volume-repair, m201-workout-prescription, m214-executable-prescription-sync, m215-cycle-duration, m217-android-lifecycle, m218-phone-polish, m219-ui-integration, m220-day-progression, m222-custom-program-parity, m225-percentage-workout]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Verify real-browser behavior
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/${{ matrix.test }}-browser-test.mjs
      - name: Upload phone verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-${{ matrix.test }}
          path: verification/*-phone.png
          if-no-files-found: ignore
          retention-days: 7
