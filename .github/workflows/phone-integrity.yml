name: Phone and offline integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [lifecycle, workout, program, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Verify browser contract shard
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/verify-browser-contracts.mjs ${{ matrix.shard }}
      - name: Upload phone verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-${{ matrix.shard }}
          path: verification/*-phone.png
          if-no-files-found: ignore
          retention-days: 7
