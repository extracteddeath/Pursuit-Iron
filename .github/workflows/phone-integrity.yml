name: Phone and offline integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [lifecycle, workout, program, integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install browser harness
        run: npm install --no-save --ignore-scripts --no-audit --no-fund puppeteer-core@25.12.0
      - name: Verify browser contract shard
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/verify-browser-contracts.mjs ${{ matrix.shard }}
      - name: Upload phone verification screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phone-${{ matrix.shard }}
          path: verification/*-phone.png
          if-no-files-found: ignore
          retention-days: 7
