name: One-shot web catalog release stamp preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  stamp:
    if: github.head_ref == 'feature/web-requested-exercise-variants-20261117'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calculate exact next web build and offline manifest without publishing
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p='RELEASE_MANIFEST.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.uiMilestone='Build '+(m.build+1)+' · Exercise variants, attachment discovery and truthful bench angles'; fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');"
          node scripts/finalize-release.mjs --next-build
          for f in RELEASE_MANIFEST.json BUILD_PROFILE.json sw.js index.html; do
            printf 'STAMP_OUTPUT_%s=' "$f"
            base64 -w0 "$f"
            printf '\n'
          done
