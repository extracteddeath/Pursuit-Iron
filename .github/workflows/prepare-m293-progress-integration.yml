name: Prepare M293 integrated release
on:
  push:
    branches:
      - codex/m293-progress-history-integration
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate verified offline manifest for merged source
        run: node scripts/finalize-release.mjs
      - name: Verify release and contracts
        run: node scripts/verify-release.mjs
      - name: Commit certified files and remove one-time workflow
        run: |
          rm .github/workflows/prepare-m293-progress-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BUILD_PROFILE.json RELEASE_MANIFEST.json sw.js .github/workflows/prepare-m293-progress-integration.yml
          git diff --cached --quiet || git commit -m 'Certify M292 Progress integration and remove preparation workflow'
          git push origin HEAD:codex/m293-progress-history-integration
