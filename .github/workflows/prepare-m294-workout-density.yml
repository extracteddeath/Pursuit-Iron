name: Prepare M294 workout alignment release
on:
  push:
    branches:
      - ui/m294-workout-density-columns
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize exact offline and release hashes
        run: node scripts/finalize-release.mjs
      - name: Verify release source, signatures and contracts
        run: node scripts/verify-release.mjs
      - name: Commit verified hashes and remove one-time workflow
        run: |
          rm .github/workflows/prepare-m294-workout-density.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BUILD_PROFILE.json RELEASE_MANIFEST.json sw.js .github/workflows/prepare-m294-workout-density.yml
          git diff --cached --quiet || git commit -m 'Certify M294 workout alignment and remove preparation workflow'
          git push origin HEAD:ui/m294-workout-density-columns
