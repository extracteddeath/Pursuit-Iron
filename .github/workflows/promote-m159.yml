name: Promote tested M159 candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-m159.yml
      - scripts/promote-m159.mjs
      - scripts/write-m159-small.mjs

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact tested M159 candidate
        run: |
          node scripts/promote-m159.mjs
          node scripts/write-m159-small.mjs
          node --check modules/App.js
          node --check modules/next-engine/cycle-runtime-adapter.js
          node scripts/verify-release.mjs
          grep -q "3.209.0" modules/App.js
          grep -q "Turn into training cycle" modules/App.js
          ! grep -q 'children: "Start next block"' modules/App.js
      - name: Commit M159
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/App.js modules/next-engine/cycle-runtime-adapter.js index.html sw.js BUILD_PROFILE.json CHANGELOG.md RELEASE_MANIFEST.json scripts/verify-release.mjs M159_CHANGED_FILES.json M159_HANDOFF.md
          git rm scripts/promote-m159.mjs scripts/write-m159-small.mjs .github/workflows/promote-m159.yml
          git commit -m 'Release M159 standalone program cycle conversion'
          git push
