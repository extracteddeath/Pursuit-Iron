name: R51 one-time release finalization
on:
  push:
    branches: ['ui/m3-expressive-r51-color-hierarchy']
permissions:
  contents: write
jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'R51: run release finalization')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Recalculate canonical release metadata
        run: node scripts/finalize-release.mjs
      - name: Verify release before committing
        run: node scripts/verify-release.mjs
      - name: Commit certified artifacts back to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE_MANIFEST.json BUILD_PROFILE.json sw.js index.html modules/App.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "R51: finalize exact offline and UI release fingerprints"
          git push origin HEAD:ui/m3-expressive-r51-color-hierarchy
