name: R57 one-shot release certification
on:
  push:
    branches: [ui/r57-cross-screen-header-density]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[r57-finalized]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Certify offline shell and runtime fingerprints
        run: |
          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/App.js index.html sw.js RELEASE_MANIFEST.json BUILD_PROFILE.json
          git diff --cached --quiet || (git commit -m "R57 recertify Plan typography and shell [r57-finalized]" && git push)
