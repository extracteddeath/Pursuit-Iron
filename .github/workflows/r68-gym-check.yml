name: Temporary Build 848 sheet check
on:
  push:
    branches: [ui/r68-plan-support-pane-848]
    paths:
      - verification/b846-gym-bar-weights-browser-test.mjs
      - .github/workflows/r68-gym-check.yml
permissions:
  contents: read
jobs:
  gym:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify real gym sheet geometry on phone and laptop
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node verification/b846-gym-bar-weights-browser-test.mjs
