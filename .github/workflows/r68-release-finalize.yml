name: Temporary R68 release finalizer
on:
  push:
    branches: [ui/r68-plan-support-pane-848]
    paths:
      - index.html
      - .github/workflows/r68-release-finalize.yml

permissions:
  contents: write

concurrency:
  group: r68-finalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Finalize Build 848 deterministically
        run: |
          node scripts/finalize-release.mjs
          node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/m173-pwa-resilience-test.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js BUILD_PROFILE.json RELEASE_MANIFEST.json modules/App.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: certify Build 848 release cache and hashes"
            git push origin HEAD:ui/r68-plan-support-pane-848
          fi
