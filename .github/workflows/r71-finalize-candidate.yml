name: Temporary R71 candidate finalizer
on:
  push:
    branches: [ui/r71-adaptive-builder-851]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ui/r71-adaptive-builder-851
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Finalize shell hashes and remove temporary workflow
        run: |
          node scripts/finalize-release.mjs
          rm .github/workflows/r71-finalize-candidate.yml
          git add modules/App.js index.html sw.js RELEASE_MANIFEST.json BUILD_PROFILE.json .github/workflows/r71-finalize-candidate.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Build 851: finalize certified hashes and remove temporary helper"
          git push origin HEAD:ui/r71-adaptive-builder-851
