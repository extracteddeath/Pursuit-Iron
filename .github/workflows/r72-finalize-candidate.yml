name: Temporary R72 candidate finalizer
on:
  push:
    branches: [release/build-852-r72-workout-adaptive]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: release/build-852-r72-workout-adaptive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Finalize exact assets and self-remove helper
        run: |
          node scripts/finalize-release.mjs
          rm .github/workflows/r72-finalize-candidate.yml
          git add modules/App.js index.html sw.js RELEASE_MANIFEST.json BUILD_PROFILE.json .github/workflows/r72-finalize-candidate.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Build 852: finalize certified asset hashes and remove temporary helper"
          git push origin HEAD:release/build-852-r72-workout-adaptive
