name: R73 one-time theme contrast audit
on:
  push:
    branches: [ui/r73-contrast-states-854]
permissions:
  contents: read
concurrency:
  group: r73-contrast-854
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Measure real rendered Plan and Progress states in 20 themes
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node verification/m219-ui-integration-browser-test.mjs
