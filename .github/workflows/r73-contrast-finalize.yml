name: R73 one-time indicator preservation preflight
on:
  push:
    branches: [ui/r73-contrast-states-854]
permissions:
  contents: write
concurrency:
  group: r73-finalize-854
  cancel-in-progress: true
jobs:
  verify-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preserve the original animated selection indicator
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node verification/b831-expressive-motion-browser-test.mjs
      - name: Verify responsive hover and press without moving selection
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node verification/r65-adaptive-shell-browser-test.mjs
      - name: Audit rendered contrast in all 20 palettes
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node verification/m219-ui-integration-browser-test.mjs
      - name: Finalize offline assets and integrity hashes
        run: node scripts/finalize-release.mjs
      - name: Self-remove and checkpoint Build 854
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/r73-contrast-finalize.yml
          git add -- modules/App.js index.html sw.js BUILD_PROFILE.json RELEASE_MANIFEST.json
          git commit -m "Build 854: finalize selected-indicator-safe theme states"
          git push origin HEAD:ui/r73-contrast-states-854
