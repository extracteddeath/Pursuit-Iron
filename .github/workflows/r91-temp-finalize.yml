name: R91 temporary release finalizer

on:
  push:
    branches: [improvement/b872-r91-home-hierarchy]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[finalize-r91]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Finalize offline release manifest
        run: |
          node scripts/finalize-release.mjs
          node scripts/verify-release.mjs
          git add modules/App.js index.html sw.js BUILD_PROFILE.json RELEASE_MANIFEST.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(R91): finalize exact B872 release hashes [release-finalized]"
          git push origin HEAD:improvement/b872-r91-home-hierarchy
