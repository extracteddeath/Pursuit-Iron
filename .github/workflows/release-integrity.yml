name: Release integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-release:
    # Draft commits are incomplete candidate snapshots. Verify only when the
    # PR becomes ready (or is updated while ready); always verify on main.
    # This avoids noisy, predictable failure notifications while authoring.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # Read-only PR build artifact; never push from pull_request CI.
      - name: Generate proposed next web release build
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/refresh-converted-custom-cycle-strength-variety-20261118' }}
        run: node scripts/finalize-release.mjs --next-build
      - name: Export next release build files
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/refresh-converted-custom-cycle-strength-variety-20261118' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: converted-cycle-build-1017-certification
          path: |
            RELEASE_MANIFEST.json
            BUILD_PROFILE.json
            sw.js
            modules/App.js
            index.html
          if-no-files-found: error
      - name: Restore sources for ordinary release gate
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/refresh-converted-custom-cycle-strength-variety-20261118' }}
        run: git restore -- RELEASE_MANIFEST.json BUILD_PROFILE.json sw.js modules/App.js index.html
      - name: Verify release package
        run: node scripts/verify-release.mjs
        env:
          PURSUIT_RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
