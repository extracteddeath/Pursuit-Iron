name: Release integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-release:
    # Draft commits are incomplete candidate snapshots. Verify only when the
    # PR becomes ready (or is updated while ready); always verify on main.
    # This avoids noisy, predictable failure notifications while authoring.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Candidate shell asset checksums (diagnostic)
        run: sha256sum favicon.ico gallery.json icons/icon-192-aa9e4b77f520.png icons/icon-512-5bdeae240e55.png icons/icon-maskable-512-1d7393c9a2de.png
      - name: Verify release package
        run: node scripts/verify-release.mjs
        env:
          PURSUIT_RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
