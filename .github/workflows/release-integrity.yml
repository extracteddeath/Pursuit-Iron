name: Release integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production runtime
        run: node scripts/verify-release.mjs

  m173-harden:
    if: github.event_name == 'push'
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply M173 candidate
        run: python scripts/m173-promote.py
      - name: Verify M173 focused and full gates
        run: node scripts/verify-release.mjs
      - name: Publish verified M173 and restore release workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/release-integrity.yml <<'YAML'
          name: Release integrity

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            verify-release:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Verify production runtime
                  run: node scripts/verify-release.mjs
          YAML
          rm -f .github/workflows/m173-hardening.yml scripts/m173-promote.py
          git config user.name "Pursuit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "M173: integration and bootstrap resilience hardening"
          git push origin HEAD:main
