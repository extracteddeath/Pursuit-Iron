name: Snapshot export

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  export:
    if: "!contains(github.event.head_commit.message, '[snapshot-cleanup]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source snapshot
        run: |
          tar --exclude=.git --exclude=.github/workflows/snapshot-export.yml -czf /tmp/pursuit-iron-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: pursuit-iron-source
          path: /tmp/pursuit-iron-source.tgz
          if-no-files-found: error
      - name: Remove temporary workflow
        run: |
          git config user.name "Pursuit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/snapshot-export.yml
          git commit -m "chore: remove snapshot exporter [snapshot-cleanup]"
          git push
