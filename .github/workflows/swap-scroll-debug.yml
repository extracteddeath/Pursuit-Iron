name: Swap scroll debug

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/swap-scroll-debug.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture swap scrolling source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('modules/App.js').read_text()
          lines=s.splitlines()
          needles=['sheetDragRef','wpb-swap-results','.wpb-scroll','touchAction','touch-action','Swap Exercise']
          ranges=[]
          for needle in needles:
              for i,l in enumerate(lines):
                  if needle in l:
                      ranges.append((max(0,i-16), min(len(lines),i+28), needle))
          ranges.sort()
          merged=[]
          for a,b,n in ranges:
              if merged and a <= merged[-1][1] + 3:
                  merged[-1]=(merged[-1][0], max(merged[-1][1],b), merged[-1][2]+' | '+n)
              else:
                  merged.append((a,b,n))
          out=[]
          for a,b,n in merged:
              out.append(f'=== {n} :: lines {a+1}-{b} ===')
              out.extend(f'{j+1}: {lines[j]}' for j in range(a,b))
              out.append('')
          Path('SWAP_DEBUG.txt').write_text('\n'.join(out))
          PY
          git config user.name "Pursuit Debug Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SWAP_DEBUG.txt
          git commit -m "chore: capture swap scroll source" || true
          git push
