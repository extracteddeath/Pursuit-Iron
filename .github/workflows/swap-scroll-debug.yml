name: Swap scroll debug

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/swap-scroll-debug.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture swap scrolling source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('modules/App.js').read_text().splitlines()
          out=[]
          def dump(title, idx, before, after):
              a=max(0,idx-before); b=min(len(lines),idx+after)
              out.append(f'=== {title} :: lines {a+1}-{b} ===')
              out.extend(f'{j+1}: {lines[j]}' for j in range(a,b))
              out.append('')
          swap=[i for i,l in enumerate(lines) if 'wpb-swap-results' in l]
          for n,i in enumerate(swap): dump(f'wpb-swap-results #{n+1}',i,45,120)
          refs=[i for i,l in enumerate(lines) if 'sheetDragRef' in l and ('const ' in l or 'function ' in l or '=>' in l)]
          for n,i in enumerate(refs[:4]): dump(f'sheetDragRef definition #{n+1}',i,25,85)
          Path('SWAP_DEBUG.txt').write_text('\n'.join(out))
          PY
          git config user.name "Pursuit Debug Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SWAP_DEBUG.txt
          git commit -m "chore: narrow swap scroll source" || true
          git push
