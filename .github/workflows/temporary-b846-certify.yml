name: Temporary Build 846 certification
on:
  push:
    branches: [fix/b846-gym-bar-masses]
permissions:
  contents: write
jobs:
  certify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify real gym bar masses and plate math
        run: node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/b846-gym-bar-weights-test.mjs
      - name: Verify import and graph integrity
        run: |
          node --no-warnings --experimental-loader ./verification/import-loader.mjs verification/m235-engine-verification-test.mjs
          node verification/m236-verification-topology-test.mjs
      - name: Finalize offline and UI hashes
        run: node scripts/finalize-release.mjs
      - name: Verify release
        run: node scripts/verify-release.mjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE_MANIFEST.json BUILD_PROFILE.json sw.js modules/App.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Certify Build 846 gym bar weights"
            git push origin HEAD:fix/b846-gym-bar-masses
          fi
